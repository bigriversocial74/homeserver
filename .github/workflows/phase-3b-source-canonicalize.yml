name: Phase 3B Source Canonicalizer

on:
  push:
    branches:
      - feature/phase-3b-signed-updates-20260724

permissions:
  contents: write

concurrency:
  group: phase3b-source-canonicalize
  cancel-in-progress: true

jobs:
  canonicalize:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3b-signed-updates-20260724

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Apply exact update module cleanup
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          main = Path('crates/homeserver-service/src/main.rs')
          text = main.read_text(encoding='utf-8')
          text = text.replace('mod update;\nmod update_store;', 'mod update;\nmod update_apply;\nmod update_store;')
          text = text.replace('update::verify_staged_installer_at', 'update_apply::verify_staged_installer')
          text = text.replace('update::prepare_and_launch_updater_at', 'update_apply::prepare_and_launch')
          main.write_text(text, encoding='utf-8')

          update = Path('crates/homeserver-service/src/update.rs')
          text = update.read_text(encoding='utf-8')
          text = re.sub(r'\npub fn prepare_and_launch_updater\(.*?\n}\n\npub fn consume_application_result', '\n\npub fn consume_application_result', text, flags=re.S)
          text = re.sub(r'\npub fn verify_staged_installer\(.*?\n}\n\nfn secure_client', '\n\nfn secure_client', text, flags=re.S)
          text = re.sub(r'\ntrait UpdateRecordPath \{.*?\n}\n\nimpl UpdateRecordPath for UpdateRecord \{.*?\n}\n\n#\[cfg\(test\)\]', '\n\n#[cfg(test)]', text, flags=re.S)
          text = text.replace(', SERVICE_NAME,', ',')
          text = text.replace('use uuid::Uuid;\n', '')
          text = text.replace('use microgifter_homeserver_core::{UpdateChannel, UpdateInstallerContract};', 'use microgifter_homeserver_core::UpdateChannel;')
          update.write_text(text, encoding='utf-8')
          '@ | Set-Content phase3b_patch.py -Encoding UTF8
          python phase3b_patch.py
          Remove-Item phase3b_patch.py
          cargo fmt --all
          git diff --check

      - name: Commit canonical source and remove helper
        shell: pwsh
        run: |
          git rm .github/workflows/phase-3b-source-canonicalize.yml
          git add crates/homeserver-service/src/main.rs crates/homeserver-service/src/update.rs crates/homeserver-service/src/update_apply.rs crates/homeserver-service/src/http.rs crates/homeserver-service/src/app.rs crates/homeserver-service/src/update_store.rs crates/homeserver-updater/src/main.rs crates/homeserver-core/src/lib.rs
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          git commit -m "Canonicalize signed update service boundaries"
          git push origin HEAD:feature/phase-3b-signed-updates-20260724
