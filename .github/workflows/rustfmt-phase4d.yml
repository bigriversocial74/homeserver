name: Phase 4D Rustfmt Apply

on:
  push:
    branches:
      - feature/phase-4d-semantic-vault-search-20260726

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-4d-semantic-vault-search-20260726
      - name: Install Rust formatting tool
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Apply and commit formatter output
        shell: pwsh
        run: |
          cargo fmt --all
          if (-not (git diff --quiet)) {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/homeserver-service/src/main.rs crates/homeserver-service/src/semantic_vault.rs src-tauri/src/vault.rs
            git commit -m "Format Phase 4D Rust sources"
            git push origin HEAD:feature/phase-4d-semantic-vault-search-20260726
          }
