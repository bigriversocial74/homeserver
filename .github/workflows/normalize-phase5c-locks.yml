name: Normalize Phase 5C dependency locks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-5c-review-intelligence-campaign-actions-20260728
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Generate exact production lock state
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          npm install --package-lock-only --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff -- Cargo.lock package-lock.json
      - name: Commit generated lock state
        shell: pwsh
        run: |
          if ((git diff --name-only -- Cargo.lock package-lock.json).Count -eq 0) {
            Write-Host 'Dependency locks are already normalized.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.lock package-lock.json
          git commit -m 'Normalize Phase 5C dependency locks'
          git push origin HEAD:feature/phase-5c-review-intelligence-campaign-actions-20260728
