name: Normalize Phase 5C dependency locks

on:
  push:
    branches:
      - feature/phase-5c-review-intelligence-campaign-actions-20260728
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: normalize-phase5c-locks
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-5c-review-intelligence-campaign-actions-20260728
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24'
          cache: npm
      - name: Generate normalized dependency locks
        shell: bash
        run: |
          set -euo pipefail
          cargo metadata --format-version 1 >/dev/null
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff -- Cargo.lock package-lock.json | tee lock-diff.patch
      - name: Upload normalized locks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5c-normalized-locks
          path: |
            Cargo.lock
            package-lock.json
            lock-diff.patch
          retention-days: 2
