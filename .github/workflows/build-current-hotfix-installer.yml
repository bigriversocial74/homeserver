name: Build Current Hotfix Installer

on:
  push:
    branches:
      - hotfix/agent-chat-notifications-clean-20260729
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: build-current-hotfix-installer
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out current hotfix source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hotfix/agent-chat-notifications-clean-20260729
          fetch-depth: 1

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Validate current frontend
        shell: pwsh
        run: npm run check:frontend

      - name: Build production frontend
        shell: pwsh
        run: npm run build

      - name: Build NSIS installer
        shell: pwsh
        run: npm run tauri:build -- --bundles nsis

      - name: Collect installer and checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri\target\release\bundle\nsis -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $installer.FullName artifact\Microgifter-HomeServer-v0.1.3-Latest-UI-Setup.exe
          Get-FileHash artifact\Microgifter-HomeServer-v0.1.3-Latest-UI-Setup.exe -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Microgifter-HomeServer-v0.1.3-Latest-UI
          path: artifact/Microgifter-HomeServer-v0.1.3-Latest-UI-Setup.exe
          if-no-files-found: error
          retention-days: 7
