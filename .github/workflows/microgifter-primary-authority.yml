name: Microgifter Primary HomeServer Authority

on:
  pull_request:
    paths:
      - "crates/homeserver-service/src/config.rs"
      - "crates/homeserver-service/src/software_authority.rs"
      - "crates/homeserver-service/src/microgifter_connection.rs"
      - "database/migrations/0033_microgifter_primary_software_authority.sql"
      - "src/main.js"
      - "src/vp3-authority.js"
      - "scripts/validate-microgifter-primary-authority.py"
      - "scripts/validate-vp3-authority-ui.py"
      - "docs/microgifter-primary-authority-restoration.md"
      - ".github/workflows/microgifter-primary-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: microgifter-primary-authority-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact candidate identity
        shell: bash
        run: |
          expected='${{ github.event.pull_request.head.sha || github.sha }}'
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          echo "Validated exact candidate $actual"

      - name: Configure stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Configure Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Validate authority contracts
        run: |
          python scripts/validate-microgifter-primary-authority.py
          python scripts/validate-vp3-authority-ui.py

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate optional VP3 module syntax
        run: node --check src/vp3-authority.js

      - name: Build Control Center
        run: npm run build

      - name: Validate Rust formatting
        run: cargo fmt --all -- --check

      - name: Compile and test HomeServer service
        run: cargo test -p microgifter-homeserver-service

      - name: Strict HomeServer service lint
        run: cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings
