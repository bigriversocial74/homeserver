name: Build Notification Fix Test Installer

on:
  push:
    branches:
      - hotfix/agent-chat-dead-controls-20260728
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: notification-fix-test-installer
  cancel-in-progress: true

jobs:
  build-installer:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hotfix/agent-chat-dead-controls-20260728
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci

      - name: Validate current frontend
        shell: pwsh
        run: npm run check:frontend

      - name: Build production frontend
        shell: pwsh
        run: npm run build

      - name: Build Windows NSIS installer
        shell: pwsh
        run: npm run tauri:build -- --bundles nsis

      - name: Collect installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path src-tauri\target\release\bundle\nsis -Filter *.exe -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced.' }
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item $installer.FullName artifact\Microgifter-HomeServer-v0.1.3-Notification-Fix-Setup.exe
          Get-FileHash artifact\Microgifter-HomeServer-v0.1.3-Notification-Fix-Setup.exe -Algorithm SHA256 | Format-List

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Microgifter-HomeServer-v0.1.3-Notification-Fix
          path: artifact/Microgifter-HomeServer-v0.1.3-Notification-Fix-Setup.exe
          if-no-files-found: error
          retention-days: 7
