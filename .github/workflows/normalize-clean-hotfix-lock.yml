name: Normalize Clean Hotfix Lock

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - hotfix/agent-chat-notifications-clean-20260729

permissions:
  contents: write

concurrency:
  group: normalize-clean-hotfix-lock
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out clean branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hotfix/agent-chat-notifications-clean-20260729
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Regenerate Cargo lockfile
        shell: pwsh
        run: cargo generate-lockfile

      - name: Commit normalized lock and remove helper
        shell: pwsh
        run: |
          Remove-Item .github/workflows/normalize-clean-hotfix-lock.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/normalize-clean-hotfix-lock.yml
          git commit -m "Normalize Cargo lock for clean hotfix"
          git push origin HEAD:hotfix/agent-chat-notifications-clean-20260729
