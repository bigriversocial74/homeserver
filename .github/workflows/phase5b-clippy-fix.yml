name: Repair Phase 5B strict Clippy

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5b-clippy-fix
  cancel-in-progress: false

jobs:
  repair:
    if: github.head_ref == 'feature/phase-5b-multi-connection-supervised-agents-20260727'
    runs-on: windows-2025
    steps:
      - name: Check out Phase 5B branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-5b-multi-connection-supervised-agents-20260727
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Remove superseded worker and honor MSRV
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/repair-phase5b-clippy.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --package microgifter-homeserver-service --all-targets --locked -- -D warnings *> clippy-fix.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content clippy-fix.log -Tail 240
            exit $LASTEXITCODE
          }

          $allowed = @(
            'crates/homeserver-service/src/cloud_connector.rs',
            'crates/homeserver-service/src/cloud_registry.rs'
          )
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Clippy repair changed unexpected files: $($unexpected -join ', ')"
          }
          if ($changed.Count -eq 0) {
            Write-Host 'Strict Clippy repair is already applied.'
            exit 0
          }
          git add -- $allowed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Repair Phase 5B strict Clippy findings'
          git push origin HEAD:feature/phase-5b-multi-connection-supervised-agents-20260727

      - name: Upload Clippy repair diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5b-clippy-repair-log
          path: clippy-fix.log
          if-no-files-found: warn
          retention-days: 7
