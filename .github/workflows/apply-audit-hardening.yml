name: Apply HomeServer Audit Hardening

on:
  push:
    branches:
      - audit/full-production-hardening-20260725
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-homeserver-audit-hardening
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/full-production-hardening-20260725
          fetch-depth: 0

      - name: Reconstruct and apply audited patch
        shell: bash
        run: |
          cat .audit-patch/part-* > "$RUNNER_TEMP/hardening.diff.gz.b64"
          echo "5945c9f7241baed92e0eb9e136cd4b2f268f62ae157062639a5dbfd74d136c74  $RUNNER_TEMP/hardening.diff.gz.b64" | sha256sum -c -
          base64 --decode "$RUNNER_TEMP/hardening.diff.gz.b64" | gzip -d > "$RUNNER_TEMP/hardening.diff"
          echo "e7dbad07b533e42aceca09d372aa21c9ee0a3f469359905eb3fd5519e33027a8  $RUNNER_TEMP/hardening.diff" | sha256sum -c -
          git apply -p1 --check "$RUNNER_TEMP/hardening.diff"
          git apply -p1 "$RUNNER_TEMP/hardening.diff"
          rm -rf .audit-patch
          rm -f .github/workflows/apply-audit-hardening.yml
          rm -rf scripts/__pycache__
          git diff --check
          python scripts/validate-security-boundaries.py

      - name: Commit hardening pass
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden HomeServer production boundaries and release quality"
          git push origin HEAD:audit/full-production-hardening-20260725
