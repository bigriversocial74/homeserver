name: Phase 17 Native Repair PR

on:
  pull_request:
    paths:
      - .github/workflows/phase17-native-repair-pr.yml
      - crates/homeserver-service/src/app/wrapper_runtime.rs

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Repair native runtime source once
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/homeserver-service/src/app/wrapper_runtime.rs")
          text = path.read_text(encoding="utf-8")

          for name in ("read_tools", "read_plans", "read_steps", "read_receipts"):
              marker = f"fn {name}("
              start = text.index(marker)
              next_start = text.find("\nfn ", start + len(marker))
              if next_start < 0:
                  next_start = len(text)
              block = text[start:next_start]
              old_first = "    statement\n        .query_map"
              new_first = "    let values = statement\n        .query_map"
              old_suffix = "        .collect::<rusqlite::Result<Vec<_>>>()\n        .map_err(Into::into)"
              new_suffix = "        .collect::<rusqlite::Result<Vec<_>>>()?;\n    Ok(values)"
              if old_first in block:
                  if block.count(old_first) != 1 or block.count(old_suffix) != 1:
                      raise SystemExit(f"unexpected query shape in {name}")
                  block = block.replace(old_first, new_first, 1)
                  block = block.replace(old_suffix, new_suffix, 1)
                  text = text[:start] + block + text[next_start:]
              elif new_first not in block or new_suffix not in block:
                  raise SystemExit(f"unrecognized repaired query shape in {name}")

          old = "        step.job.causation_id = previous_job_id.clone();\n        step.job.expires_minutes = step.job.expires_minutes.min(request.expires_minutes);"
          new = "        step.job.causation_id = previous_job_id.clone();\n        step.job.priority = Some(5);\n        step.job.expires_minutes = step.job.expires_minutes.min(request.expires_minutes);"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("unrecognized runtime plan priority shape")

          old = '''    ensure!(
              tool.allowed_job_types
                  .iter()
                  .any(|value| value == &job.job_type),
              "runtime tool does not allow this job type"
          );
          enforce_tool_restrictions(&row.9, &tool.adapter_key)?;'''
          new = '''    ensure!(
              tool.allowed_job_types
                  .iter()
                  .any(|value| value == &job.job_type),
              "runtime tool does not allow this job type"
          );
          ensure!(
              job.max_execution_seconds <= tool.max_execution_seconds,
              "runtime job execution limit exceeds the tool catalog limit"
          );
          enforce_tool_restrictions(&row.9, &tool.adapter_key)?;'''
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("unrecognized runtime execution-limit shape")

          old = "use std::{collections::BTreeSet, sync::Arc, time::Duration as StdDuration};"
          new = "use std::{sync::Arc, time::Duration as StdDuration};"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("unrecognized BTreeSet import shape")

          old = "mod tests {\n    use super::*;"
          new = "mod tests {\n    use super::*;\n    use std::collections::BTreeSet;"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("unrecognized test module shape")

          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check
          if git diff --quiet; then
            echo "Phase 17 source is already repaired."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-service/src/app/wrapper_runtime.rs
          git commit -m "Repair Phase 17 native runtime compilation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
