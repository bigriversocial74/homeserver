name: Add Agent Chat logo dashboard link

on:
  push:
    branches:
      - hotfix/agent-chat-dead-controls-20260728
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: add-agent-chat-logo-dashboard-link
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hotfix/agent-chat-dead-controls-20260728
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Link Agent Chat logo to dashboard
        run: python scripts/add-agent-chat-logo-dashboard-link.py

      - name: Validate frontend and production build
        run: |
          npm ci
          npm run check:frontend
          npm run build

      - name: Commit clean product change
        run: |
          rm .github/workflows/add-agent-chat-logo-dashboard-link.yml
          rm scripts/add-agent-chat-logo-dashboard-link.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/homeserver-agent-chat.js src/homeserver-agent-chat.css scripts/validate-agent-chat-route.py .github/workflows/add-agent-chat-logo-dashboard-link.yml scripts/add-agent-chat-logo-dashboard-link.py
          git commit -m "Link Agent Chat logo to dashboard"
          git push origin HEAD:hotfix/agent-chat-dead-controls-20260728
