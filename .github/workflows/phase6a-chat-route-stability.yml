name: Stabilize Agent Chat route

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: phase6a-chat-route-stability
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feature/homeserver-agent-chat-connection-ui-v1-20260728'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/homeserver-agent-chat-connection-ui-v1-20260728
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Preserve the active Agent Chat canvas
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/main.js")
          text = path.read_text(encoding="utf-8")
          anchor = "function render() {\n  const restorePending = Boolean(backupCatalog?.restore_pending || statusSnapshot?.restore_pending);\n"
          replacement = "function render() {\n  if (window.location.hash === \"#agent\" && app.querySelector('[data-homeserver-chat-mounted=\"true\"]')) return;\n  const restorePending = Boolean(backupCatalog?.restore_pending || statusSnapshot?.restore_pending);\n"
          if "data-homeserver-chat-mounted" not in text:
              if anchor not in text:
                  raise SystemExit("Control Center render anchor not found")
              text = text.replace(anchor, replacement, 1)
          path.write_text(text, encoding="utf-8")
          '@ | python -

      - name: Validate frontend
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/homeserver-agent-chat.js
          npm ci
          npm run check:frontend
          npm run build

      - name: Commit repair and remove helper
        shell: pwsh
        run: |
          Remove-Item .github/workflows/phase6a-chat-route-stability.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js .github/workflows/phase6a-chat-route-stability.yml
          if (-not (git diff --cached --quiet)) {
            git commit -m "Preserve active Agent Chat during health refresh"
            git push origin HEAD:feature/homeserver-agent-chat-connection-ui-v1-20260728
          }
