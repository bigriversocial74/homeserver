name: Phase 23 One-Time Test Fixture Fix

on:
  push:
    branches:
      - feature/phase-23-agent-chat-ears-conversation-engine

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-23-agent-chat-ears-conversation-engine
          fetch-depth: 0
      - name: Install canonical Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Repair fixture, format, and remove workflow
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/homeserver-service/src/audio_runtime.rs')
          text = path.read_text(encoding='utf-8')
          needle = '''        connection
              .execute(
                  "INSERT INTO agent_messages(message_id,thread_id,role,mode,content,context_json,created_at_utc) VALUES('msg_link','thread_link','user','ask','hello','{}','2026-08-01T00:00:02.000Z')",
                  [],
              )
              .expect("message");
          '''
          replacement = '''        connection
              .execute(
                  "INSERT INTO agent_threads(thread_id,title,state,created_at_utc,updated_at_utc) VALUES('thread_link','Linked transcript','active','2026-08-01T00:00:00.000Z','2026-08-01T00:00:00.000Z')",
                  [],
              )
              .expect("thread");
          ''' + needle
          if text.count(needle) != 1:
              raise SystemExit('expected committed-link fixture was not found exactly once')
          path.write_text(text.replace(needle, replacement), encoding='utf-8')
          PY
          cargo fmt --all
          git rm --force .github/workflows/phase23-test-fixture-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-service/src/audio_runtime.rs
          git commit -m "Repair Phase 23 linked-message test fixture"
          git push origin HEAD:feature/phase-23-agent-chat-ears-conversation-engine
