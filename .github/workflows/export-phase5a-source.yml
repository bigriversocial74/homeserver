name: Diagnose Phase 5A MCP Runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-5a-local-readonly-mcp-20260727
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore Production Quality Rust cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.toml', '**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Reconstruct and verify source patch
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem '.phase5a-payload' -Filter 'part-*.bin' | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 payload parts, found $($parts.Count)." }
          $output = [System.IO.File]::Open('phase5a.patch.gz', [System.IO.FileMode]::Create)
          try {
            foreach ($part in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
              $output.Write($bytes, 0, $bytes.Length)
            }
          } finally { $output.Dispose() }
          if ((Get-FileHash 'phase5a.patch.gz' -Algorithm SHA256).Hash.ToLowerInvariant() -ne '8a1ae56abe4d387403654b60a107b0b5da39c67281f55fb8c3531b7dbdf9f185') { throw 'Compressed checksum mismatch.' }
          $input = [System.IO.File]::OpenRead('phase5a.patch.gz')
          $gzip = [System.IO.Compression.GZipStream]::new($input, [System.IO.Compression.CompressionMode]::Decompress)
          $patch = [System.IO.File]::Create('phase5a.patch')
          try { $gzip.CopyTo($patch) } finally { $patch.Dispose(); $gzip.Dispose(); $input.Dispose() }
          if ((Get-FileHash 'phase5a.patch' -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'b3278f336f259b8494d96892a02baac1bacc4f66679a78ac912d15f49f8eebb8') { throw 'Source checksum mismatch.' }
          git apply --check phase5a.patch
          git apply phase5a.patch
          Remove-Item '.phase5a-payload' -Recurse -Force
          Remove-Item '.github/workflows/export-phase5a-source.yml' -Force
          Remove-Item 'phase5a.patch.gz', 'phase5a.patch' -Force
          cargo fmt --all
          cargo generate-lockfile

      - name: Capture complete Rust diagnostics
        shell: pwsh
        continue-on-error: true
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo check --package microgifter-homeserver-service --package microgifter-homeserver-mcp --package microgifter-homeserver-updater --locked *>&1 | Tee-Object phase5a-compiler.txt
          "EXIT_CODE=$LASTEXITCODE" | Out-File phase5a-compiler.txt -Append

      - name: Upload compiler diagnostics and formatted source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5a-compiler-diagnostic
          path: |
            phase5a-compiler.txt
            Cargo.lock
            crates/homeserver-service/src/mcp_runtime.rs
            crates/homeserver-mcp/src/main.rs
            src-tauri/src/mcp.rs
            src-tauri/src/lib.rs
          if-no-files-found: error
          retention-days: 1
