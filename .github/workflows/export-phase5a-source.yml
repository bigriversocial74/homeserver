name: Apply Phase 5A MCP Runtime

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out exact branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-5a-local-readonly-mcp-20260727
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Restore Production Quality Rust cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.toml', '**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Reconstruct verified Phase 5A source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $parts = Get-ChildItem '.phase5a-payload' -Filter 'part-*.bin' | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 payload parts, found $($parts.Count)." }
          $output = [System.IO.File]::Open('phase5a.patch.gz', [System.IO.FileMode]::Create)
          try {
            foreach ($part in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
              $output.Write($bytes, 0, $bytes.Length)
            }
          } finally { $output.Dispose() }
          $compressedHash = (Get-FileHash 'phase5a.patch.gz' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($compressedHash -ne '8a1ae56abe4d387403654b60a107b0b5da39c67281f55fb8c3531b7dbdf9f185') { throw "Compressed checksum mismatch: $compressedHash" }
          $input = [System.IO.File]::OpenRead('phase5a.patch.gz')
          $gzip = [System.IO.Compression.GZipStream]::new($input, [System.IO.Compression.CompressionMode]::Decompress)
          $patch = [System.IO.File]::Create('phase5a.patch')
          try { $gzip.CopyTo($patch) } finally { $patch.Dispose(); $gzip.Dispose(); $input.Dispose() }
          $patchHash = (Get-FileHash 'phase5a.patch' -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($patchHash -ne 'b3278f336f259b8494d96892a02baac1bacc4f66679a78ac912d15f49f8eebb8') { throw "Source checksum mismatch: $patchHash" }
          git apply --check phase5a.patch
          git apply phase5a.patch

          $cargo = Get-Content 'Cargo.toml' -Raw
          $before = 'features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]'
          $after = 'features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]'
          if (-not $cargo.Contains($before)) { throw 'Expected Tokio feature declaration was not found.' }
          Set-Content 'Cargo.toml' ($cargo.Replace($before, $after)) -NoNewline

          $runtimePath = 'crates/homeserver-service/src/mcp_runtime.rs'
          $runtime = Get-Content $runtimePath -Raw
          $unused = 'use anyhow::{anyhow, ensure, Context, Result};'
          $used = 'use anyhow::{ensure, Context, Result};'
          if (-not $runtime.Contains($unused)) { throw 'Expected anyhow import was not found.' }
          Set-Content $runtimePath ($runtime.Replace($unused, $used)) -NoNewline

          Remove-Item '.phase5a-payload' -Recurse -Force
          Remove-Item '.github/workflows/export-phase5a-source.yml' -Force
          Remove-Item 'phase5a.patch.gz', 'phase5a.patch' -Force

      - name: Stabilize dependency locks and formatting
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile
          cargo fmt --all

      - name: Validate source and security boundaries
        shell: pwsh
        run: |
          npm ci
          npm run check:frontend
          npm run build
          python scripts/validate-mcp-runtime.py
          python scripts/validate-security-boundaries.py
          python scripts/validate-document-extraction.py
          python scripts/validate-ollama-install-assistant.py
          @'
          import sqlite3
          from pathlib import Path
          db = sqlite3.connect(':memory:')
          db.execute('PRAGMA foreign_keys = ON')
          for migration in sorted(Path('database/migrations').glob('*.sql')):
              db.executescript(migration.read_text(encoding='utf-8'))
          problems = db.execute('PRAGMA foreign_key_check').fetchall()
          if problems:
              raise SystemExit(f'foreign-key violations: {problems}')
          print('All migrations and foreign keys validated.')
          '@ | python -

      - name: Build native resources
        shell: pwsh
        run: |
          cargo build --release --package microgifter-homeserver-service --locked
          cargo build --release --package microgifter-homeserver-updater --locked
          cargo build --release --package microgifter-homeserver-mcp --locked
          New-Item -ItemType Directory -Force 'src-tauri/resources' | Out-Null
          Copy-Item 'target/release/microgifter-homeserver-service.exe' 'src-tauri/resources/microgifter-homeserver-service.exe' -Force
          Copy-Item 'target/release/microgifter-homeserver-updater.exe' 'src-tauri/resources/microgifter-homeserver-updater.exe' -Force
          Copy-Item 'target/release/microgifter-homeserver-mcp.exe' 'src-tauri/resources/microgifter-homeserver-mcp.exe' -Force

      - name: Validate complete Rust workspace
        shell: pwsh
        run: |
          cargo check --workspace --locked
          cargo test --workspace --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Commit clean Phase 5A product source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Remove-Item 'src-tauri/resources/microgifter-homeserver-service.exe' -Force -ErrorAction SilentlyContinue
          Remove-Item 'src-tauri/resources/microgifter-homeserver-updater.exe' -Force -ErrorAction SilentlyContinue
          Remove-Item 'src-tauri/resources/microgifter-homeserver-mcp.exe' -Force -ErrorAction SilentlyContinue
          git config user.name 'bigriversocial74'
          git config user.email '293940031+bigriversocial74@users.noreply.github.com'
          git add -A
          $changed = @(git diff --cached --name-only)
          if ($changed.Count -lt 25) { throw "Unexpectedly small Phase 5A change set: $($changed.Count) files." }
          $unexpected = $changed | Where-Object { $_ -match '\.exe$' -or $_ -match '^target/' }
          if ($unexpected) { throw "Generated binary staged unexpectedly: $($unexpected -join ', ')" }
          git commit -m 'Build Phase 5A local read-only MCP runtime'
          git push origin HEAD:feature/phase-5a-local-readonly-mcp-20260727
