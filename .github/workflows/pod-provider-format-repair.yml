name: POD Provider Format Repair

on:
  push:
    branches:
      - feature/pod-provider-voice-adapter-v1-20260728

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/pod-provider-voice-adapter-v1-20260728
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Apply rustfmt and commit
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          if git diff --quiet -- '*.rs'; then
            echo 'No Rust formatting repair required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '*.rs'
          git commit -m 'Apply rustfmt to POD provider adapter'
          git push origin HEAD:feature/pod-provider-voice-adapter-v1-20260728
