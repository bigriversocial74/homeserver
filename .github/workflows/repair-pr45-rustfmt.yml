name: Repair PR45 Rust Formatting

on:
  push:
    branches:
      - feature/pairing-first-agent-workspace-onboarding-v1-20260729

permissions:
  contents: write

concurrency:
  group: repair-pr45-rustfmt
  cancel-in-progress: false

jobs:
  format:
    runs-on: windows-2025
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/pairing-first-agent-workspace-onboarding-v1-20260729
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt

      - name: Apply bounded rustfmt repair
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all
          $allowed = @(
            'crates/homeserver-service/src/activity.rs',
            'crates/homeserver-service/src/app.rs',
            'src-tauri/src/agent.rs'
          )
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Unexpected rustfmt changes: $($unexpected -join ', ')"
          }
          cargo fmt --all --check
          git diff --check

      - name: Commit formatting and remove repair workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git rm .github/workflows/repair-pr45-rustfmt.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/homeserver-service/src/activity.rs crates/homeserver-service/src/app.rs src-tauri/src/agent.rs
          git commit -m 'Apply canonical Rust formatting to onboarding changes'
          git push origin HEAD:feature/pairing-first-agent-workspace-onboarding-v1-20260729
