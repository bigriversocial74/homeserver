name: Rustfmt Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: windows-2025
    steps:
      - name: Check out pull request
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust formatting tool
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Apply formatter and collect exact output
        shell: pwsh
        run: |
          cargo fmt --all
          New-Item -ItemType Directory -Force -Path rustfmt-output/src-tauri/src | Out-Null
          Copy-Item src-tauri/src/lib.rs rustfmt-output/src-tauri/src/lib.rs
          Copy-Item src-tauri/src/ollama_install.rs rustfmt-output/src-tauri/src/ollama_install.rs
          git diff -- src-tauri/src/lib.rs src-tauri/src/ollama_install.rs | Set-Content rustfmt-output/rustfmt.patch

      - name: Upload exact formatted files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: rustfmt-output
          path: rustfmt-output
          if-no-files-found: error
          retention-days: 1
