name: Materialize Phase 5A source

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/materialize-phase5a-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: materialize-phase5a-source
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: repair/materialize-phase-5a-source-20260727
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Reconstruct verified Phase 5A source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $parts = Get-ChildItem '.phase5a-payload' -Filter 'part-*.bin' | Sort-Object Name
          if ($parts.Count -ne 7) {
            throw "Expected 7 payload parts, found $($parts.Count)."
          }

          $compressedPath = 'phase5a.patch.gz'
          $patchPath = 'phase5a.patch'
          $output = [System.IO.File]::Open($compressedPath, [System.IO.FileMode]::Create)
          try {
            foreach ($part in $parts) {
              $bytes = [System.IO.File]::ReadAllBytes($part.FullName)
              $output.Write($bytes, 0, $bytes.Length)
            }
          } finally {
            $output.Dispose()
          }

          $compressedHash = (Get-FileHash $compressedPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($compressedHash -ne '8a1ae56abe4d387403654b60a107b0b5da39c67281f55fb8c3531b7dbdf9f185') {
            throw "Compressed checksum mismatch: $compressedHash"
          }

          $input = [System.IO.File]::OpenRead($compressedPath)
          $gzip = [System.IO.Compression.GZipStream]::new($input, [System.IO.Compression.CompressionMode]::Decompress)
          $patch = [System.IO.File]::Create($patchPath)
          try {
            $gzip.CopyTo($patch)
          } finally {
            $patch.Dispose()
            $gzip.Dispose()
            $input.Dispose()
          }

          $sourceHash = (Get-FileHash $patchPath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($sourceHash -ne 'b3278f336f259b8494d96892a02baac1bacc4f66679a78ac912d15f49f8eebb8') {
            throw "Source checksum mismatch: $sourceHash"
          }

          git apply --check $patchPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git apply $patchPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $cargoPath = 'Cargo.toml'
          $cargo = Get-Content $cargoPath -Raw
          $before = 'features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]'
          $after = 'features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"]'
          if (-not $cargo.Contains($before)) {
            throw 'Expected Tokio feature declaration was not found.'
          }
          Set-Content $cargoPath ($cargo.Replace($before, $after)) -NoNewline

          $runtimePath = 'crates/homeserver-service/src/mcp_runtime.rs'
          $runtime = Get-Content $runtimePath -Raw
          $unusedImport = 'use anyhow::{anyhow, ensure, Context, Result};'
          $fixedImport = 'use anyhow::{ensure, Context, Result};'
          if (-not $runtime.Contains($unusedImport)) {
            throw 'Expected MCP runtime import was not found.'
          }
          Set-Content $runtimePath ($runtime.Replace($unusedImport, $fixedImport)) -NoNewline

          Remove-Item '.phase5a-payload' -Recurse -Force
          Remove-Item '.github/workflows/export-phase5a-source.yml' -Force
          Remove-Item '.github/workflows/materialize-phase5a-source.yml' -Force
          Remove-Item $compressedPath, $patchPath -Force

          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate reconstructed workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo check --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --workspace --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit materialized source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -A
          $staged = git diff --cached --name-only
          if (-not $staged) {
            throw 'No materialized source changes were staged.'
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Materialize verified Phase 5A source'
          git push origin HEAD:repair/materialize-phase-5a-source-20260727
