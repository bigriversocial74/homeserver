name: Phase 23C Integration

on:
  push:
    branches:
      - feature/phase-23c-local-whisper-transcription
    paths:
      - scripts/apply-phase23c-integration.py
      - .github/workflows/phase23c-integration.yml

permissions:
  contents: write

concurrency:
  group: phase23c-integration
  cancel-in-progress: false

jobs:
  integrate:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out exact Phase 23C branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-23c-local-whisper-transcription
          fetch-depth: 0

      - name: Configure stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Apply permanent Phase 23C integration
        shell: pwsh
        run: python scripts/apply-phase23c-integration.py

      - name: Refresh canonical Cargo lock
        shell: pwsh
        run: cargo generate-lockfile

      - name: Remove one-time integration assets
        shell: pwsh
        run: |
          git rm scripts/apply-phase23c-integration.py
          git rm .github/workflows/phase23c-integration.yml

      - name: Commit integrated candidate
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock crates/homeserver-service/src/audio_runtime.rs src-tauri/src/lib.rs src/homeserver-agent-vad.js index.html package.json
          git diff --cached --check
          git commit -m "Integrate Phase 23C local Whisper transcription"
          git push origin HEAD:feature/phase-23c-local-whisper-transcription
