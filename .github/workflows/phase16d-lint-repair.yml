name: Phase 16D Lint Repair

on:
  pull_request:
  push:
    branches:
      - feature/phase-16d-agent-lifecycle-action-policy

permissions:
  contents: write

concurrency:
  group: homeserver-phase16d-lint-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'feature/phase-16d-agent-lifecycle-action-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-16d-agent-lifecycle-action-policy
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Apply typed Phase 16D lint repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/homeserver-service/src/app/wrapper_agents.rs')
          text = path.read_text(encoding='utf-8')

          marker = '''struct ProposalAuthority {
              proposal: ProposalSummary,
              tool_adapter: String,
              autonomy_level: u8,
          }
          '''
          addition = '''struct ProposalAuthority {
              proposal: ProposalSummary,
              tool_adapter: String,
              autonomy_level: u8,
          }

          struct PolicyInsertContext<'a> {
              agent_id: &'a str,
              revision: u64,
              autonomy_level: u8,
              actor: &'a str,
              not_before: &'a str,
              expires: &'a str,
          }

          type AgentJobAuthorityRow = (
              String,
              i64,
              String,
              i64,
              String,
              String,
              String,
              String,
              String,
              String,
              String,
          );

          type ProposalAuthorityRow = (
              String,
              i64,
              String,
              i64,
              String,
              i64,
              String,
              i64,
              String,
              i64,
              String,
              String,
              String,
              String,
          );
          '''
          if marker not in text:
              raise SystemExit('ProposalAuthority insertion marker not found')
          text = text.replace(marker, addition, 1)

          old_create = '''        insert_policy_tx(
                      &transaction,
                      &agent_id,
                      1,
                      request.autonomy_level,
                      &owner_user_id,
                      policy,
                      &now_text,
                      &expires,
                  )?;
          '''
          new_create = '''        insert_policy_tx(
                      &transaction,
                      PolicyInsertContext {
                          agent_id: &agent_id,
                          revision: 1,
                          autonomy_level: request.autonomy_level,
                          actor: &owner_user_id,
                          not_before: &now_text,
                          expires: &expires,
                      },
                      policy,
                  )?;
          '''
          if old_create not in text:
              raise SystemExit('create-agent policy call not found')
          text = text.replace(old_create, new_create, 1)

          old_policy = '''    let policy_id = insert_policy_tx(
                  &transaction,
                  &agent_id,
                  next_revision.max(1) as u64,
                  autonomy.max(0) as u8,
                  &actor,
                  request.policy,
                  &now,
                  &expires,
              )?;
          '''
          new_policy = '''    let policy_id = insert_policy_tx(
                  &transaction,
                  PolicyInsertContext {
                      agent_id: &agent_id,
                      revision: next_revision.max(1) as u64,
                      autonomy_level: autonomy.max(0) as u8,
                      actor: &actor,
                      not_before: &now,
                      expires: &expires,
                  },
                  request.policy,
              )?;
          '''
          if old_policy not in text:
              raise SystemExit('create-policy call not found')
          text = text.replace(old_policy, new_policy, 1)

          start = text.index('fn insert_policy_tx(')
          end = text.index('\nfn revoke_policy', start)
          replacement = '''fn insert_policy_tx(
              transaction: &Transaction<'_>,
              context: PolicyInsertContext<'_>,
              policy: PolicyInput,
          ) -> Result<String> {
              let action_type = validate_symbol(&policy.action_type, 120, "action type")?;
              let risk_class = validate_enum(&policy.risk_class, RISK_CLASSES, "risk class")?;
              let approval_mode = validate_enum(&policy.approval_mode, APPROVAL_MODES, "approval mode")?;
              let tool_adapter = validate_enum(&policy.tool_adapter, TOOL_ADAPTERS, "tool adapter")?;
              let max_executions = policy.max_executions.unwrap_or(1);
              let window_seconds = policy.window_seconds.unwrap_or(3_600);
              ensure!(
                  (1..=10_000).contains(&max_executions),
                  "invalid policy execution limit"
              );
              ensure!(
                  (60..=2_592_000).contains(&window_seconds),
                  "invalid policy window"
              );
              if matches!(risk_class.as_str(), "external_side_effect" | "high_risk") {
                  ensure!(
                      approval_mode != "none",
                      "sensitive actions always require approval"
                  );
              }
              if context.autonomy_level <= 1 {
                  ensure!(
                      tool_adapter == "proposal_only",
                      "suggest-only agents cannot receive executable adapters"
                  );
              }
              if context.autonomy_level == 2 {
                  ensure!(
                      approval_mode != "none",
                      "approval-required agents cannot use approval-free policies"
                  );
              }
              if approval_mode == "none" {
                  ensure!(
                      context.autonomy_level >= 3,
                      "approval-free policy requires scoped autonomy"
                  );
                  ensure!(
                      matches!(risk_class.as_str(), "read_only" | "reversible"),
                      "approval-free policy is limited to low-risk actions"
                  );
              }
              let policy_id = Uuid::new_v4().to_string();
              transaction.execute(
                  "INSERT INTO agent_execution_policies (policy_id,agent_id,policy_revision,action_type,risk_class,approval_mode,tool_adapter,max_executions,window_seconds,state,not_before_utc,expires_at_utc,created_by_user_id,created_at_utc,updated_at_utc) VALUES (?1,?2,?3,?4,?5,?6,?7,?8,?9,'active',?10,?11,?12,?10,?10)",
                  params![
                      policy_id,
                      context.agent_id,
                      context.revision as i64,
                      action_type,
                      risk_class,
                      approval_mode,
                      tool_adapter,
                      i64::from(max_executions),
                      i64::from(window_seconds),
                      context.not_before,
                      context.expires,
                      context.actor
                  ],
              )?;
              Ok(policy_id)
          }
          '''
          text = text[:start] + replacement + text[end:]

          old_binding = 'let binding: Option<(String, i64, String, i64, String, String, String, String, String, String, String)> ='
          if old_binding not in text:
              raise SystemExit('agent job authority tuple not found')
          text = text.replace(old_binding, 'let binding: Option<AgentJobAuthorityRow> =', 1)

          old_context = 'let context: Option<(String,i64,String,i64,String,i64,String,i64,String,i64,String,String,String,String)> ='
          if old_context not in text:
              raise SystemExit('proposal authority tuple not found')
          text = text.replace(old_context, 'let context: Option<ProposalAuthorityRow> =', 1)

          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          python scripts/validate-wrapper-agents.py
      - name: Commit Phase 16D lint repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/homeserver-service/src/app/wrapper_agents.rs
          if git diff --cached --quiet; then
            echo 'Phase 16D lint repairs are already applied.'
            exit 0
          fi
          git commit -m 'Repair Phase 16D strict lint defects'
          git push origin HEAD:feature/phase-16d-agent-lifecycle-action-policy
