name: Phase 15 Normalize Product

on:
  push:
    branches:
      - feature/phase-15-federated-settings-shared-control-center
    paths:
      - .github/workflows/phase15-normalize-product.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-15-federated-settings-shared-control-center
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Normalize product wiring
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          app = Path('crates/homeserver-service/src/app.rs')
          text = app.read_text()
          module = '#[path = "federated_settings.rs"]\nmod federated_settings;'
          text = re.sub(r'(?:#\[path = "federated_settings\.rs"\]\nmod federated_settings;\n*)+', module + '\n\n', text)
          text = re.sub(r'(?:    federated_settings::initialize\(&connection\)\?;\n)+', '    federated_settings::initialize(&connection)?;\n', text)
          retain = '                        if let Err(error) = federated_settings::maintain_history(&connection) {\n                            warn!(?error, "scheduled federated settings retention failed");\n                        }\n'
          text = re.sub(r'(?:' + re.escape(retain) + r')+', retain, text)
          route = '            .merge(federated_settings::router(state.clone()))\n'
          text = re.sub(r'(?:' + re.escape(route) + r')+', route, text)
          app.write_text(text)

          tauri = Path('src-tauri/src/lib.rs')
          text = tauri.read_text()
          text = re.sub(r'(?:mod federated_settings;\n)+', 'mod federated_settings;\n', text)
          commands = ('            federated_settings::homeserver_federated_settings,\n'
                      '            federated_settings::homeserver_update_federated_setting,\n'
                      '            federated_settings::homeserver_sync_federated_settings,\n')
          text = re.sub(r'(?:' + re.escape(commands) + r')+', commands, text)
          tauri.write_text(text)

          index = Path('index.html')
          text = index.read_text()
          script = '    <script type="module" src="/src/federated-settings.js"></script>\n'
          text = re.sub(r'(?:' + re.escape(script) + r')+', script, text)
          index.write_text(text)
          '@ | python -
          cargo fmt --all
      - name: Commit normalized product files
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-service/src/app.rs src-tauri/src/lib.rs index.html crates/homeserver-service/src/federated_settings.rs src-tauri/src/federated_settings.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Normalize Phase 15 federated settings wiring"
          git push origin HEAD:feature/phase-15-federated-settings-shared-control-center
