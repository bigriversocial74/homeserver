name: Phase 3A Recovery Transfer Canonicalize

on:
  push:
    branches:
      - feature/phase-3-backup-recovery-updates-20260724

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3-backup-recovery-updates-20260724
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Canonicalize locks and formatting
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile
          cargo fmt --all
          git rm .github/workflows/phase3a-recovery-transfer-canonicalize.yml

      - name: Commit canonical output
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock package-lock.json Cargo.toml crates src-tauri .github/workflows/phase3a-recovery-transfer-canonicalize.yml
          if (git diff --cached --quiet) {
            Write-Host "No canonical changes were required."
            exit 0
          }
          git commit -m "Canonicalize recovery transfer dependencies and formatting"
          git push origin HEAD:feature/phase-3-backup-recovery-updates-20260724
