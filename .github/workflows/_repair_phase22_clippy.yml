name: Repair Phase 22 Strict Lint

on:
  push:
    branches:
      - feature/unified-homeserver-agent-orchestration
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: repair-phase22-strict-lint
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/unified-homeserver-agent-orchestration
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy
      - name: Apply typed lint refactor
        run: python .github/scripts/repair_phase22_clippy.py
      - name: Format and validate contracts
        run: |
          cargo fmt --all
          python scripts/validate-unified-agent-orchestration.py
      - name: Run focused strict lint
        run: cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings
      - name: Remove temporary repair files
        run: |
          Remove-Item -Force .github/scripts/repair_phase22_clippy.py
          Remove-Item -Force .github/workflows/_repair_phase22_clippy.yml
      - name: Commit permanent refactor
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refactor unified Agent evidence contracts for strict lint"
          git push origin HEAD:feature/unified-homeserver-agent-orchestration
