name: Phase 18 Supervised Action Orchestration

on:
  pull_request:
    paths:
      - .github/workflows/phase18-supervised-action-orchestration.yml
      - database/migrations/0026_supervised_action_orchestration.sql
      - docs/phase-18-supervised-action-orchestration.md
      - scripts/validate-supervised-orchestration.py
      - scripts/validate-wrapper-agents.py
      - scripts/validate-wrapper-runtime.py
      - scripts/validate-wrapper-privacy.py
      - package.json
      - crates/homeserver-service/src/app.rs
      - crates/homeserver-service/src/app/wrapper_orchestration.rs
      - crates/homeserver-service/src/app/wrapper_runtime.rs
      - crates/homeserver-service/src/app/wrapper_agents.rs
      - crates/homeserver-service/src/app/wrapper_jobs.rs
      - crates/homeserver-service/src/app/wrapper_jobs_*.rs
      - crates/homeserver-service/src/app/wrapper_privacy.rs
      - crates/homeserver-service/tests/phase18_supervised_orchestration_contract.rs
      - src-tauri/src/lib.rs
      - src-tauri/src/runtime.rs
      - src/agent-runtime-control-center.js
      - src/agent-runtime-control-center.css
  push:
    branches:
      - feature/phase-18-supervised-action-orchestration
      - main
    paths:
      - .github/workflows/phase18-supervised-action-orchestration.yml
      - database/migrations/0026_supervised_action_orchestration.sql
      - docs/phase-18-supervised-action-orchestration.md
      - scripts/validate-supervised-orchestration.py
      - scripts/validate-wrapper-agents.py
      - scripts/validate-wrapper-runtime.py
      - scripts/validate-wrapper-privacy.py
      - package.json
      - crates/homeserver-service/src/app.rs
      - crates/homeserver-service/src/app/wrapper_orchestration.rs
      - crates/homeserver-service/src/app/wrapper_runtime.rs
      - crates/homeserver-service/src/app/wrapper_agents.rs
      - crates/homeserver-service/src/app/wrapper_jobs.rs
      - crates/homeserver-service/src/app/wrapper_jobs_*.rs
      - crates/homeserver-service/src/app/wrapper_privacy.rs
      - crates/homeserver-service/tests/phase18_supervised_orchestration_contract.rs
      - src-tauri/src/lib.rs
      - src-tauri/src/runtime.rs
      - src/agent-runtime-control-center.js
      - src/agent-runtime-control-center.css

permissions:
  contents: read

concurrency:
  group: homeserver-phase18-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate Phase 18 supervised orchestration boundaries
        run: python scripts/validate-supervised-orchestration.py
      - name: Validate retained Phase 16D agent authority
        run: python scripts/validate-wrapper-agents.py
      - name: Validate retained Phase 17 runtime authority
        run: python scripts/validate-wrapper-runtime.py
      - name: Validate retained Phase 16E private boundaries
        run: python scripts/validate-wrapper-privacy.py
      - name: Validate retained frontend contracts and build
        run: |
          npm run check:frontend
          npm run build
      - name: Validate Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile and test HomeServer service
        run: cargo test -p microgifter-homeserver-service
      - name: Validate Phase 18 immutable evidence contract
        run: cargo test -p microgifter-homeserver-service --test phase18_supervised_orchestration_contract
      - name: Strict HomeServer service lint
        run: cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings
