name: Phase 18 Final Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/phase18-supervised-action-orchestration.yml

permissions:
  contents: write

concurrency:
  group: homeserver-phase18-final-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: feature/phase-18-supervised-action-orchestration
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply hostile-review repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path('crates/homeserver-service/src/app/wrapper_orchestration.rs')
          source = source_path.read_text(encoding='utf-8')

          old_history = '''pub fn maintain_history(connection: &Connection) -> Result<()> {
              reconcile(connection)?;
              connection.execute(
                  "DELETE FROM agent_supervised_action_events WHERE created_at_utc<strftime('%Y-%m-%dT%H:%M:%fZ','now','-365 days')",
                  [],
              )?;
              connection.execute(
                  "DELETE FROM agent_supervised_action_events WHERE event_id NOT IN (SELECT event_id FROM agent_supervised_action_events ORDER BY created_at_utc DESC,event_id DESC LIMIT ?1)",
                  params![MAX_EVENTS],
              )?;
              let receipts: i64 = connection.query_row(
          '''
          new_history = '''pub fn maintain_history(connection: &Connection) -> Result<()> {
              reconcile(connection)?;
              let events: i64 = connection.query_row(
                  "SELECT COUNT(*) FROM agent_supervised_action_events",
                  [],
                  |row| row.get(0),
              )?;
              ensure!(
                  events <= MAX_EVENTS,
                  "supervised action event retention requires archival"
              );
              let receipts: i64 = connection.query_row(
          '''
          if old_history not in source:
              raise RuntimeError('missing append-only retention anchor')
          source = source.replace(old_history, new_history, 1)

          failure_anchor = '''    let connection = state.connection()?;
              let transaction = connection.unchecked_transaction()?;
              let now = now_utc();
          '''
          failure_replacement = '''    ensure!(
                  job_receipt.safe_result_hash.is_some(),
                  "proposal-job receipt safe result hash is missing"
              );
              cancel_remaining_jobs(
                  state,
                  &context.plan_id,
                  &context.step_id,
                  failure_code,
              )?;
              let connection = state.connection()?;
              let transaction = connection.unchecked_transaction()?;
              let now = now_utc();
          '''
          function_start = source.index('fn fail_completed_proposal_job(')
          function_end = source.index('\nfn proposal_job_context(', function_start)
          function_text = source[function_start:function_end]
          if failure_anchor not in function_text:
              raise RuntimeError('missing completed-proposal failure anchor')
          function_text = function_text.replace(failure_anchor, failure_replacement, 1)
          function_text = function_text.replace(
              '"wrapper_job_receipt_hash": job_receipt.receipt_hash,',
              '"wrapper_job_receipt_hash": job_receipt.receipt_hash,\n        "wrapper_job_safe_result_hash": job_receipt.safe_result_hash.as_deref(),',
              1,
          )
          source = source[:function_start] + function_text + source[function_end:]

          finalize_anchor = '''    ensure!(
                  job_receipt.result_code == "action_proposal_job_completed",
                  "proposal-job receipt result changed"
              );
          '''
          finalize_replacement = finalize_anchor + '''    ensure!(
                  job_receipt.safe_result_hash.is_some(),
                  "proposal-job receipt safe result hash is missing"
              );
          '''
          if finalize_anchor not in source:
              raise RuntimeError('missing finalized receipt anchor')
          source = source.replace(finalize_anchor, finalize_replacement, 1)

          fail_read_anchor = '''    let job_receipt = read_wrapper_receipt_tx(&transaction, &checkpoint.job_id)?;
              let stored_runtime = write_terminal_receipts_tx(
          '''
          fail_read_replacement = '''    let job_receipt = read_wrapper_receipt_tx(&transaction, &checkpoint.job_id)?;
              ensure!(
                  job_receipt.safe_result_hash.is_some(),
                  "proposal-job receipt safe result hash is missing"
              );
              let stored_runtime = write_terminal_receipts_tx(
          '''
          if fail_read_anchor not in source:
              raise RuntimeError('missing fail-closed receipt anchor')
          source = source.replace(fail_read_anchor, fail_read_replacement, 1)

          runtime_document_anchor = '''        "wrapper_job_receipt_hash": job_receipt.receipt_hash,
                  "action_receipt_id": action.map(|value| value.receipt_id.as_str()),
          '''
          runtime_document_replacement = '''        "wrapper_job_receipt_hash": job_receipt.receipt_hash,
                  "wrapper_job_safe_result_hash": job_receipt.safe_result_hash.as_deref(),
                  "action_receipt_id": action.map(|value| value.receipt_id.as_str()),
          '''
          if runtime_document_anchor not in source:
              raise RuntimeError('missing runtime receipt evidence anchor')
          source = source.replace(runtime_document_anchor, runtime_document_replacement, 1)

          orchestration_document_anchor = '''        "wrapper_job_receipt_hash": job_receipt.receipt_hash,
                  "runtime_receipt_id": stored_runtime.0,
          '''
          orchestration_document_replacement = '''        "wrapper_job_receipt_hash": job_receipt.receipt_hash,
                  "wrapper_job_safe_result_hash": job_receipt.safe_result_hash.as_deref(),
                  "runtime_receipt_id": stored_runtime.0,
          '''
          if orchestration_document_anchor not in source:
              raise RuntimeError('missing orchestration receipt evidence anchor')
          source = source.replace(orchestration_document_anchor, orchestration_document_replacement, 1)
          source_path.write_text(source, encoding='utf-8')

          test_path = Path('crates/homeserver-service/tests/phase18_supervised_orchestration_contract.rs')
          test = test_path.read_text(encoding='utf-8')
          test_anchor = '''    assert!(!ORCHESTRATION_SOURCE.contains("tokio::process::Command"));
          }
          '''
          test_replacement = '''    assert!(!ORCHESTRATION_SOURCE.contains("tokio::process::Command"));
              assert!(!ORCHESTRATION_SOURCE.contains("DELETE FROM agent_supervised_action_events"));
              assert!(ORCHESTRATION_SOURCE.contains("supervised action event retention requires archival"));
              assert!(ORCHESTRATION_SOURCE.matches("job_receipt.safe_result_hash.is_some()").count() >= 3);
          }
          '''
          if test_anchor not in test:
              raise RuntimeError('missing Phase 18 hostile-review test anchor')
          test_path.write_text(test.replace(test_anchor, test_replacement, 1), encoding='utf-8')

          validator_path = Path('scripts/validate-supervised-orchestration.py')
          validator = validator_path.read_text(encoding='utf-8')
          validator += '''

          if "DELETE FROM agent_supervised_action_events" in source:
              raise SystemExit("append-only supervised events still have a deletion path")
          if "supervised action event retention requires archival" not in source:
              raise SystemExit("missing fail-closed supervised event archival boundary")
          if source.count("job_receipt.safe_result_hash.is_some()") < 3:
              raise SystemExit("wrapper proposal-job safe-result evidence is not enforced")
          completed_failure = source[source.index("fn fail_completed_proposal_job("):source.index("fn proposal_job_context(")]
          if "cancel_remaining_jobs" not in completed_failure:
              raise SystemExit("completed proposal failures do not cancel dependent jobs")
          '''
          validator_path.write_text(validator, encoding='utf-8')
          PY
          cargo fmt --all
      - name: Validate Phase 18 hardening
        run: |
          npm ci
          python scripts/validate-supervised-orchestration.py
          python scripts/validate-wrapper-agents.py
          python scripts/validate-wrapper-runtime.py
          python scripts/validate-wrapper-privacy.py
          npm run check:frontend
          npm run build
          cargo fmt --all -- --check
          cargo test -p microgifter-homeserver-service
          cargo test -p microgifter-homeserver-service --test phase18_supervised_orchestration_contract
          cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings
      - name: Commit hardened Phase 18 source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-service/src/app/wrapper_orchestration.rs crates/homeserver-service/tests/phase18_supervised_orchestration_contract.rs scripts/validate-supervised-orchestration.py
          git diff --cached --check
          git commit -m "Harden Phase 18 immutable evidence retention"
          git push
