name: Phase 3A Apply Locks With Worktree

on:
  push:
    branches:
      - feature/phase-3-backup-recovery-updates-20260724

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/5/merge
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate PR merge locks
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile
          Copy-Item Cargo.lock "$env:RUNNER_TEMP/generated-Cargo.lock" -Force
          Copy-Item package-lock.json "$env:RUNNER_TEMP/generated-package-lock.json" -Force

      - name: Apply locks in isolated feature worktree
        shell: pwsh
        run: |
          git fetch origin feature/phase-3-backup-recovery-updates-20260724
          $worktree = Join-Path $env:RUNNER_TEMP "homeserver-feature"
          git worktree add --force -B lock-apply $worktree origin/feature/phase-3-backup-recovery-updates-20260724
          Copy-Item "$env:RUNNER_TEMP/generated-Cargo.lock" (Join-Path $worktree "Cargo.lock") -Force
          Copy-Item "$env:RUNNER_TEMP/generated-package-lock.json" (Join-Path $worktree "package-lock.json") -Force
          Set-Location $worktree
          git rm .github/workflows/phase3a-apply-lock-worktree.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock package-lock.json .github/workflows/phase3a-apply-lock-worktree.yml
          git diff --cached --stat
          git commit -m "Apply exact PR merge dependency locks"
          git push origin HEAD:feature/phase-3-backup-recovery-updates-20260724
