name: One-use VP3 authority split PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'feature/vp3-control-plane-authority-split-v1-20260729'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-control-plane-authority-split-v1-20260729
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Wire software authority boundary
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              file_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          def replace_all(path: str, old: str, new: str, expected: int) -> None:
              file_path = Path(path)
              source = file_path.read_text(encoding="utf-8")
              count = source.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old!r}")
              file_path.write_text(source.replace(old, new), encoding="utf-8")

          replace_once(
              "crates/homeserver-service/src/main.rs",
              "mod semantic_vault;\nmod update;",
              "mod semantic_vault;\nmod software_authority;\nmod update;",
          )
          replace_once(
              "crates/homeserver-service/src/main.rs",
              "        if let Err(error) = microgifter_connection::health_check(&connection) {",
              "        if let Err(error) = software_authority::health_check(&connection) {\n"
              "            error!(?error, \"HomeServer software-authority database health check failed\");\n"
              "            return HealthSnapshot::needs_attention(\n"
              "                &self.config.server_name,\n"
              "                \"software_authority_integrity_check_failed\",\n"
              "            );\n"
              "        }\n"
              "        if let Err(error) = microgifter_connection::health_check(&connection) {",
          )
          replace_once(
              "crates/homeserver-service/src/main.rs",
              "            update_store::maintain_history(&connection)?;\n            microgifter_connection::maintain_history(&connection)?;",
              "            update_store::maintain_history(&connection)?;\n"
              "            software_authority::maintain_history(&connection)?;\n"
              "            microgifter_connection::maintain_history(&connection)?;",
          )
          replace_all(
              "crates/homeserver-service/src/main.rs",
              "microgifter_connection::record_update_result_receipt(",
              "software_authority::record_update_result_receipt(",
              1,
          )
          replace_all(
              "crates/homeserver-service/src/main.rs",
              "microgifter_connection::ensure_update_download_allowed(",
              "software_authority::ensure_update_download_allowed(",
              2,
          )
          replace_once(
              "crates/homeserver-service/src/main.rs",
              "microgifter_connection::ensure_update_install_window(&connection)?;",
              "software_authority::ensure_update_install_window(&connection)?;",
          )
          replace_once(
              "crates/homeserver-service/src/main.rs",
              'message: "Microgifter HomeServer is current.".to_owned(),',
              'message: "HomeServer is current.".to_owned(),',
          )
          replace_once(
              "crates/homeserver-service/src/main.rs",
              '"Microgifter HomeServer {} is available and its release manifest is valid.",',
              '"HomeServer {} is available and its release manifest is valid.",',
          )

          replace_once(
              "crates/homeserver-service/src/app.rs",
              "semantic_vault, update, update_store, AppState,",
              "semantic_vault, software_authority, update, update_store, AppState,",
          )
          replace_once(
              "crates/homeserver-service/src/app.rs",
              "    update_store::initialize(&connection)?;\n    cloud_connector::initialize(&connection)?;",
              "    update_store::initialize(&connection)?;\n"
              "    software_authority::initialize(&connection)?;\n"
              "    cloud_connector::initialize(&connection)?;",
          )
          replace_once(
              "crates/homeserver-service/src/app.rs",
              "microgifter_connection::record_update_result_receipt(",
              "software_authority::record_update_result_receipt(",
          )
          replace_once(
              "crates/homeserver-service/src/app.rs",
              "            .merge(microgifter_connection::router(state.clone()))",
              "            .merge(software_authority::router(state.clone()))\n"
              "            .merge(microgifter_connection::router(state.clone()))",
          )

          replace_once(
              "scripts/validate-security-boundaries.py",
              '    "microgifter_connection",\n    "pod_provider_runtime",',
              '    "microgifter_connection",\n    "software_authority",\n    "pod_provider_runtime",',
          )

          for workflow_path in (
              ".github/workflows/one-use-vp3-authority-split.yml",
              ".github/workflows/one-use-vp3-authority-split-pr.yml",
          ):
              path = Path(workflow_path)
              if path.exists():
                  path.unlink()

      - name: Format and validate
        run: |
          cargo fmt --all
          python scripts/validate-security-boundaries.py
          cargo test -p microgifter-homeserver-service software_authority

      - name: Commit authority split
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire VP3 software authority boundary"
          git push origin HEAD:feature/vp3-control-plane-authority-split-v1-20260729
