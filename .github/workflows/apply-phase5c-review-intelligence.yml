name: Apply Phase 5C review intelligence

on:
  push:
    branches:
      - feature/phase-5c-review-intelligence-campaign-actions-20260728
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5c-review-intelligence-integration
  cancel-in-progress: false

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out review intelligence branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-5c-review-intelligence-campaign-actions-20260728
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Apply deterministic backend integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          python scripts/fix-phase5c-review-patcher.py *> focused-integration.log
          if ($LASTEXITCODE -eq 0) {
            python scripts/apply-phase5c-review-intelligence.py *>> focused-integration.log
          }
          if ($LASTEXITCODE -eq 0) {
            python scripts/fix-phase5c-review-rust.py *>> focused-integration.log
          }
          $status = $LASTEXITCODE
          Get-Content focused-integration.log
          exit $status

      - name: Format, test, and lint service
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          cargo fmt --all *> focused-rust.log
          if ($LASTEXITCODE -ne 0) { Get-Content focused-rust.log; exit $LASTEXITCODE }
          cargo test -p microgifter-homeserver-service *>> focused-rust.log
          if ($LASTEXITCODE -ne 0) { Get-Content focused-rust.log; exit $LASTEXITCODE }
          cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings *>> focused-rust.log
          $status = $LASTEXITCODE
          Get-Content focused-rust.log
          exit $status

      - name: Commit compiler-verified backend integration
        shell: pwsh
        run: |
          if ((git status --porcelain).Length -eq 0) {
            Write-Host 'No integration changes were produced.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/homeserver-service/src/main.rs crates/homeserver-service/src/app.rs crates/homeserver-service/src/operational_data.rs crates/homeserver-service/src/cloud_registry.rs crates/homeserver-service/src/model_center.rs crates/homeserver-service/src/agent_runtime.rs crates/homeserver-service/src/review_intelligence.rs database/migrations/0013_review_intelligence_campaign_actions.sql
          git commit -m 'Integrate review intelligence and campaign actions'
          git push origin HEAD:feature/phase-5c-review-intelligence-campaign-actions-20260728

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5c-review-intelligence-focused
          path: |
            focused-integration.log
            focused-rust.log
          if-no-files-found: ignore
          retention-days: 7
