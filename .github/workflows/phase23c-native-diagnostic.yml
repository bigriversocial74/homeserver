name: Phase 23C Native Diagnostic

on:
  push:
    branches:
      - feature/phase-23c-local-whisper-transcription
    paths:
      - ".github/workflows/phase23c-native-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase23c-native-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.ref == 'refs/heads/feature/phase-23c-local-whisper-transcription'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - name: Check out diagnostic candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-23c-local-whisper-transcription

      - name: Install Linux desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential \
            cmake \
            clang \
            libclang-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Configure stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Configure Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Prepare exact desktop build boundary
        shell: bash
        run: |
          npm ci
          npm run build
          npm run prepare:icons
          cargo build \
            -p microgifter-homeserver-service \
            -p microgifter-homeserver-updater \
            -p microgifter-homeserver-mcp
          mkdir -p src-tauri/resources
          install -m 0755 target/debug/microgifter-homeserver-service src-tauri/resources/microgifter-homeserver-service.exe
          install -m 0755 target/debug/microgifter-homeserver-updater src-tauri/resources/microgifter-homeserver-updater.exe
          install -m 0755 target/debug/microgifter-homeserver-mcp src-tauri/resources/microgifter-homeserver-mcp.exe

      - name: Capture strict Control Center lint output
        shell: bash
        run: |
          set +e
          cargo clippy -p microgifter-homeserver-control-center --all-targets -- -D warnings \
            > phase23c-native-diagnostic.txt 2>&1
          status=$?
          {
            printf '\nDIAGNOSTIC_EXIT_CODE=%s\n' "$status"
            printf 'DIAGNOSTIC_HEAD=%s\n' "$(git rev-parse HEAD)"
          } >> phase23c-native-diagnostic.txt
          cat phase23c-native-diagnostic.txt
          exit 0

      - name: Commit diagnostic report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase23c-native-diagnostic.txt
          if git diff --cached --quiet; then
            echo "Diagnostic report unchanged"
            exit 0
          fi
          git commit -m "ci: record Phase 23C native lint diagnostic"
          git push origin HEAD:feature/phase-23c-local-whisper-transcription
