name: Phase 3A Diagnostic Reporter

on:
  push:
    branches:
      - feature/phase-3-backup-recovery-updates-20260724

concurrency:
  group: phase3a-diagnostic-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        id: npm
        continue-on-error: true
        shell: pwsh
        run: npm ci *> npm-install.log

      - name: Frontend validation
        id: frontend
        if: steps.npm.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          npm run check:frontend *> frontend.log
          if ($LASTEXITCODE -eq 0) { npm run build *>> frontend.log }
          exit $LASTEXITCODE

      - name: Prepare generated resources
        id: resources
        if: steps.frontend.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: npm run prepare:icons *> resources.log

      - name: Strict Rust formatting
        id: formatting
        continue-on-error: true
        shell: pwsh
        run: cargo fmt --all --check *> formatting.log

      - name: Build Windows service
        id: build
        if: steps.resources.outcome == 'success' && steps.formatting.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: cargo build --release --package microgifter-homeserver-service --locked *> service-build.log

      - name: Stage Windows service
        id: stage
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: Copy-Item target/release/microgifter-homeserver-service.exe src-tauri/resources/microgifter-homeserver-service.exe -Force

      - name: Full workspace tests
        id: tests
        if: steps.stage.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: cargo test --workspace --locked *> cargo-test.log

      - name: Strict workspace lint
        id: lint
        if: steps.tests.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: cargo clippy --workspace --all-targets --locked -- -D warnings *> cargo-clippy.log

      - name: Backup and restore smoke test
        id: smoke
        if: steps.lint.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: ./scripts/smoke-test-service.ps1 *> service-smoke.log

      - name: Build NSIS installer
        id: installer
        if: steps.smoke.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: npm run tauri:build *> tauri-build.log

      - name: Installed LocalSystem smoke test
        id: installed
        if: steps.installer.outcome == 'success'
        continue-on-error: true
        shell: pwsh
        run: |
          $bundle = "target/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          ./scripts/smoke-test-installer.ps1 -InstallerPath $installer.FullName *> installed-smoke.log

      - name: Report diagnostic result to issue 4
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          OUTCOME_NPM: ${{ steps.npm.outcome }}
          OUTCOME_FRONTEND: ${{ steps.frontend.outcome }}
          OUTCOME_RESOURCES: ${{ steps.resources.outcome }}
          OUTCOME_FORMATTING: ${{ steps.formatting.outcome }}
          OUTCOME_BUILD: ${{ steps.build.outcome }}
          OUTCOME_TESTS: ${{ steps.tests.outcome }}
          OUTCOME_LINT: ${{ steps.lint.outcome }}
          OUTCOME_SMOKE: ${{ steps.smoke.outcome }}
          OUTCOME_INSTALLER: ${{ steps.installer.outcome }}
          OUTCOME_INSTALLED: ${{ steps.installed.outcome }}
        run: |
          $outcomes = [ordered]@{
            "npm ci" = $env:OUTCOME_NPM
            "Frontend" = $env:OUTCOME_FRONTEND
            "Resources" = $env:OUTCOME_RESOURCES
            "Formatting" = $env:OUTCOME_FORMATTING
            "Service build" = $env:OUTCOME_BUILD
            "Workspace tests" = $env:OUTCOME_TESTS
            "Clippy" = $env:OUTCOME_LINT
            "Backup/restore smoke" = $env:OUTCOME_SMOKE
            "NSIS build" = $env:OUTCOME_INSTALLER
            "Installed service smoke" = $env:OUTCOME_INSTALLED
          }
          $lines = @("## Phase 3A Windows diagnostic", "", "Commit: ``${{ github.sha }}``", "")
          foreach ($entry in $outcomes.GetEnumerator()) {
            $lines += "- **$($entry.Key):** $($entry.Value)"
          }
          $logs = @("npm-install.log", "frontend.log", "resources.log", "formatting.log", "service-build.log", "cargo-test.log", "cargo-clippy.log", "service-smoke.log", "tauri-build.log", "installed-smoke.log")
          foreach ($log in $logs) {
            if (Test-Path $log) {
              $tail = (Get-Content $log -Tail 100) -join "`n"
              if ($tail) {
                $lines += @("", "<details><summary>$log</summary>", "", "``````text", $tail, "``````", "", "</details>")
              }
            }
          }
          $lines | Set-Content phase3a-diagnostic.md -Encoding UTF8
          gh issue comment 4 --repo bigriversocial74/homeserver --body-file phase3a-diagnostic.md

      - name: Fail when a diagnostic gate failed
        if: always()
        shell: pwsh
        run: |
          $outcomes = @(
            "${{ steps.npm.outcome }}",
            "${{ steps.frontend.outcome }}",
            "${{ steps.resources.outcome }}",
            "${{ steps.formatting.outcome }}",
            "${{ steps.build.outcome }}",
            "${{ steps.tests.outcome }}",
            "${{ steps.lint.outcome }}",
            "${{ steps.smoke.outcome }}",
            "${{ steps.installer.outcome }}",
            "${{ steps.installed.outcome }}"
          )
          if ($outcomes -contains "failure" -or $outcomes -contains "cancelled") { exit 1 }
