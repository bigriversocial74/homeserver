name: Apply Microgifter manifest endpoint

on:
  push:
    branches:
      - feature/microgifter-primary-authority-restoration
    paths:
      - .github/workflows/apply-microgifter-manifest-endpoint.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.ref_name == 'feature/microgifter-primary-authority-restoration'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out controlled branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/microgifter-primary-authority-restoration
          fetch-depth: 0

      - name: Apply exact primary-endpoint patches
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one endpoint anchor, found {count}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'crates/homeserver-service/src/config.rs',
              'https://updates.microgifter.com/homeserver/stable/manifest.json',
              'https://microgifter.com/api/homeserver/update-manifest-stable.php'
          )

          validator = Path('scripts/validate-microgifter-primary-authority.py')
          text = validator.read_text(encoding='utf-8')
          anchor = '''    require(\n        "crates/homeserver-service/src/software_authority.rs",'''
          addition = '''    require(\n        "crates/homeserver-service/src/config.rs",\n        [\n            'https://microgifter.com/api/homeserver/update-manifest-stable.php',\n            'DEFAULT_VP3_BASE_URL',\n        ],\n    )\n    require(\n        "crates/homeserver-service/src/software_authority.rs",'''
          if text.count(anchor) != 1:
              raise SystemExit('validator endpoint anchor is not unique')
          validator.write_text(text.replace(anchor, addition, 1), encoding='utf-8')

          Path('.github/workflows/apply-microgifter-manifest-endpoint.yml').unlink()

      - name: Format and commit permanent files
        run: |
          cargo fmt --all
          git config user.name "HomeServer Build Automation"
          git config user.email "actions@users.noreply.github.com"
          git add crates/homeserver-service/src/config.rs scripts/validate-microgifter-primary-authority.py .github/workflows/apply-microgifter-manifest-endpoint.yml
          git commit -m "Point HomeServer updates to Microgifter authority"
          git push origin HEAD:feature/microgifter-primary-authority-restoration
