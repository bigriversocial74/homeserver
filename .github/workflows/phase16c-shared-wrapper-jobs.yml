name: Phase 16C Shared Wrapper Jobs

on:
  pull_request:
  push:
    branches:
      - feature/phase-16c-shared-jobs-events-receipts
      - main

permissions:
  contents: write

concurrency:
  group: homeserver-phase16c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format_repair:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/phase-16c-shared-jobs-events-receipts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: feature/phase-16c-shared-jobs-events-receipts
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Commit formatter-only repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates
          if git diff --cached --quiet; then
            echo 'Rust source is already formatted.'
            exit 0
          fi
          git commit -m 'Apply canonical Rust formatting to Phase 16C'
          git push origin HEAD:feature/phase-16c-shared-jobs-events-receipts

  contract:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate Phase 16C shared job boundaries
        run: python scripts/validate-wrapper-jobs.py
      - name: Validate retained frontend contracts and build
        run: |
          npm run check:frontend
          npm run build
      - name: Validate Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile and test HomeServer service
        run: cargo test -p microgifter-homeserver-service
      - name: Strict HomeServer service lint
        run: cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings
