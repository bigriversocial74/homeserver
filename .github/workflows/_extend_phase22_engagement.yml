name: Extend Phase 22 Engagement

on:
  push:
    branches:
      - feature/unified-homeserver-agent-orchestration
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: extend-phase22-engagement
  cancel-in-progress: false

jobs:
  extend:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/unified-homeserver-agent-orchestration
          fetch-depth: 0
      - name: Apply engagement integration
        run: python .github/scripts/extend_phase22_engagement.py
      - name: Format and validate
        run: |
          cargo fmt --all
          node --check src/main.js
          node --check src/homeserver-agent-chat.js
          python scripts/validate-unified-agent-orchestration.py
      - name: Remove temporary integration files
        run: |
          rm -f .github/scripts/extend_phase22_engagement.py
          rm -f .github/workflows/_extend_phase22_engagement.yml
      - name: Commit permanent engagement integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Integrate Agent guidance with engagement notifications"
          git push origin HEAD:feature/unified-homeserver-agent-orchestration
