name: Phase 16B Materialize

on:
  push:
    branches:
      - feature/phase-16b-wrapper-capability-grants
  pull_request:

permissions:
  contents: write

concurrency:
  group: homeserver-phase16b-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: feature/phase-16b-wrapper-capability-grants
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Materialize reviewed Phase 16B source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          shas=(
            ce440ed96b570e0412096d457475571c27d670aa
            94d29ae4078131e71ee163b846d1912a26b386f7
            c1544c9ec69fb6001abca6844051120d4b581f2a
          )
          : > phase16b-bundle.tgz
          for sha in "${shas[@]}"; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode >> phase16b-bundle.tgz
          done
          printf '%s  %s\n' '4993269c9f859f5798af21e43309c9dd4a9094a6424cd559fb25ddf4018b7b6b' 'phase16b-bundle.tgz' | sha256sum --check
          tar --extract --gzip --file phase16b-bundle.tgz
          rm phase16b-bundle.tgz
          python - <<'PY'
          import json
          from pathlib import Path

          app = Path('crates/homeserver-service/src/app.rs')
          text = app.read_text(encoding='utf-8')
          replacements = [
              (
                  '#[path = "app/wrapper_core.rs"]\nmod wrapper_core;\n',
                  '#[path = "app/wrapper_core.rs"]\nmod wrapper_core;\n\n#[path = "app/wrapper_grants.rs"]\nmod wrapper_grants;\n',
              ),
              (
                  '    wrapper_core::initialize(&connection)?;\n',
                  '    wrapper_core::initialize(&connection)?;\n    wrapper_grants::initialize(&connection)?;\n',
              ),
              (
                  '            .merge(wrapper_core::router(state.clone()))\n',
                  '            .merge(wrapper_core::router(state.clone()))\n            .merge(wrapper_grants::router(state.clone()))\n',
              ),
              (
                  '                        if let Err(error) = wrapper_core::maintain_history(&connection) {\n                            warn!(?error, "scheduled wrapper registry retention failed");\n                        }\n',
                  '                        if let Err(error) = wrapper_core::maintain_history(&connection) {\n                            warn!(?error, "scheduled wrapper registry retention failed");\n                        }\n                        if let Err(error) = wrapper_grants::maintain_history(&connection) {\n                            warn!(?error, "scheduled wrapper grant retention failed");\n                        }\n',
              ),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'unexpected app integration match count for {old!r}: {text.count(old)}')
              text = text.replace(old, new)
          app.write_text(text, encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          command = package['scripts']['check:frontend']
          validator = 'validate-wrapper-grants.py'
          if validator not in command:
              command += ' validate-wrapper-grants.py'
          package['scripts']['check:frontend'] = command
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')
          PY
          cargo fmt --all
      - name: Commit integrated Phase 16B implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates database docs scripts package.json
          if git diff --cached --quiet; then
            echo 'Phase 16B source is already materialized.'
            exit 0
          fi
          git commit -m 'Build Phase 16B wrapper capability grant authority'
          git push origin HEAD:feature/phase-16b-wrapper-capability-grants
