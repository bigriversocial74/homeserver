name: Refresh Phase 5A Cargo lock

on:
  push:
    branches:
      - feature/phase-5a-local-readonly-mcp-20260727
    paths:
      - .github/workflows/refresh-phase5a-cargo-lock.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-phase5a-cargo-lock
  cancel-in-progress: false

jobs:
  refresh-lock:
    runs-on: windows-2025
    steps:
      - name: Check out Phase 5A branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-5a-local-readonly-mcp-20260727
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Regenerate and commit Cargo.lock
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff -- Cargo.lock
          git add Cargo.lock

          $staged = git diff --cached --name-only
          if (-not $staged) {
            Write-Host 'Cargo.lock is already current.'
            exit 0
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh Cargo.lock for Phase 5A'
          git push origin HEAD:feature/phase-5a-local-readonly-mcp-20260727
