name: Repair Agent Chat resilience and layout

on:
  push:
    branches:
      - hotfix/agent-chat-dead-controls-20260728
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: repair-agent-chat-resilience-layout
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hotfix/agent-chat-dead-controls-20260728
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply resilience and layout repair
        run: |
          if [ ! -f scripts/repair-agent-chat-resilience-layout.py ]; then
            echo "Repair already committed by another run."
            exit 0
          fi
          python scripts/repair-agent-chat-resilience-layout.py

      - name: Validate frontend and production build
        run: |
          if [ ! -f scripts/repair-agent-chat-resilience-layout.py ]; then
            echo "Repair already committed by another run."
            exit 0
          fi
          npm ci
          npm run check:frontend
          npm run build

      - name: Commit clean product repair
        run: |
          if [ ! -f scripts/repair-agent-chat-resilience-layout.py ]; then
            echo "Repair already committed by another run."
            exit 0
          fi
          rm .github/workflows/repair-agent-chat-resilience-layout.yml
          rm scripts/repair-agent-chat-resilience-layout.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/homeserver-agent-chat.js src/homeserver-agent-chat.css scripts/validate-agent-chat-route.py .github/workflows/repair-agent-chat-resilience-layout.yml scripts/repair-agent-chat-resilience-layout.py
          git commit -m "Isolate and redesign Agent Chat workspace"
          git push origin HEAD:hotfix/agent-chat-dead-controls-20260728
