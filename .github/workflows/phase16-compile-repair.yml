name: Phase 16 Compile Repair

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: homeserver-phase16-compile-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: feature/phase-16-multi-wrapper-core-v1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Repair Phase 16A compiler defects
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/homeserver-service/src/app/wrapper_core.rs')
          text = path.read_text(encoding='utf-8')

          old_include = 'include_str!("../../../database/migrations/0020_wrapper_identity_and_pairing.sql")'
          new_include = 'include_str!("../../../../database/migrations/0020_wrapper_identity_and_pairing.sql")'
          if text.count(old_include) != 1:
              raise SystemExit('unexpected migration include path count')
          text = text.replace(old_include, new_include)

          old_map = 'let mut wrappers = HashMap::new();'
          new_map = 'let mut wrappers: HashMap<String, String> = HashMap::new();'
          if text.count(old_map) != 1:
              raise SystemExit('unexpected wrapper map declaration count')
          text = text.replace(old_map, new_map)

          old_prefix = '    statement\n        .query_map'
          new_prefix = '    let rows = statement\n        .query_map'
          if text.count(old_prefix) != 5:
              raise SystemExit(f'unexpected query collector prefix count: {text.count(old_prefix)}')
          text = text.replace(old_prefix, new_prefix)

          old_suffix = '        .collect::<rusqlite::Result<Vec<_>>>()\n        .map_err(Into::into)\n}'
          new_suffix = '        .collect::<rusqlite::Result<Vec<_>>>()?;\n    Ok(rows)\n}'
          if text.count(old_suffix) != 5:
              raise SystemExit(f'unexpected query collector suffix count: {text.count(old_suffix)}')
          text = text.replace(old_suffix, new_suffix)

          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
      - name: Commit compiler repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates
          git commit -m 'Repair Phase 16A native compilation'
          git push origin HEAD:feature/phase-16-multi-wrapper-core-v1
