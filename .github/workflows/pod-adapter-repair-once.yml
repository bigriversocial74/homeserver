name: POD Adapter Repair Once

on:
  push:
    branches:
      - feature/pod-provider-voice-adapter-v1-20260728

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pod-provider-voice-adapter-v1-20260728
          fetch-depth: 0

      - name: Repair native compile defects
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('crates/homeserver-service/src/app/pod_provider_runtime.rs')
          source = path.read_text(encoding='utf-8')

          replacements = [
              (
                  'use crate::{database, AppState};',
                  'use crate::AppState;',
              ),
              (
                  '''    let connection_ids = {
        let connection = state.connection()?;
        connection.prepare(
            "SELECT connection_id FROM cloud_connections WHERE provider_key='pod' AND state IN ('connected','degraded') ORDER BY paired_at_utc,connection_id"
        )?.query_map([], |row| row.get::<_, String>(0))?
            .collect::<rusqlite::Result<Vec<_>>>()?
    };''',
                  '''    let connection_ids = {
        let connection = state.connection()?;
        let mut statement = connection.prepare(
            "SELECT connection_id FROM cloud_connections WHERE provider_key='pod' AND state IN ('connected','degraded') ORDER BY paired_at_utc,connection_id"
        )?;
        let ids = statement
            .query_map([], |row| row.get::<_, String>(0))?
            .collect::<rusqlite::Result<Vec<_>>>()?;
        ids
    };''',
              ),
              (
                  '''    connection_summary(&state.connection()?, &connection_id)
}''',
                  '''    let connection = state.connection()?;
    connection_summary(&connection, &connection_id)
}''',
              ),
              (
                  '''    Ok(statement
        .query_map(params![limit.clamp(1, 250) as i64], |row| {
            Ok(JobSummary {
                local_job_id: row.get(0)?,
                connection_id: row.get(1)?,
                remote_job_uuid: row.get(2)?,
                job_type: row.get(3)?,
                state: row.get(4)?,
                attempt_count: row.get::<_, i64>(5)?.max(0) as u32,
                maximum_attempts: row.get::<_, i64>(6)?.max(1) as u32,
                model_name: row.get(7)?,
                processing_ms: row
                    .get::<_, Option<i64>>(8)?
                    .map(|value| value.max(0) as u64),
                failure_code: row.get(9)?,
                failure_message: row.get(10)?,
                leased_at_utc: row.get(11)?,
                completed_at_utc: row.get(12)?,
            })
        })?
        .collect::<rusqlite::Result<Vec<_>>>()?)''',
                  '''    let rows = statement
        .query_map(params![limit.clamp(1, 250) as i64], |row| {
            Ok(JobSummary {
                local_job_id: row.get(0)?,
                connection_id: row.get(1)?,
                remote_job_uuid: row.get(2)?,
                job_type: row.get(3)?,
                state: row.get(4)?,
                attempt_count: row.get::<_, i64>(5)?.max(0) as u32,
                maximum_attempts: row.get::<_, i64>(6)?.max(1) as u32,
                model_name: row.get(7)?,
                processing_ms: row
                    .get::<_, Option<i64>>(8)?
                    .map(|value| value.max(0) as u64),
                failure_code: row.get(9)?,
                failure_message: row.get(10)?,
                leased_at_utc: row.get(11)?,
                completed_at_utc: row.get(12)?,
            })
        })?
        .collect::<rusqlite::Result<Vec<_>>>()?;
    Ok(rows)''',
              ),
              (
                  '''    Ok(statement
        .query_map(params![limit.clamp(1, 250) as i64], |row| {
            let metadata: String = row.get(6)?;
            Ok(ReceiptSummary {
                receipt_id: row.get(0)?,
                connection_id: row.get(1)?,
                local_job_id: row.get(2)?,
                event_type: row.get(3)?,
                outcome: row.get(4)?,
                detail_code: row.get(5)?,
                metadata: serde_json::from_str(&metadata).unwrap_or_else(|_| json!({})),
                created_at_utc: row.get(7)?,
            })
        })?
        .collect::<rusqlite::Result<Vec<_>>>()?)''',
                  '''    let rows = statement
        .query_map(params![limit.clamp(1, 250) as i64], |row| {
            let metadata: String = row.get(6)?;
            Ok(ReceiptSummary {
                receipt_id: row.get(0)?,
                connection_id: row.get(1)?,
                local_job_id: row.get(2)?,
                event_type: row.get(3)?,
                outcome: row.get(4)?,
                detail_code: row.get(5)?,
                metadata: serde_json::from_str(&metadata).unwrap_or_else(|_| json!({})),
                created_at_utc: row.get(7)?,
            })
        })?
        .collect::<rusqlite::Result<Vec<_>>>()?;
    Ok(rows)''',
              ),
              (
                  '            bearer_token: secrets.bearer_token,',
                  '            bearer_token: secrets.bearer_token.clone(),',
              ),
          ]

          for old, new in replacements:
              if old not in source:
                  raise SystemExit(f'Expected repair target was not found: {old[:90]!r}')
              source = source.replace(old, new, 1)

          path.write_text(source, encoding='utf-8')
          PY

          cargo fmt --all
          rm .github/workflows/pod-adapter-repair-once.yml

      - name: Commit repaired source and remove helper
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-service/src/app/pod_provider_runtime.rs .github/workflows/pod-adapter-repair-once.yml
          git commit -m "Repair POD provider native compile defects"
          git push origin HEAD:feature/pod-provider-voice-adapter-v1-20260728
