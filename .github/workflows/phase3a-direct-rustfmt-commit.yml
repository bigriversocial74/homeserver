name: Phase 3A Direct Rustfmt Commit

on:
  push:
    branches:
      - feature/phase-3-backup-recovery-updates-20260724

permissions:
  contents: write

jobs:
  commit-formatting:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3-backup-recovery-updates-20260724
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Generate canonical Rust sources
        shell: pwsh
        run: |
          cargo fmt --all
          $changed = @(git diff --name-only -- "*.rs")
          if ($changed.Count -eq 0) {
            throw "rustfmt reported no changed Rust files"
          }
          $changed | Set-Content changed-rust-files.txt -Encoding utf8NoBOM
          Write-Host "Formatted files:"
          $changed | ForEach-Object { Write-Host $_ }

      - name: Create exact Git tree and commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "bigriversocial74/homeserver"
          $branch = "feature/phase-3-backup-recovery-updates-20260724"
          $head = (gh api "/repos/$repo/git/ref/heads/$branch" --jq ".object.sha").Trim()
          $headCommit = gh api "/repos/$repo/git/commits/$head" | ConvertFrom-Json
          $entries = @()

          foreach ($path in Get-Content changed-rust-files.txt) {
            $bytes = [IO.File]::ReadAllBytes($path)
            $payload = @{
              content = [Convert]::ToBase64String($bytes)
              encoding = "base64"
            } | ConvertTo-Json -Compress
            $payloadPath = "blob-$([guid]::NewGuid().ToString('N')).json"
            $payload | Set-Content $payloadPath -Encoding utf8NoBOM
            $blob = gh api --method POST "/repos/$repo/git/blobs" --input $payloadPath | ConvertFrom-Json
            $entries += @{
              path = $path
              mode = "100644"
              type = "blob"
              sha = $blob.sha
            }
          }

          $entries += @{
            path = ".github/workflows/phase3a-direct-rustfmt-commit.yml"
            mode = "100644"
            type = "blob"
            sha = $null
          }
          $treePayload = @{
            base_tree = $headCommit.tree.sha
            tree = $entries
          } | ConvertTo-Json -Depth 8 -Compress
          $treePayload | Set-Content tree-payload.json -Encoding utf8NoBOM
          $tree = gh api --method POST "/repos/$repo/git/trees" --input tree-payload.json | ConvertFrom-Json

          $commitPayload = @{
            message = "Commit exact recovery transfer Rust formatting"
            tree = $tree.sha
            parents = @($head)
          } | ConvertTo-Json -Depth 6 -Compress
          $commitPayload | Set-Content commit-payload.json -Encoding utf8NoBOM
          $commit = gh api --method POST "/repos/$repo/git/commits" --input commit-payload.json | ConvertFrom-Json

          $refPayload = @{
            sha = $commit.sha
            force = $false
          } | ConvertTo-Json -Compress
          $refPayload | Set-Content ref-payload.json -Encoding utf8NoBOM
          gh api --method PATCH "/repos/$repo/git/refs/heads/$branch" --input ref-payload.json | Out-Null
          Write-Host "Direct rustfmt commit: $($commit.sha)"
