name: HomeServer Installer Repair

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: homeserver-installer-repair-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  installer-repair:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Restore installer repair build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-installer-repair-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Prepare Windows resources
        run: npm run prepare:icons

      - name: Build fresh service and updater
        shell: pwsh
        run: |
          Remove-Item target/release/microgifter-homeserver-service.exe -Force -ErrorAction SilentlyContinue
          Remove-Item target/release/microgifter-homeserver-updater.exe -Force -ErrorAction SilentlyContinue
          Remove-Item src-tauri/resources/microgifter-homeserver-service.exe -Force -ErrorAction SilentlyContinue
          Remove-Item src-tauri/resources/microgifter-homeserver-updater.exe -Force -ErrorAction SilentlyContinue
          cargo build --release --package microgifter-homeserver-service --locked
          cargo build --release --package microgifter-homeserver-updater --locked
          Copy-Item target/release/microgifter-homeserver-service.exe src-tauri/resources/microgifter-homeserver-service.exe -Force
          Copy-Item target/release/microgifter-homeserver-updater.exe src-tauri/resources/microgifter-homeserver-updater.exe -Force

      - name: Build NSIS package
        run: npm run tauri:build

      - name: Save installer repair build cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-installer-repair-${{ hashFiles('Cargo.lock', '**/Cargo.toml') }}

      - name: Resolve installer
        id: installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          "path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Installed LocalSystem ACL, vault, backup, and uninstall smoke test
        shell: pwsh
        run: ./scripts/smoke-test-installer.ps1 -InstallerPath "${{ steps.installer.outputs.path }}"

      - name: Upload installer repair diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: installer-repair-diagnostics
          path: |
            installer-verification.log
            ${{ runner.temp }}/Microgifter-HomeServer-install.log
          if-no-files-found: warn
          retention-days: 7
