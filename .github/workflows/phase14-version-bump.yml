name: Phase 14 Version Bump
# One-use coordinated release metadata update.

on:
  push:
    branches:
      - feature/phase-14-vp3-activation-control-center

permissions:
  contents: write

jobs:
  bump:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-14-vp3-activation-control-center
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
      - name: Set coordinated version 0.1.4
        shell: bash
        run: |
          npm version 0.1.4 --no-git-tag-version
          python - <<'PY'
          import json
          from pathlib import Path

          cargo = Path('Cargo.toml')
          source = cargo.read_text()
          source = source.replace('version = "0.1.3"', 'version = "0.1.4"', 1)
          cargo.write_text(source)

          tauri = Path('src-tauri/tauri.conf.json')
          data = json.loads(tauri.read_text())
          data['version'] = '0.1.4'
          tauri.write_text(json.dumps(data, indent=2) + '\n')
          PY
          cargo generate-lockfile
          test "$(node -p "require('./package.json').version")" = "0.1.4"
          grep -q 'version = "0.1.4"' Cargo.toml
          grep -q '"version": "0.1.4"' src-tauri/tauri.conf.json
      - name: Commit coordinated version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json Cargo.toml Cargo.lock src-tauri/tauri.conf.json
          git commit -m "Release HomeServer Control Center 0.1.4"
          git push origin HEAD:feature/phase-14-vp3-activation-control-center
