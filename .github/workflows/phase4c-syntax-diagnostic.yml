name: Phase 4C Syntax Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Capture frontend diagnostics
        shell: cmd
        continue-on-error: true
        run: npm run check:frontend > frontend-diagnostic.txt 2>&1
      - name: Capture PowerShell diagnostics
        shell: pwsh
        run: |
          $lines = [System.Collections.Generic.List[string]]::new()
          foreach ($script in Get-ChildItem scripts -Filter '*.ps1') {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if (@($parseErrors).Count -eq 0) {
              $lines.Add("POWERSHELL_OK: $($script.Name)")
            } else {
              foreach ($parseError in @($parseErrors)) {
                $lines.Add("POWERSHELL_ERROR: $($script.Name):$($parseError.Extent.StartLineNumber):$($parseError.Extent.StartColumnNumber): $($parseError.Message)")
              }
            }
          }
          $lines | Set-Content powershell-diagnostic.txt
      - name: Upload syntax diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase4c-syntax-diagnostic
          path: |
            frontend-diagnostic.txt
            powershell-diagnostic.txt
          if-no-files-found: warn
          retention-days: 1
