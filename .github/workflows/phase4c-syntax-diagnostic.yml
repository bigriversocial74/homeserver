name: Phase 4C Syntax Diagnostic

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-2025
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Capture frontend and PowerShell diagnostics
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $lines = [System.Collections.Generic.List[string]]::new()
          npm run check:frontend *>&1 | ForEach-Object { $lines.Add("FRONTEND: $_") }
          $lines.Add("FRONTEND_EXIT: $LASTEXITCODE")
          foreach ($script in Get-ChildItem scripts -Filter '*.ps1') {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -eq 0) {
              $lines.Add("POWERSHELL_OK: $($script.Name)")
            } else {
              foreach ($error in $errors) {
                $lines.Add("POWERSHELL_ERROR: $($script.Name):$($error.Extent.StartLineNumber):$($error.Extent.StartColumnNumber): $($error.Message)")
              }
            }
          }
          $lines | Set-Content syntax-diagnostic.txt
      - name: Upload syntax diagnostic
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase4c-syntax-diagnostic
          path: syntax-diagnostic.txt
          if-no-files-found: error
          retention-days: 1
