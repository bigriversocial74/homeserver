name: Repair Agent Chat controls

on:
  push:
    branches:
      - hotfix/agent-chat-dead-controls-20260728

permissions:
  contents: write

concurrency:
  group: hotfix-agent-chat-dead-controls
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hotfix/agent-chat-dead-controls-20260728
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Add persistent delegated controls
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          chat = Path("src/homeserver-agent-chat.js")
          text = chat.read_text(encoding="utf-8")

          state_anchor = "let initialized = false;\n"
          if "let delegatedEventsBound = false;" not in text:
              if state_anchor not in text:
                  raise SystemExit("Agent Chat state anchor not found")
              text = text.replace(state_anchor, state_anchor + "let delegatedEventsBound = false;\n", 1)

          mount_anchor = "  canvas.innerHTML = renderPage();\n  bindEvents();\n"
          mount_replacement = "  canvas.innerHTML = renderPage();\n  ensureDelegatedEvents();\n"
          if mount_anchor in text:
              text = text.replace(mount_anchor, mount_replacement, 1)
          elif mount_replacement not in text:
              raise SystemExit("Agent Chat mount anchor not found")

          insertion_anchor = "\nconst app = document.querySelector(\"#app\");\n"
          delegated_block = "\n".join([
              "",
              "function delegatedAgentClick(event) {",
              "  if (!isAgentPage() || !(event.target instanceof Element)) return;",
              "  const control = event.target.closest(\"button,[data-chat-thread],[data-chat-suggestion],[data-close-provider],[data-close-connect],[data-provider-action]\");",
              "  if (!control || !control.closest('[data-homeserver-chat-mounted=\"true\"]')) return;",
              "",
              "  const handled =",
              "    control.matches(\"#hs-chat-new,#hs-chat-refresh,#hs-chat-open-connections,#hs-chat-provider-summary,#hs-chat-connection-toggle,#hs-provider-open-connect,#hs-provider-refresh\") ||",
              "    control.matches(\"[data-chat-thread],[data-chat-suggestion],[data-close-provider],[data-close-connect],[data-provider-action]\");",
              "  if (!handled) return;",
              "",
              "  event.preventDefault();",
              "  event.stopImmediatePropagation();",
              "",
              "  if (control.matches(\"#hs-chat-new\")) return startNewChat();",
              "  if (control.matches(\"#hs-chat-refresh\")) return void refreshAll();",
              "  if (control.matches(\"[data-chat-thread]\")) {",
              "    activeThreadId = control.dataset.chatThread || null;",
              "    notice = null;",
              "    return mount(true);",
              "  }",
              "  if (control.matches(\"[data-chat-suggestion]\")) {",
              "    const input = document.querySelector(\"#hs-chat-input\");",
              "    if (input) {",
              "      input.value = control.dataset.chatSuggestion || \"\";",
              "      input.focus();",
              "      autoSizeComposer();",
              "    }",
              "    return;",
              "  }",
              "  if (control.matches(\"#hs-chat-open-connections,#hs-chat-provider-summary,#hs-chat-connection-toggle\")) {",
              "    connectionDrawerOpen = true;",
              "    notice = null;",
              "    return mount(true);",
              "  }",
              "  if (control.matches(\"[data-close-provider]\")) {",
              "    if (control.classList.contains(\"hs-provider-backdrop\") && event.target !== control) return;",
              "    connectionDrawerOpen = false;",
              "    connectFormOpen = false;",
              "    return mount(true);",
              "  }",
              "  if (control.matches(\"#hs-provider-open-connect\")) {",
              "    connectFormOpen = true;",
              "    return mount(true);",
              "  }",
              "  if (control.matches(\"[data-close-connect]\")) {",
              "    connectFormOpen = false;",
              "    return mount(true);",
              "  }",
              "  if (control.matches(\"#hs-provider-refresh\")) return void refreshProvider();",
              "  if (control.matches(\"[data-provider-action]\")) return void runProviderAction({ currentTarget: control });",
              "}",
              "",
              "function delegatedAgentSubmit(event) {",
              "  if (!isAgentPage() || !(event.target instanceof HTMLFormElement)) return;",
              "  if (event.target.id === \"homeserver-chat-form\") {",
              "    event.stopImmediatePropagation();",
              "    return void submitPrompt(event);",
              "  }",
              "  if (event.target.id === \"hs-provider-connect-form\") {",
              "    event.stopImmediatePropagation();",
              "    return void connectMicrogifter(event);",
              "  }",
              "}",
              "",
              "function delegatedAgentInput(event) {",
              "  if (!isAgentPage() || !(event.target instanceof HTMLInputElement || event.target instanceof HTMLTextAreaElement)) return;",
              "  if (event.target.id === \"hs-chat-input\") return autoSizeComposer();",
              "  if (event.target.id === \"hs-chat-history-search\") {",
              "    historyQuery = event.target.value;",
              "    mount(true);",
              "    const input = document.querySelector(\"#hs-chat-history-search\");",
              "    if (input) {",
              "      input.focus();",
              "      input.setSelectionRange(input.value.length, input.value.length);",
              "    }",
              "  }",
              "}",
              "",
              "function delegatedAgentKeydown(event) {",
              "  if (!isAgentPage() || !(event.target instanceof HTMLTextAreaElement) || event.target.id !== \"hs-chat-input\") return;",
              "  if (event.key === \"Enter\" && !event.shiftKey) {",
              "    event.preventDefault();",
              "    event.stopImmediatePropagation();",
              "    document.querySelector(\"#homeserver-chat-form\")?.requestSubmit();",
              "  }",
              "}",
              "",
              "function ensureDelegatedEvents() {",
              "  if (delegatedEventsBound) return;",
              "  delegatedEventsBound = true;",
              "  document.addEventListener(\"click\", delegatedAgentClick, true);",
              "  document.addEventListener(\"submit\", delegatedAgentSubmit, true);",
              "  document.addEventListener(\"input\", delegatedAgentInput, true);",
              "  document.addEventListener(\"keydown\", delegatedAgentKeydown, true);",
              "}",
              "",
          ])
          if "function delegatedAgentClick(event)" not in text:
              if insertion_anchor not in text:
                  raise SystemExit("Agent Chat insertion anchor not found")
              text = text.replace(insertion_anchor, delegated_block + insertion_anchor, 1)

          init_anchor = "const app = document.querySelector(\"#app\");\n"
          if "ensureDelegatedEvents();\nconst app" not in text:
              text = text.replace(init_anchor, "ensureDelegatedEvents();\n" + init_anchor, 1)

          chat.write_text(text, encoding="utf-8")

          main = Path("src/main.js")
          main_text = main.read_text(encoding="utf-8")
          nav_anchor = "\nwindow.addEventListener(\"hashchange\", () => {\n"
          nav_block = "\n".join([
              "",
              "document.addEventListener(\"click\", (event) => {",
              "  if (!(event.target instanceof Element)) return;",
              "  const control = event.target.closest(\"[data-page]\");",
              "  if (!control) return;",
              "  event.preventDefault();",
              "  event.stopImmediatePropagation();",
              "  navigate(control.dataset.page);",
              "}, true);",
              "",
          ])
          if "event.target.closest(\"[data-page]\")" not in main_text:
              if nav_anchor not in main_text:
                  raise SystemExit("Control Center navigation anchor not found")
              main_text = main_text.replace(nav_anchor, nav_block + nav_anchor, 1)
          main.write_text(main_text, encoding="utf-8")
          '@ | python -

      - name: Validate interaction hotfix
        shell: pwsh
        run: |
          node --check src/main.js
          node --check src/homeserver-agent-chat.js
          npm ci
          npm run check:frontend
          npm run build
          @'
          from pathlib import Path
          chat = Path("src/homeserver-agent-chat.js").read_text(encoding="utf-8")
          main = Path("src/main.js").read_text(encoding="utf-8")
          required = [
              "function delegatedAgentClick(event)",
              "document.addEventListener(\"click\", delegatedAgentClick, true)",
              "document.addEventListener(\"submit\", delegatedAgentSubmit, true)",
              "document.addEventListener(\"input\", delegatedAgentInput, true)",
              "document.addEventListener(\"keydown\", delegatedAgentKeydown, true)",
              "event.target.closest(\"[data-page]\")",
          ]
          combined = chat + "\n" + main
          missing = [item for item in required if item not in combined]
          if missing:
              raise SystemExit("Missing delegated interaction controls: " + ", ".join(missing))
          print("Persistent Agent Chat and Control Center interactions validated.")
          '@ | python -

      - name: Commit hotfix and remove helper
        shell: pwsh
        run: |
          Remove-Item .github/workflows/hotfix-agent-chat-controls.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/homeserver-agent-chat.js .github/workflows/hotfix-agent-chat-controls.yml
          git commit -m "Fix dead Agent Chat and navigation controls"
          git push origin HEAD:hotfix/agent-chat-dead-controls-20260728
