name: Phase 18 Branch Builder

on:
  push:
    branches:
      - feature/phase-18-supervised-action-orchestration
    paths:
      - .github/workflows/phase18-branch-builder.yml

permissions:
  contents: write

concurrency:
  group: phase18-branch-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Assemble permanent Phase 18 files
        shell: bash
        run: |
          cat scripts/.phase18-part-* | base64 -d | gzip -d > scripts/phase18-branch-builder.py
          python scripts/phase18-branch-builder.py
          cargo fmt --all
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate Phase 18 and retained contracts
        run: |
          python scripts/validate-supervised-orchestration.py
          python scripts/validate-wrapper-agents.py
          python scripts/validate-wrapper-runtime.py
          python scripts/validate-wrapper-privacy.py
          npm run check:frontend
          npm run build
      - name: Test and lint native service
        run: |
          cargo fmt --all -- --check
          cargo test -p microgifter-homeserver-service
          cargo test -p microgifter-homeserver-service --test phase18_supervised_orchestration_contract
          cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings
      - name: Commit verified Phase 18 implementation
        shell: bash
        run: |
          rm -f scripts/.phase18-part-* scripts/phase18-branch-builder.py .github/workflows/phase18-branch-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build Phase 18 supervised action orchestration"
          git push
