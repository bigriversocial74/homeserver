name: Phase 18 Branch Builder

on:
  push:
    branches:
      - feature/phase-18-supervised-action-orchestration
    paths:
      - .github/workflows/phase18-branch-builder.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase18-branch-builder.yml

permissions:
  contents: write

concurrency:
  group: phase18-branch-builder
  cancel-in-progress: false

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: feature/phase-18-supervised-action-orchestration
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Assemble permanent Phase 18 files
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import gzip
          import hashlib
          from pathlib import Path

          expected = {
              '.phase18-part-00': (12000, 'ba55f602a8876f4b46285029973e914656fb1620a64b39350220783ba954a56b'),
              '.phase18-part-01': (12000, '802861f6108e403eb53233971714f5b3a650b3684be858c589246f11ba60814d'),
              '.phase18-part-02': (12000, 'bd4fb349166bcdb794debc65a92cdf9048ac2938d35b194a43b16d8b1a8c6199'),
              '.phase18-part-03': (12000, '88dbb47541fc472b86f7a96b913b24fbf37ba792d03f0aad8c0916673e459112'),
              '.phase18-part-04a': (2900, 'dfff6497892bdecac1e4a2f3e6272b2245efb31d472096281216c6521dd24542'),
              '.phase18-part-04b': (2972, '8d03fc93ef3759004dc8b9e5205538f4f31a5f4364ae723e2acfd9d02f2136d4'),
          }
          root = Path('scripts')
          payload_parts = []
          for name, (expected_size, expected_sha) in expected.items():
              path = root / name
              data = path.read_bytes()
              actual_sha = hashlib.sha256(data).hexdigest()
              print(name, len(data), actual_sha)
              if len(data) != expected_size or actual_sha != expected_sha:
                  raise SystemExit(f'fragment integrity failure: {name}')
              payload_parts.append(data.decode('ascii'))
          encoded = ''.join(payload_parts)
          compressed = base64.b64decode(encoded, validate=True)
          builder = gzip.decompress(compressed)
          if hashlib.sha256(builder).hexdigest() != '7657c1875fe526e6be3d8ae947200304447bf1ff3f7828f9440b811f00a69535':
              raise SystemExit('decoded builder integrity failure')
          (root / 'phase18-branch-builder.py').write_bytes(builder)
          PY
          python scripts/phase18-branch-builder.py
          cargo fmt --all
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate Phase 18 and retained contracts
        run: |
          python scripts/validate-supervised-orchestration.py
          python scripts/validate-wrapper-agents.py
          python scripts/validate-wrapper-runtime.py
          python scripts/validate-wrapper-privacy.py
          npm run check:frontend
          npm run build
      - name: Test and lint native service
        run: |
          cargo fmt --all -- --check
          cargo test -p microgifter-homeserver-service
          cargo test -p microgifter-homeserver-service --test phase18_supervised_orchestration_contract
          cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings
      - name: Commit verified Phase 18 implementation
        shell: bash
        run: |
          rm -f scripts/.phase18-part-* scripts/.phase18-trigger scripts/phase18-branch-builder.py .github/workflows/phase18-branch-builder.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build Phase 18 supervised action orchestration"
          git push

# Integrity-verified payload trigger
