const MIGRATION: &str = include_str!("../../../database/migrations/0018_vp3_network_client.sql");
const MIGRATION_KEY: &str = "0018_vp3_network_client";
const CREDENTIAL_SERVICE: &str = "MicrogifterHomeServer";
const FINGERPRINT_CREDENTIAL_KEY: &str = "vp3-device-fingerprint-seed-v1";
const DEFAULT_API_BASE: &str = "https://vp3.me";
const MAX_JSON_BYTES: usize = 4 * 1024 * 1024;
const MAX_INSTALLER_BYTES: u64 = 1024 * 1024 * 1024;
const MIN_INSTALLER_BYTES: u64 = 1_000_000;
const HEARTBEAT_SECONDS: u64 = 5 * 60;
const LEASE_REFRESH_WINDOW_SECONDS: i64 = 15 * 60;

#[derive(Debug, Deserialize)]
