name: Phase 3A Merge Lock Canonicalize

on:
  push:
    branches:
      - feature/phase-3-backup-recovery-updates-20260724

permissions:
  contents: write

jobs:
  canonicalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: refs/pull/5/merge
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate merge-ref locks
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile
          Copy-Item Cargo.lock "$env:RUNNER_TEMP/Cargo.lock" -Force
          Copy-Item package-lock.json "$env:RUNNER_TEMP/package-lock.json" -Force

      - name: Apply canonical locks to feature branch
        shell: pwsh
        run: |
          git fetch origin feature/phase-3-backup-recovery-updates-20260724
          git checkout -B feature/phase-3-backup-recovery-updates-20260724 origin/feature/phase-3-backup-recovery-updates-20260724
          Copy-Item "$env:RUNNER_TEMP/Cargo.lock" Cargo.lock -Force
          Copy-Item "$env:RUNNER_TEMP/package-lock.json" package-lock.json -Force
          git rm .github/workflows/phase3a-merge-lock-canonicalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock package-lock.json .github/workflows/phase3a-merge-lock-canonicalize.yml
          git commit -m "Canonicalize merge-ref dependency locks"
          git push origin HEAD:feature/phase-3-backup-recovery-updates-20260724
