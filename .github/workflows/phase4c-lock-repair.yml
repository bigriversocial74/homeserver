name: Phase 4C Lockfile Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025
    steps:
      - name: Check out Phase 4C head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Install Rust lockfile toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 24
          cache: npm
      - name: Regenerate exact lockfiles
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          npm install --package-lock-only --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $unexpected = git diff --name-only | Where-Object { $_ -notin @('Cargo.lock','package-lock.json') }
          if ($unexpected) { throw "Unexpected generated changes: $($unexpected -join ', ')" }
          git rm .github/workflows/phase4c-lock-repair.yml
          git add Cargo.lock package-lock.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate lockfile for secure lopdf upgrade'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
