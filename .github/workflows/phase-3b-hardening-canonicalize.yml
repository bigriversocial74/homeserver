name: Phase 3B Hardening Canonicalizer

on:
  push:
    branches:
      - feature/phase-3b-signed-updates-20260724

permissions:
  contents: write

concurrency:
  group: phase3b-hardening-canonicalize
  cancel-in-progress: true

jobs:
  harden:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3b-signed-updates-20260724

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Apply release-key and result-ingestion hardening
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          update = Path('crates/homeserver-service/src/update.rs')
          text = update.read_text(encoding='utf-8')
          text = text.replace(
              'SignedUpdateManifest, UpdateApplicationPlan, UpdateApplicationResult, UpdateManifestPayload,\n    UpdateRecord, UpdateState, PRODUCT_NAME, UPDATE_KEY_ID, UPDATE_MANIFEST_SCHEMA_VERSION,',
              'SignedUpdateManifest, UpdateApplicationResult, UpdateManifestPayload, PRODUCT_NAME,\n    UPDATE_KEY_ID, UPDATE_MANIFEST_SCHEMA_VERSION,'
          )
          text = text.replace('    io::Read,\n', '')
          text = text.replace('const PINNED_UPDATE_PUBLIC_KEY_BASE64: &str =', 'const DEFAULT_PINNED_UPDATE_PUBLIC_KEY_BASE64: &str =')
          text = text.replace('const UPDATER_RESOURCE_NAME: &str = "microgifter-homeserver-updater.exe";\n', '')
          text = text.replace(
              '    verify_manifest_with_key(manifest, current_version, &public_key)\n',
              '    verify_manifest_with_key_id(\n        manifest,\n        current_version,\n        &public_key,\n        compiled_update_key_id(),\n    )\n'
          )
          text = text.replace(
              'fn verify_manifest_with_key(\n    manifest: &SignedUpdateManifest,\n    current_version: &str,\n    public_key: &VerifyingKey,\n) -> Result<VerifiedUpdate> {\n    ensure!(\n        manifest.key_id == UPDATE_KEY_ID,',
              'fn verify_manifest_with_key_id(\n    manifest: &SignedUpdateManifest,\n    current_version: &str,\n    public_key: &VerifyingKey,\n    expected_key_id: &str,\n) -> Result<VerifiedUpdate> {\n    ensure!(\n        manifest.key_id == expected_key_id,'
          )
          text = text.replace(
              '.decode(PINNED_UPDATE_PUBLIC_KEY_BASE64)',
              '.decode(compiled_update_public_key_base64())'
          )
          insert = '''\nfn compiled_update_key_id() -> &'static str {\n    option_env!("MG_HOMESERVER_RELEASE_KEY_ID").unwrap_or(UPDATE_KEY_ID)\n}\n\nfn compiled_update_public_key_base64() -> &'static str {\n    option_env!("MG_HOMESERVER_RELEASE_PUBLIC_KEY_BASE64")\n        .unwrap_or(DEFAULT_PINNED_UPDATE_PUBLIC_KEY_BASE64)\n}\n'''
          text = text.replace('\nfn decode_pinned_public_key() -> Result<VerifyingKey> {', insert + '\nfn decode_pinned_public_key() -> Result<VerifyingKey> {')
          text = re.sub(r'\nfn verify_file\(path: &Path, expected_size: u64, expected_sha256: &str\) -> Result<\(\)> \{.*?\n}\n\n#\[cfg\(windows\)\]', '\n\n#[cfg(windows)]', text, flags=re.S)
          text = text.replace('verify_manifest_with_key(&manifest, "0.1.0", &public_key)', 'verify_manifest_with_key_id(&manifest, "0.1.0", &public_key, UPDATE_KEY_ID)')
          update.write_text(text, encoding='utf-8')

          main = Path('crates/homeserver-service/src/main.rs')
          text = main.read_text(encoding='utf-8')
          anchor = '''    fn update_status(&self) -> Result<UpdateStatus> {\n        update_store::status('''
          replacement = '''    fn consume_update_result_if_present(&self) -> Result<()> {\n        let connection = self.connection()?;\n        if let Some(result) = update::consume_application_result(&self.config)? {\n            update_store::record_application_result(&connection, &result)?;\n            info!(\n                update_id = %result.update_id,\n                state = %result.state.as_str(),\n                "HomeServer updater result consumed"\n            );\n        }\n        Ok(())\n    }\n\n    fn update_status(&self) -> Result<UpdateStatus> {\n        self.consume_update_result_if_present()?;\n        update_store::status('''
          if anchor not in text:
              raise SystemExit('update_status anchor not found')
          text = text.replace(anchor, replacement, 1)
          main.write_text(text, encoding='utf-8')

          app = Path('crates/homeserver-service/src/app.rs')
          text = app.read_text(encoding='utf-8')
          text = text.replace(
              '    let start = tokio::time::Instant::now() + Duration::from_secs(5 * 60);\n    let mut interval = tokio::time::interval_at(start, Duration::from_secs(6 * 60 * 60));',
              '    let check_start = tokio::time::Instant::now() + Duration::from_secs(5 * 60);\n    let mut check_interval =\n        tokio::time::interval_at(check_start, Duration::from_secs(6 * 60 * 60));\n    let result_start = tokio::time::Instant::now() + Duration::from_secs(10);\n    let mut result_interval =\n        tokio::time::interval_at(result_start, Duration::from_secs(15));'
          )
          text = text.replace(
              '            _ = interval.tick() => {\n                if let Err(error) = state.check_for_updates().await {',
              '            _ = check_interval.tick() => {\n                if let Err(error) = state.check_for_updates().await {'
          )
          marker = '''            changed = shutdown.changed() => {'''
          result_arm = '''            _ = result_interval.tick() => {\n                if let Err(error) = state.consume_update_result_if_present() {\n                    warn!(?error, "unable to consume HomeServer updater result");\n                }\n            }\n'''
          update_scheduler_start = text.index('async fn run_update_scheduler')
          marker_pos = text.index(marker, update_scheduler_start)
          text = text[:marker_pos] + result_arm + text[marker_pos:]
          app.write_text(text, encoding='utf-8')

          js = Path('src/main.js')
          text = js.read_text(encoding='utf-8')
          text = text.replace(
              '    notice = { kind: "success", message: result.message };',
              '    notice = { kind: "success", message: result.message };\n    window.setTimeout(() => loadAll(false), 15000);'
          )
          js.write_text(text, encoding='utf-8')
          '@ | Set-Content phase3b_harden.py -Encoding UTF8
          python phase3b_harden.py
          Remove-Item phase3b_harden.py
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile
          cargo fmt --all
          git diff --check

      - name: Commit canonical hardening and remove helper
        shell: pwsh
        run: |
          git rm .github/workflows/phase-3b-hardening-canonicalize.yml
          git add Cargo.lock package-lock.json crates/homeserver-service/src/update.rs crates/homeserver-service/src/main.rs crates/homeserver-service/src/app.rs src/main.js
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          git commit -m "Harden signed update key injection and result ingestion"
          git push origin HEAD:feature/phase-3b-signed-updates-20260724
