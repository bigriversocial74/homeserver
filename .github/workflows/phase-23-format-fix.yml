name: Phase 23 One-Time Format Fix

on:
  push:
    branches:
      - feature/phase-23-agent-chat-ears-conversation-engine

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-23-agent-chat-ears-conversation-engine
          fetch-depth: 0
      - name: Install canonical Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Format and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git rm --force .github/workflows/phase-23-format-fix.yml
          if git diff --cached --quiet && git diff --quiet; then
            echo "No formatting changes were required."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-service/src/audio_runtime.rs
          git commit -m "Apply canonical Phase 23 Rust formatting"
          git push origin HEAD:feature/phase-23-agent-chat-ears-conversation-engine
