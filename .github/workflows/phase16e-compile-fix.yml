name: Phase 16E Compile Fix

on:
  push:
    branches:
      - feature/phase-16e-private-knowledge-egress
    paths:
      - .github/workflows/phase16e-compile-fix.yml

permissions:
  contents: write

concurrency:
  group: homeserver-phase16e-compile-fix
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-16e-private-knowledge-egress
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Apply exact Phase 16E compile repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/homeserver-service/src/app/wrapper_privacy.rs')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (".replace('-', '_')", ".replace('-', \"_\")"),
              ("                out.insert(key.clone(), child.value)\n", "                out.insert(key.clone(), child.value);\n"),
              ('''fn read_data_classes(c: &Connection) -> Result<Vec<DataClassSummary>> {
              let mut s=c.prepare("SELECT class_key,description,sensitivity_tier,wrapper_egress_mode,default_retention_days,state FROM data_classification_catalog ORDER BY class_key")?;
              s.query_map([], |r| {
                  let d: i64 = r.get(4)?;
                  Ok(DataClassSummary {
                      class_key: r.get(0)?,
                      description: r.get(1)?,
                      sensitivity_tier: r.get(2)?,
                      wrapper_egress_mode: r.get(3)?,
                      default_retention_days: d.max(0) as u32,
                      state: r.get(5)?,
                  })
              })?
              .collect::<rusqlite::Result<Vec<_>>>()
              .map_err(Into::into)
          }''', '''fn read_data_classes(c: &Connection) -> Result<Vec<DataClassSummary>> {
              let mut s=c.prepare("SELECT class_key,description,sensitivity_tier,wrapper_egress_mode,default_retention_days,state FROM data_classification_catalog ORDER BY class_key")?;
              let rows = s
                  .query_map([], |r| {
                      let d: i64 = r.get(4)?;
                      Ok(DataClassSummary {
                          class_key: r.get(0)?,
                          description: r.get(1)?,
                          sensitivity_tier: r.get(2)?,
                          wrapper_egress_mode: r.get(3)?,
                          default_retention_days: d.max(0) as u32,
                          state: r.get(5)?,
                      })
                  })?
                  .collect::<rusqlite::Result<Vec<_>>>()?;
              Ok(rows)
          }'''),
              ('''fn read_resources(c: &Connection) -> Result<Vec<PrivateResourceSummary>> {
              let mut s=c.prepare("SELECT r.resource_id,r.resource_namespace,r.resource_type,r.local_source_id,r.local_display_name,r.source_hash,r.state,r.resource_revision,c.class_key,c.classification_revision,r.updated_at_utc FROM private_resource_catalog r JOIN private_resource_classifications c ON c.resource_id=r.resource_id AND c.state='active' ORDER BY r.updated_at_utc DESC,r.resource_id LIMIT 500")?;
              s.query_map([], |r| {
                  let rr: i64 = r.get(7)?;
                  let cr: i64 = r.get(9)?;
                  Ok(PrivateResourceSummary {
                      resource_id: r.get(0)?,
                      resource_namespace: r.get(1)?,
                      resource_type: r.get(2)?,
                      local_source_id: r.get(3)?,
                      local_display_name: r.get(4)?,
                      source_hash: r.get(5)?,
                      state: r.get(6)?,
                      resource_revision: rr.max(0) as u64,
                      class_key: r.get(8)?,
                      classification_revision: cr.max(0) as u64,
                      updated_at_utc: r.get(10)?,
                  })
              })?
              .collect::<rusqlite::Result<Vec<_>>>()
              .map_err(Into::into)
          }''', '''fn read_resources(c: &Connection) -> Result<Vec<PrivateResourceSummary>> {
              let mut s=c.prepare("SELECT r.resource_id,r.resource_namespace,r.resource_type,r.local_source_id,r.local_display_name,r.source_hash,r.state,r.resource_revision,c.class_key,c.classification_revision,r.updated_at_utc FROM private_resource_catalog r JOIN private_resource_classifications c ON c.resource_id=r.resource_id AND c.state='active' ORDER BY r.updated_at_utc DESC,r.resource_id LIMIT 500")?;
              let rows = s
                  .query_map([], |r| {
                      let rr: i64 = r.get(7)?;
                      let cr: i64 = r.get(9)?;
                      Ok(PrivateResourceSummary {
                          resource_id: r.get(0)?,
                          resource_namespace: r.get(1)?,
                          resource_type: r.get(2)?,
                          local_source_id: r.get(3)?,
                          local_display_name: r.get(4)?,
                          source_hash: r.get(5)?,
                          state: r.get(6)?,
                          resource_revision: rr.max(0) as u64,
                          class_key: r.get(8)?,
                          classification_revision: cr.max(0) as u64,
                          updated_at_utc: r.get(10)?,
                      })
                  })?
                  .collect::<rusqlite::Result<Vec<_>>>()?;
              Ok(rows)
          }'''),
              ('''fn selector_resource_ids(c: &Connection, selector: &str) -> Result<Vec<String>> {
              let mut s=c.prepare("SELECT resource_id FROM private_selector_resources WHERE selector_id=?1 ORDER BY resource_id")?;
              s.query_map(params![selector], |r| r.get(0))?
                  .collect::<rusqlite::Result<Vec<_>>>()
                  .map_err(Into::into)
          }''', '''fn selector_resource_ids(c: &Connection, selector: &str) -> Result<Vec<String>> {
              let mut s=c.prepare("SELECT resource_id FROM private_selector_resources WHERE selector_id=?1 ORDER BY resource_id")?;
              let rows = s
                  .query_map(params![selector], |r| r.get(0))?
                  .collect::<rusqlite::Result<Vec<_>>>()?;
              Ok(rows)
          }'''),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one compile-fix match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          python scripts/validate-wrapper-privacy.py
      - name: Commit Phase 16E compile repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/homeserver-service/src/app/wrapper_privacy.rs
          git diff --cached --check
          git commit -m 'Fix Phase 16E privacy runtime compilation'
          git push origin HEAD:feature/phase-16e-private-knowledge-egress
