name: Phase 23C Whisper Error Probe

on:
  pull_request:
    paths:
      - "src-tauri/src/whisper.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "src-tauri/Cargo.toml"
      - ".github/workflows/phase23c-whisper-errors.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase23c-whisper-error-probe-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact Phase 23C candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install native desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake clang libclang-dev \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Configure stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Configure Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Prepare desktop resources
        run: |
          npm ci
          npm run prepare:icons

      - name: Capture focused native diagnostics
        shell: bash
        run: |
          set +e
          cargo test -p microgifter-homeserver-control-center whisper::tests --no-run > phase23c-whisper-full.log 2>&1
          status=$?
          echo "$status" > phase23c-whisper-exit.txt
          python - <<'PY'
          from pathlib import Path
          lines = Path('phase23c-whisper-full.log').read_text(encoding='utf-8', errors='replace').splitlines()
          selected = []
          for i, line in enumerate(lines):
              low = line.lower()
              if (
                  'src-tauri/src/whisper.rs' in line
                  or low.startswith('error:')
                  or 'error[' in low
                  or 'could not compile' in low
                  or 'aborting due to' in low
              ):
                  selected.extend(lines[max(0, i - 6):min(len(lines), i + 18)])
          compact = []
          for line in selected:
              if not compact or compact[-1] != line:
                  compact.append(line)
          if not compact:
              compact = lines[-240:]
          Path('phase23c-whisper-errors.txt').write_text(
              '\n'.join(compact[-700:]) + '\n', encoding='utf-8'
          )
          PY
          exit 0

      - name: Upload compact compiler report
        uses: actions/upload-artifact@v4
        with:
          name: phase23c-whisper-errors
          path: |
            phase23c-whisper-errors.txt
            phase23c-whisper-exit.txt
          if-no-files-found: error
          retention-days: 1
