name: Phase 23C Whisper Error Probe

on:
  push:
    branches:
      - feature/phase-23c-local-whisper-transcription
    paths:
      - .github/workflows/phase23c-whisper-errors.yml

permissions:
  contents: write

concurrency:
  group: phase23c-whisper-error-probe
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out exact Phase 23C branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-23c-local-whisper-transcription
          fetch-depth: 0

      - name: Install native desktop prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake clang libclang-dev \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Configure stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Configure Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Prepare desktop resources
        run: |
          npm ci
          npm run prepare:icons

      - name: Capture focused native diagnostics
        shell: bash
        run: |
          set +e
          cargo test -p microgifter-homeserver-control-center whisper::tests --no-run > phase23c-whisper-full.log 2>&1
          status=$?
          echo "$status" > phase23c-whisper-exit.txt
          python - <<'PY'
          from pathlib import Path
          lines = Path('phase23c-whisper-full.log').read_text(encoding='utf-8', errors='replace').splitlines()
          selected = []
          for i, line in enumerate(lines):
              low = line.lower()
              if (
                  'src-tauri/src/whisper.rs' in line
                  or low.startswith('error:')
                  or 'error[' in low
                  or 'could not compile' in low
                  or 'aborting due to' in low
              ):
                  selected.extend(lines[max(0, i - 6):min(len(lines), i + 18)])
          compact = []
          for line in selected:
              if not compact or compact[-1] != line:
                  compact.append(line)
          if not compact:
              compact = lines[-240:]
          Path('phase23c-whisper-errors.txt').write_text(
              '\n'.join(compact[-700:]) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit diagnostics and remove probe
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase23c-whisper-errors.yml
          git add phase23c-whisper-errors.txt phase23c-whisper-exit.txt
          git diff --cached --check
          git commit -m "Capture focused Phase 23C Whisper compiler errors"
          git push origin HEAD:feature/phase-23c-local-whisper-transcription
