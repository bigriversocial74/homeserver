name: HomeServer Updater Rollback Diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/updater-rollback-diagnostic.yml'
      - 'scripts/smoke-test-updater.ps1'
      - 'crates/homeserver-updater/src/main.rs'
      - 'crates/homeserver-service/src/**'
      - 'src-tauri/windows/hooks.nsh'

permissions:
  contents: read

concurrency:
  group: homeserver-updater-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.head_ref == 'audit/full-production-hardening-20260725'
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-updater-diagnostic-${{ hashFiles('Cargo.toml', '**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: windows-updater-diagnostic-

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Resolve release version
        id: release
        shell: pwsh
        run: |
          $cargo = Get-Content Cargo.toml -Raw
          $match = [regex]::Match($cargo, '(?ms)\[workspace\.package\].*?^version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw "Unable to resolve workspace release version" }
          "version=$($match.Groups[1].Value)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Build diagnostic installer
        shell: pwsh
        run: |
          npm ci
          npm run prepare:icons
          cargo build --release --package microgifter-homeserver-service --locked
          cargo build --release --package microgifter-homeserver-updater --locked
          Copy-Item target/release/microgifter-homeserver-service.exe src-tauri/resources/microgifter-homeserver-service.exe -Force
          Copy-Item target/release/microgifter-homeserver-updater.exe src-tauri/resources/microgifter-homeserver-updater.exe -Force
          npm run tauri:build *> diagnostic-tauri-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content diagnostic-tauri-build.log -Tail 240; exit $LASTEXITCODE }
          $bundle = 'target/release/bundle/nsis'
          $installer = Get-ChildItem $bundle -Filter '*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer was not produced' }
          Copy-Item $installer.FullName "$bundle/Microgifter-HomeServer-v${{ steps.release.outputs.version }}-Setup.exe" -Force

      - name: Create trusted diagnostic update package
        id: sign_update
        shell: pwsh
        run: |
          $bundle = 'target/release/bundle/nsis'
          $source = "$bundle/Microgifter-HomeServer-v${{ steps.release.outputs.version }}-Setup.exe"
          $signed = "$bundle/Microgifter-HomeServer-Update-Diagnostic.exe"
          Copy-Item $source $signed -Force
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=Microgifter Updater Diagnostic' -CertStoreLocation 'Cert:\CurrentUser\My' -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -KeyExportPolicy Exportable -NotAfter (Get-Date).AddDays(2)
          Export-Certificate -Cert $cert -FilePath "$bundle/Microgifter-Updater-Diagnostic.cer" | Out-Null
          Import-Certificate -FilePath "$bundle/Microgifter-Updater-Diagnostic.cer" -CertStoreLocation 'Cert:\LocalMachine\Root' | Out-Null
          Import-Certificate -FilePath "$bundle/Microgifter-Updater-Diagnostic.cer" -CertStoreLocation 'Cert:\LocalMachine\TrustedPublisher' | Out-Null
          $signature = Set-AuthenticodeSignature -FilePath $signed -Certificate $cert -HashAlgorithm SHA256
          if ($signature.Status -ne 'Valid') { throw "Unable to sign diagnostic update: $($signature.StatusMessage)" }
          $cert.Thumbprint | Set-Content updater-diagnostic-thumbprint.txt -NoNewline
          "thumbprint=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Create diagnostic updater harness
        shell: pwsh
        run: |
          $source = Get-Content scripts/smoke-test-updater.ps1 -Raw
          $needle = '    Write-Host "Service query:`n$serviceQuery"'
          if (($source.Split($needle).Count - 1) -ne 1) { throw 'Unable to locate updater failure diagnostic insertion point' }
          $diagnostic = @'

    $evidenceRoot = Join-Path $env:RUNNER_TEMP "homeserver-updater-diagnostic"
    New-Item -ItemType Directory -Force $evidenceRoot | Out-Null
    Write-Host "Updater diagnostic evidence root: $evidenceRoot"

    function Save-DiagnosticText {
        param([string]$Name, [scriptblock]$Command)
        $path = Join-Path $evidenceRoot $Name
        try {
            $value = & $Command 2>&1 | Out-String
        }
        catch {
            $value = $_ | Out-String
        }
        $value | Set-Content -LiteralPath $path -Encoding UTF8
        Write-Host "--- $Name ---`n$value"
    }

    Save-DiagnosticText "service-qc.txt" { & "$env:SystemRoot\System32\sc.exe" qc $serviceName }
    Save-DiagnosticText "service-queryex.txt" { & "$env:SystemRoot\System32\sc.exe" queryex $serviceName }
    Save-DiagnosticText "service-qfailure.txt" { & "$env:SystemRoot\System32\sc.exe" qfailure $serviceName }
    Save-DiagnosticText "service-qfailureflag.txt" { & "$env:SystemRoot\System32\sc.exe" qfailureflag $serviceName }
    Save-DiagnosticText "service-qsidtype.txt" { & "$env:SystemRoot\System32\sc.exe" qsidtype $serviceName }
    Save-DiagnosticText "service-cim.txt" { Get-CimInstance Win32_Service -Filter "Name='$serviceName'" | Format-List * }
    Save-DiagnosticText "service-registry.txt" { Get-ItemProperty -LiteralPath "HKLM:\SYSTEM\CurrentControlSet\Services\$serviceName" | Format-List * }
    Save-DiagnosticText "install-tree.txt" { Get-ChildItem -LiteralPath $installDirectory -Recurse -Force | Select-Object FullName, Length, LastWriteTimeUtc | Format-Table -AutoSize }
    Save-DiagnosticText "data-tree.txt" { Get-ChildItem -LiteralPath $dataDirectory -Recurse -Force | Select-Object FullName, Length, LastWriteTimeUtc | Format-Table -AutoSize }

    $serviceBinary = Join-Path $installDirectory "resources\microgifter-homeserver-service.exe"
    Save-DiagnosticText "service-binary.txt" {
        if (Test-Path -LiteralPath $serviceBinary) {
            Get-Item -LiteralPath $serviceBinary | Select-Object FullName, Length, LastWriteTimeUtc, VersionInfo | Format-List
            Get-FileHash -Algorithm SHA256 -LiteralPath $serviceBinary | Format-List
            & $serviceBinary --version
        } else {
            "Service binary is missing: $serviceBinary"
        }
    }

    $since = (Get-Date).AddMinutes(-20)
    Save-DiagnosticText "system-service-events.txt" {
        Get-WinEvent -FilterHashtable @{ LogName = 'System'; StartTime = $since; ProviderName = 'Service Control Manager' } -ErrorAction SilentlyContinue |
            Select-Object TimeCreated, Id, LevelDisplayName, ProviderName, Message | Format-List
    }
    Save-DiagnosticText "application-events.txt" {
        Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = $since } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'Microgifter|HomeServer|microgifter-homeserver-service' -or $_.ProviderName -match 'Application Error|Windows Error Reporting' } |
            Select-Object TimeCreated, Id, LevelDisplayName, ProviderName, Message | Format-List
    }

    $logsDirectory = Join-Path $dataDirectory "logs"
    if (Test-Path -LiteralPath $logsDirectory) {
        foreach ($logFile in Get-ChildItem -LiteralPath $logsDirectory -File -ErrorAction SilentlyContinue) {
            Copy-Item -LiteralPath $logFile.FullName -Destination (Join-Path $evidenceRoot $logFile.Name) -Force -ErrorAction SilentlyContinue
            Save-DiagnosticText ("tail-" + $logFile.Name + ".txt") { Get-Content -LiteralPath $logFile.FullName -Tail 300 }
        }
    }

    if (Test-Path -LiteralPath $serviceBinary) {
        $probeRoot = Join-Path $env:SystemRoot "Temp\Microgifter-HomeServer-Direct-Probe"
        New-Item -ItemType Directory -Force $probeRoot | Out-Null
        $probeScript = Join-Path $probeRoot "run-console-probe.ps1"
        $probeMarker = Join-Path $probeRoot "complete.json"
        $probeStdout = Join-Path $probeRoot "console.stdout.log"
        $probeStderr = Join-Path $probeRoot "console.stderr.log"
        $probeHealth = Join-Path $probeRoot "health.txt"
        $probePid = Join-Path $probeRoot "pid.txt"
        $binaryLiteral = $serviceBinary.Replace("'", "''")
        $stdoutLiteral = $probeStdout.Replace("'", "''")
        $stderrLiteral = $probeStderr.Replace("'", "''")
        $healthLiteral = $probeHealth.Replace("'", "''")
        $pidLiteral = $probePid.Replace("'", "''")
        $markerLiteral = $probeMarker.Replace("'", "''")
        @"
`$ErrorActionPreference = 'Continue'
`$result = [ordered]@{ started = `$false; exited = `$null; exit_code = `$null; error = `$null }
try {
    `$process = Start-Process -FilePath '$binaryLiteral' -ArgumentList 'console' -RedirectStandardOutput '$stdoutLiteral' -RedirectStandardError '$stderrLiteral' -PassThru
    `$result.started = `$true
    `$process.Id | Set-Content -LiteralPath '$pidLiteral'
    Start-Sleep -Seconds 15
    try {
        Invoke-WebRequest -UseBasicParsing -Uri 'http://127.0.0.1:47831/healthz' -TimeoutSec 3 | Out-String | Set-Content -LiteralPath '$healthLiteral'
    } catch {
        (`$_ | Out-String) | Set-Content -LiteralPath '$healthLiteral'
    }
    `$process.Refresh()
    `$result.exited = `$process.HasExited
    if (`$process.HasExited) { `$result.exit_code = `$process.ExitCode } else { Stop-Process -Id `$process.Id -Force -ErrorAction SilentlyContinue }
} catch {
    `$result.error = `$_ | Out-String
}
`$result | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath '$markerLiteral' -Encoding UTF8
"@ | Set-Content -LiteralPath $probeScript -Encoding UTF8

        $taskName = "MicrogifterHomeServerDirectProbe-$([guid]::NewGuid().ToString('N'))"
        $taskTime = (Get-Date).AddMinutes(1).ToString("HH:mm")
        $powershell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
        $taskCommand = "`"$powershell`" -NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$probeScript`""
        try {
            & "$env:SystemRoot\System32\schtasks.exe" /Create /TN $taskName /TR $taskCommand /SC ONCE /ST $taskTime /RU SYSTEM /RL HIGHEST /F | Out-Null
            & "$env:SystemRoot\System32\schtasks.exe" /Run /TN $taskName | Out-Null
            for ($attempt = 0; $attempt -lt 120 -and -not (Test-Path -LiteralPath $probeMarker); $attempt++) { Start-Sleep -Milliseconds 500 }
            foreach ($probeFile in @($probeMarker, $probeStdout, $probeStderr, $probeHealth, $probePid)) {
                if (Test-Path -LiteralPath $probeFile) { Copy-Item -LiteralPath $probeFile -Destination $evidenceRoot -Force }
            }
            Save-DiagnosticText "direct-console-probe.txt" {
                if (Test-Path -LiteralPath $probeMarker) { Get-Content -LiteralPath $probeMarker -Raw }
                if (Test-Path -LiteralPath $probeHealth) { "HEALTH:`n"; Get-Content -LiteralPath $probeHealth -Raw }
                if (Test-Path -LiteralPath $probeStdout) { "STDOUT:`n"; Get-Content -LiteralPath $probeStdout -Raw }
                if (Test-Path -LiteralPath $probeStderr) { "STDERR:`n"; Get-Content -LiteralPath $probeStderr -Raw }
            }
        }
        finally {
            & "$env:SystemRoot\System32\schtasks.exe" /Delete /TN $taskName /F 2>$null | Out-Null
        }
    }
'@
          $source = $source.Replace($needle, $needle + $diagnostic)
          Set-Content -LiteralPath diagnostic-smoke-test-updater.ps1 -Value $source -Encoding UTF8
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path diagnostic-smoke-test-updater.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List | Out-String | Write-Host; throw 'Diagnostic updater harness has syntax errors' }

      - name: Reproduce rollback failure and capture evidence
        id: diagnostic
        continue-on-error: true
        shell: pwsh
        run: |
          Import-Module Microsoft.PowerShell.Security -Force
          $env:PSModulePath = @(
            (Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\Modules')
            (Join-Path $env:ProgramFiles 'WindowsPowerShell\Modules')
          ) -join [System.IO.Path]::PathSeparator
          & pwsh -NoLogo -NoProfile -NonInteractive `
            -File ./diagnostic-smoke-test-updater.ps1 `
            -InstallerPath target/release/bundle/nsis/Microgifter-HomeServer-v${{ steps.release.outputs.version }}-Setup.exe `
            -UpdateInstallerPath target/release/bundle/nsis/Microgifter-HomeServer-Update-Diagnostic.exe `
            -SignerThumbprint '${{ steps.sign_update.outputs.thumbprint }}' `
            -ExpectedVersion '${{ steps.release.outputs.version }}' *> updater-rollback-diagnostic.log
          $code = $LASTEXITCODE
          Get-Content updater-rollback-diagnostic.log -Tail 500
          exit $code

      - name: Remove diagnostic trust material
        if: always()
        shell: pwsh
        run: |
          if (Test-Path updater-diagnostic-thumbprint.txt) {
            $thumbprint = (Get-Content updater-diagnostic-thumbprint.txt -Raw).Trim()
            Remove-Item "Cert:\CurrentUser\My\$thumbprint" -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\LocalMachine\Root\$thumbprint" -Force -ErrorAction SilentlyContinue
            Remove-Item "Cert:\LocalMachine\TrustedPublisher\$thumbprint" -Force -ErrorAction SilentlyContinue
          }

      - name: Upload updater rollback diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: updater-rollback-diagnostics
          path: |
            updater-rollback-diagnostic.log
            diagnostic-tauri-build.log
            ${{ runner.temp }}/homeserver-updater-diagnostic
          if-no-files-found: warn
          retention-days: 7

      - name: Report diagnostic outcome
        if: always()
        shell: pwsh
        run: |
          if ('${{ steps.diagnostic.outcome }}' -eq 'success') {
            Write-Host 'The focused updater rollback diagnostic passed unexpectedly.'
          } else {
            Write-Host 'The rollback failure was reproduced and diagnostic evidence was uploaded.'
          }
