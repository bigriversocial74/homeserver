name: Repair Agent Chat navigation entry

on:
  push:
    branches:
      - hotfix/agent-chat-dead-controls-20260728

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hotfix/agent-chat-dead-controls-20260728
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Persist the Agent Chat sidebar entry
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path("src/homeserver-agent-chat.js")
          text = path.read_text(encoding="utf-8")
          old = "\n".join([
              "function delegatedAgentClick(event) {",
              "  if (!isAgentPage() || !(event.target instanceof Element)) return;",
              "  const control = event.target.closest(\"button,[data-chat-thread],[data-chat-suggestion],[data-close-provider],[data-close-connect],[data-provider-action]\");",
          ])
          new = "\n".join([
              "function delegatedAgentClick(event) {",
              "  if (!(event.target instanceof Element)) return;",
              "  const navigation = event.target.closest('[data-homeserver-chat-nav=\"true\"]');",
              "  if (navigation) {",
              "    event.preventDefault();",
              "    event.stopImmediatePropagation();",
              "    window.location.hash = `#${PAGE_KEY}`;",
              "    window.setTimeout(() => mount(true), 0);",
              "    return;",
              "  }",
              "  if (!isAgentPage()) return;",
              "  const control = event.target.closest(\"button,[data-chat-thread],[data-chat-suggestion],[data-close-provider],[data-close-connect],[data-provider-action]\");",
          ])
          if old not in text:
              if "const navigation = event.target.closest" not in text:
                  raise SystemExit("Delegated Agent Chat click anchor not found")
          else:
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          '@ | python -

      - name: Validate navigation interaction
        shell: pwsh
        run: |
          node --check src/homeserver-agent-chat.js
          npm ci
          npm run check:frontend
          npm run build
          Select-String -Path src/homeserver-agent-chat.js -Pattern 'data-homeserver-chat-nav' -Quiet | Out-Null

      - name: Commit repair and remove helper
        shell: pwsh
        run: |
          Remove-Item .github/workflows/hotfix-agent-chat-nav-entry.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/homeserver-agent-chat.js .github/workflows/hotfix-agent-chat-nav-entry.yml
          git commit -m "Keep Agent Chat sidebar navigation responsive"
          git push origin HEAD:hotfix/agent-chat-dead-controls-20260728
