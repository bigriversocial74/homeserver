name: Phase 23C Atomic Replacement Hardening

on:
  pull_request:
    paths:
      - "scripts/apply-phase23c-atomic-hardening.py"
      - ".github/workflows/phase23c-atomic-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase23c-atomic-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    runs-on: windows-2025
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out exact Phase 23C branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-23c-local-whisper-transcription
          fetch-depth: 0

      - name: Configure stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Normalize rustfmt-only patch anchors
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path('src-tauri/src/whisper.rs')
          text = path.read_text(encoding='utf-8')

          manifest_pattern = re.compile(
              r"    if fs::try_exists\(&path\)\s*"
              r"\.await\s*"
              r"\.map_err\(\|error\| error\.to_string\(\)\)\?\s*\{"
          )
          manifest_replacement = (
              "    if fs::try_exists(&path).await.map_err(|error| error.to_string())? {"
          )
          text, manifest_count = manifest_pattern.subn(
              manifest_replacement, text, count=1
          )
          if manifest_count != 1:
              raise SystemExit(
                  f'Expected one manifest formatting anchor, found {manifest_count}'
              )

          compact_test = '''    #[test]
              fn validates_language_boundary() {
                  assert_eq!(validate_language(Some("AUTO".to_owned())).unwrap(), "auto");
                  assert_eq!(validate_language(None).unwrap(), "en");
                  assert!(validate_language(Some("en<script>".to_owned())).is_err());
              }
          }'''
          canonical_test = '''    #[test]
              fn validates_language_boundary() {
                  assert_eq!(
                      validate_language(Some("AUTO".to_owned())).unwrap(),
                      "auto"
                  );
                  assert_eq!(validate_language(None).unwrap(), "en");
                  assert!(validate_language(Some("en<script>".to_owned())).is_err());
              }
          }'''
          if compact_test not in text:
              raise SystemExit('Expected one compact native test anchor, found 0')
          text = text.replace(compact_test, canonical_test, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply permanent atomic hardening
        run: python scripts/apply-phase23c-atomic-hardening.py

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Remove one-time hardening assets
        run: |
          git rm scripts/apply-phase23c-atomic-hardening.py
          git rm .github/workflows/phase23c-atomic-hardening.yml

      - name: Commit hardened candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/whisper.rs scripts/validate-agent-whisper.py .github/workflows
          git diff --cached --check
          git commit -m "Harden Phase 23C atomic model replacement"
          git push origin HEAD:feature/phase-23c-local-whisper-transcription
