name: Phase 14 Rustfmt Repair

on:
  push:
    branches:
      - feature/phase-14-vp3-activation-control-center

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-14-vp3-activation-control-center
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply canonical formatting
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs src-tauri/src/vp3_authority.rs
          git commit -m "Apply Phase 14 canonical Rust formatting"
          git push origin HEAD:feature/phase-14-vp3-activation-control-center
