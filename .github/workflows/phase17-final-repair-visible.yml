name: Phase 17 Final Repair Visible

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 57 && github.event.pull_request.head.ref == 'feature/phase-17-authorized-agent-tool-runtime'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-17-authorized-agent-tool-runtime
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - name: Apply and certify final repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          source = Path('.github/workflows/phase17-final-repair-once.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "          PY\n          cargo fmt --all\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          Path('phase17-final-repair.py').write_text(dedent(source[start:end]), encoding='utf-8')
          PY
          python phase17-final-repair.py
          rm phase17-final-repair.py
          cargo fmt --all
          node --check src/agent-runtime-control-center.js
          python scripts/validate-wrapper-runtime.py
          cargo test -p microgifter-homeserver-service
          cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase17-final-repair-once.yml
          git rm .github/workflows/phase17-final-repair-windows.yml
          git rm .github/workflows/phase17-final-repair-visible.yml
          git add -A
          git commit -m "Repair Phase 17 strict lint and cancellation identity"
          git push origin HEAD:feature/phase-17-authorized-agent-tool-runtime
