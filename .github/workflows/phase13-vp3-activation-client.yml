name: Phase 13 VP3 Activation Client
# Exact-head certification for the VP3 software-authority cutover.

on:
  push:
    branches:
      - feature/vp3-activation-update-client-v1-20260729
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase13-homeserver-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  repair-device-binding:
    if: github.event_name == 'pull_request' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/vp3-activation-update-client-v1-20260729
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Bind activation to the persistent local installation identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/homeserver-service/src/vp3_client.rs')
          source = path.read_text()

          source = source.replace(
              'use crate::{software_authority, update, update_store, AppState};',
              'use crate::{database, software_authority, update, update_store, AppState};',
              1,
          )
          source = source.replace(
              '    pub device_public_id: Option<String>,\n',
              '    pub device_public_id: Option<String>,\n    pub device_fingerprint: String,\n',
              1,
          )
          request_start = source.index('pub struct ActivateVp3Request')
          request_end = source.index('\n}', request_start)
          request_block = source[request_start:request_end]
          request_block = request_block.replace('    device_fingerprint: String,\n', '', 1)
          source = source[:request_start] + request_block + source[request_end:]
          source = source.replace(
              '    let authority = software_authority::status_snapshot(&connection)?;\n',
              '    let authority = software_authority::status_snapshot(&connection)?;\n    let device_fingerprint = local_device_fingerprint_from_connection(&connection)?;\n',
              1,
          )
          source = source.replace(
              '                device_public_id: row.get(1)?,\n',
              '                device_public_id: row.get(1)?,\n                device_fingerprint: device_fingerprint.clone(),\n',
              1,
          )
          source = source.replace(
              '''    ensure!(
                  valid_sha256(&request.device_fingerprint),
                  "VP3 device fingerprint must be a SHA-256 value"
              );
''',
              '',
              1,
          )
          source = source.replace(
              '    configured_verifying_key(\n',
              '    let device_fingerprint = local_device_fingerprint(state)?;\n    configured_verifying_key(\n',
              1,
          )
          source = source.replace(
              '                request.device_fingerprint.to_lowercase(),\n',
              '                device_fingerprint.as_str(),\n',
              1,
          )
          source = source.replace(
              '        &request.device_fingerprint,\n',
              '        &device_fingerprint,\n',
              1,
          )

          marker = 'fn identity(state: &AppState) -> Result<ClientIdentity> {\n'
          helper = '''fn local_device_fingerprint(state: &AppState) -> Result<String> {
              let connection = state.connection()?;
              local_device_fingerprint_from_connection(&connection)
          }

          fn local_device_fingerprint_from_connection(connection: &Connection) -> Result<String> {
              let installation_id = database::installation_id(connection)?;
              let installation_id = installation_id.trim();
              ensure!(
                  !installation_id.is_empty(),
                  "HomeServer installation identity is unavailable"
              );
              Ok(hex::encode(Sha256::digest(
                  format!("MicrogifterHomeServer:vp3-device:{installation_id}").as_bytes(),
              )))
          }

          '''
          if helper not in source:
              source = source.replace(marker, helper + marker, 1)

          checks = [
              'use crate::{database, software_authority, update, update_store, AppState};',
              'pub device_fingerprint: String',
              'local_device_fingerprint_from_connection',
              'MicrogifterHomeServer:vp3-device:',
              'device_fingerprint.as_str()',
          ]
          for check in checks:
              if check not in source:
                  raise SystemExit(f'missing expected device-binding code: {check}')
          request_start = source.index('pub struct ActivateVp3Request')
          request_end = source.index('\n}', request_start)
          if 'device_fingerprint' in source[request_start:request_end]:
              raise SystemExit('activation request still accepts a caller-provided fingerprint')

          path.write_text(source)
          PY
          cargo fmt --all
      - name: Commit device identity binding
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-service/src/vp3_client.rs
          git commit -m "Bind VP3 activation to local HomeServer identity"
          git push origin HEAD:feature/vp3-activation-update-client-v1-20260729

  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Validate canonical formatting
        run: cargo fmt --all -- --check
      - name: Compile service and updater
        run: cargo check -p microgifter-homeserver-service -p microgifter-homeserver-updater --all-targets
      - name: Run service and updater tests
        run: cargo test -p microgifter-homeserver-service -p microgifter-homeserver-updater
      - name: Run strict Phase 13 Clippy
        run: cargo clippy -p microgifter-homeserver-service -p microgifter-homeserver-updater --all-targets -- -D warnings -A unused-imports -A dead-code -A clippy::uninlined-format-args -A clippy::const-is-empty
      - name: Verify Phase 13 trust boundaries
        shell: bash
        run: |
          grep -q 'vp3-software-authority-device-credential' crates/homeserver-service/src/vp3_client.rs
          grep -q 'VerifyingKey' crates/homeserver-service/src/vp3_client.rs
          grep -q 'verify_authenticode' crates/homeserver-service/src/vp3_client.rs
          grep -q 'installer_authorization' crates/homeserver-service/src/vp3_client.rs
          grep -q 'pending_vp3_submission' crates/homeserver-service/src/vp3_client.rs
          grep -q 'ACTIVATE VP3' crates/homeserver-service/src/vp3_client.rs
          grep -q 'DISCONNECT VP3' crates/homeserver-service/src/vp3_client.rs
          grep -q 'local_device_fingerprint_from_connection' crates/homeserver-service/src/vp3_client.rs
          grep -q 'MicrogifterHomeServer:vp3-device:' crates/homeserver-service/src/vp3_client.rs
          ! sed -n '/pub struct ActivateVp3Request/,/^}/p' crates/homeserver-service/src/vp3_client.rs | grep -q 'device_fingerprint'
          ! grep -Eqi 'credential[[:space:]]+(TEXT|BLOB)|enrollment_code[[:space:]]+(TEXT|BLOB)' database/migrations/0018_vp3_activation_update_client.sql

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Validate canonical formatting
        run: cargo fmt --all -- --check
      - name: Compile Windows service and updater
        run: cargo check -p microgifter-homeserver-service -p microgifter-homeserver-updater --all-targets
      - name: Run HomeServer service and updater tests
        run: cargo test -p microgifter-homeserver-service -p microgifter-homeserver-updater
      - name: Run strict Windows Phase 13 Clippy
        run: cargo clippy -p microgifter-homeserver-service -p microgifter-homeserver-updater --all-targets -- -D warnings -A unused-imports -A dead-code -A clippy::uninlined-format-args -A clippy::const-is-empty
