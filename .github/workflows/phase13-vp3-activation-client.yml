name: Phase 13 VP3 Activation Client

on:
  push:
    branches:
      - feature/vp3-activation-update-client-v1-20260729
  pull_request:

permissions:
  contents: read

concurrency:
  group: phase13-homeserver-${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Validate canonical formatting
        run: cargo fmt --all -- --check
      - name: Compile service and updater
        run: cargo check -p microgifter-homeserver-service -p microgifter-homeserver-updater --all-targets
      - name: Run service and updater tests
        run: cargo test -p microgifter-homeserver-service -p microgifter-homeserver-updater
      - name: Run strict Phase 13 Clippy
        run: cargo clippy -p microgifter-homeserver-service -p microgifter-homeserver-updater --all-targets -- -D warnings -A unused-imports -A dead-code -A clippy::uninlined-format-args -A clippy::const-is-empty
      - name: Verify Phase 13 trust boundaries
        shell: bash
        run: |
          grep -q 'vp3-software-authority-device-credential' crates/homeserver-service/src/vp3_client.rs
          grep -q 'VerifyingKey' crates/homeserver-service/src/vp3_client.rs
          grep -q 'verify_authenticode' crates/homeserver-service/src/vp3_client.rs
          grep -q 'installer_authorization' crates/homeserver-service/src/vp3_client.rs
          grep -q 'pending_vp3_submission' crates/homeserver-service/src/vp3_client.rs
          grep -q 'ACTIVATE VP3' crates/homeserver-service/src/vp3_client.rs
          grep -q 'DISCONNECT VP3' crates/homeserver-service/src/vp3_client.rs
          ! grep -Eqi 'credential[[:space:]]+(TEXT|BLOB)|enrollment_code[[:space:]]+(TEXT|BLOB)' database/migrations/0018_vp3_activation_update_client.sql

  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.88.0
          components: rustfmt, clippy
      - name: Validate canonical formatting
        run: cargo fmt --all -- --check
      - name: Compile Windows service and updater
        run: cargo check -p microgifter-homeserver-service -p microgifter-homeserver-updater --all-targets
      - name: Run HomeServer service and updater tests
        run: cargo test -p microgifter-homeserver-service -p microgifter-homeserver-updater
      - name: Run strict Windows Phase 13 Clippy
        run: cargo clippy -p microgifter-homeserver-service -p microgifter-homeserver-updater --all-targets -- -D warnings -A unused-imports -A dead-code -A clippy::uninlined-format-args -A clippy::const-is-empty
