name: Phase 16 Format Repair

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: homeserver-phase16-format-repair
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: feature/phase-16-multi-wrapper-core-v1
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Commit formatter-only repair
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates
          if git diff --cached --quiet; then
            echo 'Rust source is already formatted.'
            exit 0
          fi
          git commit -m 'Apply canonical Rust formatting to Phase 16A'
          git push origin HEAD:feature/phase-16-multi-wrapper-core-v1
