name: Phase 3A Direct Lock Commit

on:
  push:
    branches:
      - feature/phase-3-backup-recovery-updates-20260724

permissions:
  actions: read
  contents: write

jobs:
  commit-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3-backup-recovery-updates-20260724
          fetch-depth: 0

      - name: Download exact generated Cargo lock
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 30127932519 --repo bigriversocial74/homeserver --name dependency-lock-diagnostics --dir lock-artifact
          $blob = (git hash-object lock-artifact/generated-locks/Cargo.lock).Trim()
          Write-Host "Artifact Cargo.lock blob: $blob"
          if ($blob -ne "150f81bf0f3b60fef0d225a2f29e64373ed0b047") {
            throw "Downloaded Cargo.lock does not match the strict-run artifact"
          }

      - name: Create exact Git tree and commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "bigriversocial74/homeserver"
          $branch = "feature/phase-3-backup-recovery-updates-20260724"
          $head = (gh api "/repos/$repo/git/ref/heads/$branch" --jq ".object.sha").Trim()
          $headCommit = gh api "/repos/$repo/git/commits/$head" | ConvertFrom-Json
          $baseTree = $headCommit.tree.sha

          $bytes = [IO.File]::ReadAllBytes("lock-artifact/generated-locks/Cargo.lock")
          $blobPayload = @{
            content = [Convert]::ToBase64String($bytes)
            encoding = "base64"
          } | ConvertTo-Json -Compress
          $blobPayload | Set-Content blob-payload.json -Encoding utf8NoBOM
          $blob = gh api --method POST "/repos/$repo/git/blobs" --input blob-payload.json | ConvertFrom-Json
          if ($blob.sha -ne "150f81bf0f3b60fef0d225a2f29e64373ed0b047") {
            throw "GitHub created an unexpected Cargo.lock blob"
          }

          $treePayload = @{
            base_tree = $baseTree
            tree = @(
              @{
                path = "Cargo.lock"
                mode = "100644"
                type = "blob"
                sha = $blob.sha
              },
              @{
                path = ".github/workflows/phase3a-direct-lock-commit.yml"
                mode = "100644"
                type = "blob"
                sha = $null
              }
            )
          } | ConvertTo-Json -Depth 8 -Compress
          $treePayload | Set-Content tree-payload.json -Encoding utf8NoBOM
          $tree = gh api --method POST "/repos/$repo/git/trees" --input tree-payload.json | ConvertFrom-Json

          $commitPayload = @{
            message = "Commit exact generated recovery dependency lock"
            tree = $tree.sha
            parents = @($head)
          } | ConvertTo-Json -Depth 6 -Compress
          $commitPayload | Set-Content commit-payload.json -Encoding utf8NoBOM
          $commit = gh api --method POST "/repos/$repo/git/commits" --input commit-payload.json | ConvertFrom-Json

          $refPayload = @{
            sha = $commit.sha
            force = $false
          } | ConvertTo-Json -Compress
          $refPayload | Set-Content ref-payload.json -Encoding utf8NoBOM
          gh api --method PATCH "/repos/$repo/git/refs/heads/$branch" --input ref-payload.json | Out-Null
          Write-Host "Direct Cargo.lock commit: $($commit.sha)"
