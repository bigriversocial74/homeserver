name: Refresh v0.1.2 Locks

on:
  push:
    branches:
      - fix/release-packaging-version-v012-20260725

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/release-packaging-version-v012-20260725
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate dependency locks
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile

      - name: Commit generated locks
        run: |
          if git diff --quiet -- Cargo.lock package-lock.json; then
            echo "Dependency locks are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock package-lock.json
          git commit -m "Refresh v0.1.2 dependency locks"
          git push origin HEAD:fix/release-packaging-version-v012-20260725
