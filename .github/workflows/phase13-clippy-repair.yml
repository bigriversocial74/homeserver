name: Phase 13 Clippy Repair

on:
  push:
    branches:
      - feature/vp3-activation-update-client-v1-20260729

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-activation-update-client-v1-20260729
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Repair Phase 13 Clippy findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app = Path('crates/homeserver-service/src/app.rs')
          source = app.read_text().replace(
              '.is_none_or(|authority| authority.current_authority != "vp3")',
              '.map_or(true, |authority| authority.current_authority != "vp3")',
              1,
          )
          app.write_text(source)

          client = Path('crates/homeserver-service/src/vp3_client.rs')
          source = client.read_text()
          source = re.sub(r'^    current_version: Option<String>,\n', '', source, count=1, flags=re.MULTILINE)
          source = re.sub(r'^    license_public_id: Option<String>,\n', '', source, count=1, flags=re.MULTILINE)
          source = source.replace(
              'SELECT account_id,device_public_id,license_public_id,device_fingerprint,lease_expires_at_utc FROM vp3_authority_client_state',
              'SELECT account_id,device_public_id,device_fingerprint,lease_expires_at_utc FROM vp3_authority_client_state',
              1,
          )
          source = re.sub(r'\n\s*license_public_id: row\.get\(2\)\?,', '', source, count=1)
          source = source.replace('device_fingerprint: row.get(3)?,', 'device_fingerprint: row.get(2)?,', 1)
          source = source.replace('lease_expires_at_utc: row.get(4)?,', 'lease_expires_at_utc: row.get(3)?,', 1)
          if '.is_none_or(' in app.read_text():
              raise SystemExit('Rust 1.80 MSRV repair did not apply')
          if 'current_version: Option<String>' in source or 'license_public_id: Option<String>' in source:
              raise SystemExit('Unused Phase 13 fields remain')
          client.write_text(source)
          PY
          cargo fmt --all
      - name: Commit Phase 13 source repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-service/src/app.rs crates/homeserver-service/src/vp3_client.rs
          git commit -m "Resolve Phase 13 Clippy findings"
          git push origin HEAD:feature/vp3-activation-update-client-v1-20260729
