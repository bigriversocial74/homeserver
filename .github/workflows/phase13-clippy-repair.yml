name: Phase 13 Clippy Repair

on:
  push:
    branches:
      - feature/vp3-activation-update-client-v1-20260729

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-activation-update-client-v1-20260729
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Repair strict Clippy findings
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path('crates/homeserver-service/src')

          path = root / 'app.rs'
          source = path.read_text()
          old = '.is_none_or(|authority| authority.current_authority != "vp3")'
          if old not in source:
              raise SystemExit('Phase 13 MSRV expression was not found')
          path.write_text(source.replace(old, '.map_or(true, |authority| authority.current_authority != "vp3")', 1))

          path = root / 'vp3_client.rs'
          source = path.read_text()
          source = source.replace('    current_version: Option<String>,\n', '', 1)
          source = source.replace('    license_public_id: Option<String>,\n', '', 1)
          source = source.replace(
              'SELECT account_id,device_public_id,license_public_id,device_fingerprint,lease_expires_at_utc FROM vp3_authority_client_state',
              'SELECT account_id,device_public_id,device_fingerprint,lease_expires_at_utc FROM vp3_authority_client_state',
              1,
          )
          source = source.replace(
              '''                    license_public_id: row.get(2)?,
                      device_fingerprint: row.get(3)?,
                      lease_expires_at_utc: row.get(4)?,''',
              '''                    device_fingerprint: row.get(2)?,
                      lease_expires_at_utc: row.get(3)?,''',
              1,
          )
          if 'current_version: Option<String>' in source or 'license_public_id: Option<String>' in source:
              raise SystemExit('Unused Phase 13 response fields remain')
          path.write_text(source)

          path = root / 'backup_key.rs'
          source = path.read_text()
          source = source.replace('use sha2::{Digest, Sha256};', '#[cfg(any(windows, test))]\nuse sha2::{Digest, Sha256};', 1)
          source = source.replace('use zeroize::Zeroize;', '#[cfg(windows)]\nuse zeroize::Zeroize;', 1)
          source = source.replace('fn entropy(installation_id: &str) -> [u8; 32] {', '#[cfg(any(windows, test))]\nfn entropy(installation_id: &str) -> [u8; 32] {', 1)
          path.write_text(source)

          for name in ('update.rs', 'update_apply.rs'):
              path = root / name
              source = path.read_text()
              source = source.replace('    process::Command,\n', '', 1)
              marker = 'use std::{\n'
              if marker not in source:
                  raise SystemExit(f'{name} std import marker was not found')
              source = source.replace(marker, '#[cfg(windows)]\nuse std::process::Command;\n' + marker, 1)
              path.write_text(source)

          path = root / 'agent_runtime.rs'
          source = path.read_text()
          old = '''    Ok(format!(
              "{}{}\\n\\n{}\\n\\nHomeServer preserved provider authority and used only locally granted evidence. No provider record was changed.",
              context_line, safety_line, evidence_section
          ))'''
          new = '''    Ok(format!(
              "{context_line}{safety_line}\\n\\n{evidence_section}\\n\\nHomeServer preserved provider authority and used only locally granted evidence. No provider record was changed."
          ))'''
          if old not in source:
              raise SystemExit('agent_runtime format expression was not found')
          path.write_text(source.replace(old, new, 1))

          path = root / 'knowledge_vault.rs'
          source = path.read_text()
          old = 'destination.with_extension(format!("{}.tmp", extension))'
          if old not in source:
              raise SystemExit('knowledge_vault format expression was not found')
          path.write_text(source.replace(old, 'destination.with_extension(format!("{extension}.tmp"))', 1))

          path = root / 'microgifter_connection.rs'
          source = path.read_text()
          old = '''    ensure!(
              !APPLICATION_ERROR_CODES.is_empty(),
              "Phase 6A application error registry is unavailable"
          );
          '''
          if old not in source:
              raise SystemExit('constant application error registry assertion was not found')
          path.write_text(source.replace(old, '', 1))

          path = root / 'review_intelligence.rs'
          source = path.read_text()
          source = source.replace(
              'format!(" and average rating {:.1}", rating)',
              'format!(" and average rating {rating:.1}")',
              1,
          )
          source = source.replace(
              '''"SELECT entity_id,dataset_key,source_object_type,source_object_id,current_source_revision,current_payload_json,source_updated_at_utc,received_at_utc FROM operational_entities WHERE connection_id=?1 AND state='active' AND dataset_key IN ({placeholders}) ORDER BY COALESCE(source_updated_at_utc,received_at_utc) DESC LIMIT {}",
              limit''',
              '''"SELECT entity_id,dataset_key,source_object_type,source_object_id,current_source_revision,current_payload_json,source_updated_at_utc,received_at_utc FROM operational_entities WHERE connection_id=?1 AND state='active' AND dataset_key IN ({placeholders}) ORDER BY COALESCE(source_updated_at_utc,received_at_utc) DESC LIMIT {limit}"''',
              1,
          )
          path.write_text(source)
          PY
          cargo fmt --all
      - name: Commit quality repairs
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-service/src
          git commit -m "Resolve strict Phase 13 Clippy findings"
          git push origin HEAD:feature/vp3-activation-update-client-v1-20260729
