name: Format Phase 5B sources

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5b-rustfmt
  cancel-in-progress: false

jobs:
  format:
    if: github.head_ref == 'feature/phase-5b-multi-connection-supervised-agents-20260727'
    runs-on: windows-2025
    steps:
      - name: Check out Phase 5B branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-5b-multi-connection-supervised-agents-20260727
          fetch-depth: 0

      - name: Install Rustfmt
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt

      - name: Format scoped Phase 5B Rust files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo fmt --all
          $allowed = @(
            'crates/homeserver-service/src/app.rs',
            'crates/homeserver-service/src/cloud_pairing_v2.rs',
            'crates/homeserver-service/src/cloud_registry.rs',
            'src-tauri/src/cloud.rs'
          )
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin $allowed })
          if ($unexpected.Count -gt 0) {
            throw "Rustfmt changed unexpected files: $($unexpected -join ', ')"
          }
          if ($changed.Count -eq 0) {
            Write-Host 'Phase 5B Rust sources are already formatted.'
            exit 0
          }
          git add -- $allowed
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Apply Rustfmt to Phase 5B sources'
          git push origin HEAD:feature/phase-5b-multi-connection-supervised-agents-20260727
