name: Run HomeServer VP3 HTTP Client Builder

on:
  push:
    branches:
      - feature/vp3-http-client-v1-20260729
    paths:
      - .github/workflows/run-vp3-http-client-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-http-client-v1-20260729
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Extract product builder without altering embedded source
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/build-vp3-http-client-v1.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(source) if "cat > /tmp/build_vp3_client.py <<'PY'" in line) + 1
          end = next(index for index in range(start, len(source)) if source[index] == '          PY')
          prefix = ' ' * 10
          output = []
          triple = None
          for raw in source[start:end]:
              candidate = raw[len(prefix):] if raw.startswith(prefix) else raw
              if triple is None:
                  output.append(candidate)
                  for token in ("'''", '\"\"\"'):
                      if candidate.count(token) % 2 == 1:
                          triple = token
                          break
              else:
                  output.append(candidate if raw.startswith(prefix) and triple in raw else raw)
                  if raw.count(triple) % 2 == 1:
                      triple = None
          if triple is not None:
              raise SystemExit('Embedded builder contains an unterminated triple-quoted string')
          Path('/tmp/build_vp3_client.py').write_text('\n'.join(output) + '\n')
          PY
          test -s /tmp/build_vp3_client.py
          python /tmp/build_vp3_client.py
      - name: Normalize generated validator and Rust integration
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise SystemExit(f'{label} was not found')
              return text.replace(old, new, 1)

          validator = Path('scripts/validate-vp3-network-client.py')
          text = validator.read_text()
          marker = "    'sodium',\n"
          if marker not in text:
              raise SystemExit('False sodium validator marker was not found')
          text = text.replace(marker, '', 1)
          text = text.replace(
              "    'verify_authority_document',\n",
              "    'verify_authority_document',\n    'VP3_HOMESERVER_LEASE_PUBLIC_KEY_B64',\n    'installer_download_path',\n",
              1,
          )
          validator.write_text(text)

          client = Path('crates/homeserver-service/src/vp3_client.rs')
          text = client.read_text()
          text = replace_once(text, 'use crate::{software_authority, update, AppState};', 'use crate::{update, AppState};', 'unused authority import')
          text = replace_once(
              text,
              'use base64::{engine::general_purpose::URL_SAFE_NO_PAD, Engine as _};',
              'use base64::{engine::general_purpose::{STANDARD, URL_SAFE_NO_PAD}, Engine as _};',
              'base64 imports',
          )
          text = replace_once(
              text,
              'use futures_util::StreamExt;',
              'use ed25519_dalek::{Signature, Verifier, VerifyingKey};\nuse futures_util::StreamExt;',
              'Ed25519 imports',
          )
          text = replace_once(
              text,
              'const LEASE_REFRESH_WINDOW_SECONDS: i64 = 15 * 60;\n',
              'const LEASE_REFRESH_WINDOW_SECONDS: i64 = 15 * 60;\nconst DEFAULT_LEASE_KEY_ID: &str = "homeserver-lease-ed25519-v1";\n',
              'lease key constant insertion point',
          )
          text = replace_once(text, '    installer_download_url: String,', '    installer_download_path: String,', 'signed installer path field')
          text = replace_once(
              text,
              'struct Vp3ReleaseArtifact {\n    platform: String,\n    architecture: String,\n    sha256: String,\n    size_bytes: u64,\n    authenticode_thumbprint: Option<String>,\n}',
              'struct Vp3ReleaseArtifact {\n    platform: String,\n    architecture: String,\n    file_name: Option<String>,\n    sha256: String,\n    size_bytes: u64,\n    authenticode_thumbprint: Option<String>,\n}',
              'signed artifact fields',
          )
          text = replace_once(
              text,
              'struct ManifestArtifact {\n    platform: String,\n    architecture: String,\n    sha256: String,\n    size_bytes: u64,\n    authenticode_thumbprint: String,\n    file_name: String,\n}',
              'struct ManifestArtifact {\n    platform: String,\n    architecture: String,\n    sha256: String,\n    size_bytes: u64,\n}',
              'endpoint artifact fields',
          )
          old_artifact = '''    let signed_artifact = signed.artifacts.iter().find(|artifact| artifact.platform == "windows" && artifact.architecture == "x86_64").context("VP3 signed release does not include the Windows x86_64 artifact")?;
    let thumbprint = signed_artifact.authenticode_thumbprint.as_deref().unwrap_or("").to_uppercase();
    validate_artifact(
        &endpoint_artifact.sha256,
        endpoint_artifact.size_bytes,
        &endpoint_artifact.authenticode_thumbprint,
        &endpoint_artifact.file_name,
    )?;
    ensure!(signed_artifact.sha256.eq_ignore_ascii_case(&endpoint_artifact.sha256) && signed_artifact.size_bytes == endpoint_artifact.size_bytes && thumbprint.eq_ignore_ascii_case(&endpoint_artifact.authenticode_thumbprint), "VP3 authorized artifact does not match the signed release document");
    ensure!(endpoint_artifact.platform == "windows" && endpoint_artifact.architecture == "x86_64", "VP3 authorized artifact target is invalid");
    let installer_url = secure_installer_url(&base, &signed.installer_download_url)?;
'''
          new_artifact = '''    let signed_artifact = signed.artifacts.iter().find(|artifact| artifact.platform == "windows" && artifact.architecture == "x86_64").context("VP3 signed release does not include the Windows x86_64 artifact")?;
    let thumbprint = signed_artifact.authenticode_thumbprint.as_deref().unwrap_or("").to_uppercase();
    let file_name = signed_artifact.file_name.as_deref().unwrap_or("").to_owned();
    validate_artifact(
        &signed_artifact.sha256,
        signed_artifact.size_bytes,
        &thumbprint,
        &file_name,
    )?;
    ensure!(signed_artifact.sha256.eq_ignore_ascii_case(&endpoint_artifact.sha256) && signed_artifact.size_bytes == endpoint_artifact.size_bytes, "VP3 authorized artifact does not match the signed release document");
    ensure!(endpoint_artifact.platform == "windows" && endpoint_artifact.architecture == "x86_64", "VP3 authorized artifact target is invalid");
    let installer_url = secure_installer_url(&base, &signed.installer_download_path)?;
'''
          text = replace_once(text, old_artifact, new_artifact, 'signed artifact validation block')
          text = text.replace('file_name: endpoint_artifact.file_name.clone(),', 'file_name: file_name.clone(),', 1)
          text = text.replace('sha256: endpoint_artifact.sha256.to_lowercase(),', 'sha256: signed_artifact.sha256.to_lowercase(),', 1)
          text = text.replace('size_bytes: endpoint_artifact.size_bytes,', 'size_bytes: signed_artifact.size_bytes,', 1)
          text = text.replace('authenticode_thumbprint: endpoint_artifact.authenticode_thumbprint.to_uppercase(),', 'authenticode_thumbprint: thumbprint.clone(),', 1)
          text = text.replace('endpoint_artifact.file_name, endpoint_artifact.size_bytes as i64, endpoint_artifact.sha256.to_lowercase(), endpoint_artifact.authenticode_thumbprint.to_uppercase()', 'file_name, signed_artifact.size_bytes as i64, signed_artifact.sha256.to_lowercase(), thumbprint', 1)
          text = replace_once(
              text,
              '    let document = update::verify_authority_document(&response.document, &response.signature, &response.key_id)?;',
              '    let document = verify_lease_document(&response.document, &response.signature, &response.key_id)?;',
              'dedicated lease verifier call',
          )
          verifier_marker = 'fn verify_authorization(authorization: &ReleaseAuthorization) -> Result<()> {'
          verifier = '''fn verify_lease_document(document: &str, signature: &str, key_id: &str) -> Result<Vec<u8>> {
    let expected_key_id = option_env!("VP3_HOMESERVER_LEASE_SIGNING_KEY_ID")
        .filter(|value| !value.trim().is_empty())
        .unwrap_or(DEFAULT_LEASE_KEY_ID);
    ensure!(key_id == expected_key_id, "VP3 entitlement lease signing key is not trusted");
    let public_key = option_env!("VP3_HOMESERVER_LEASE_PUBLIC_KEY_B64")
        .filter(|value| !value.trim().is_empty())
        .context("VP3 entitlement lease public key is not compiled into this HomeServer release")?;
    let public_key = STANDARD.decode(public_key).context("VP3 entitlement lease public key encoding is invalid")?;
    let public_key: [u8; 32] = public_key.try_into().map_err(|_| anyhow!("VP3 entitlement lease public key length is invalid"))?;
    let verifier = VerifyingKey::from_bytes(&public_key).context("VP3 entitlement lease public key is invalid")?;
    let document = URL_SAFE_NO_PAD.decode(document).context("VP3 entitlement lease document encoding is invalid")?;
    let signature = URL_SAFE_NO_PAD.decode(signature).context("VP3 entitlement lease signature encoding is invalid")?;
    let signature = Signature::from_slice(&signature).context("VP3 entitlement lease signature length is invalid")?;
    verifier.verify(&document, &signature).context("VP3 entitlement lease signature verification failed")?;
    Ok(document)
}

'''
          text = replace_once(text, verifier_marker, verifier + verifier_marker, 'dedicated lease verifier insertion point')
          text = replace_once(text, '    let url = Url::parse(value).context("VP3 installer URL is invalid")?;', '    let url = base.join(value).context("VP3 installer path is invalid")?;', 'signed installer path resolution')
          text = text.replace('&state.connection()?', '&*state.connection()?')
          client.write_text(text)

          main = Path('crates/homeserver-service/src/main.rs')
          text = main.read_text().replace('&self.connection()?', '&*self.connection()?')
          text = replace_once(
              text,
              '&software_authority::manifest_url(&connection, &self.config.update_manifest_url)?,',
              '&software_authority::manifest_url(&connection, &self.config.update_manifest_url)\n                .unwrap_or_else(|_| self.config.update_manifest_url.clone()),',
              'health snapshot manifest URL',
          )
          main.write_text(text)

          authority = Path('crates/homeserver-service/src/software_authority.rs')
          text = authority.read_text().replace('&state.connection()?', '&*state.connection()?')
          replacements = {
              '''    status_snapshot(&*state.connection()?)
        .map(Json)
        .map_err(|error| internal_error("vp3_activation_status_failed", error))''': '''    let connection = state
        .connection()
        .map_err(|error| internal_error("vp3_activation_database_failed", error))?;
    status_snapshot(&connection)
        .map(Json)
        .map_err(|error| internal_error("vp3_activation_status_failed", error))''',
              '''    status_snapshot(&*state.connection()?)
        .map(Json)
        .map_err(|error| internal_error("vp3_lease_refresh_status_failed", error))''': '''    let connection = state
        .connection()
        .map_err(|error| internal_error("vp3_lease_refresh_database_failed", error))?;
    status_snapshot(&connection)
        .map(Json)
        .map_err(|error| internal_error("vp3_lease_refresh_status_failed", error))''',
              '''    status_snapshot(&*state.connection()?)
        .map(Json)
        .map_err(|error| internal_error("vp3_heartbeat_status_failed", error))''': '''    let connection = state
        .connection()
        .map_err(|error| internal_error("vp3_heartbeat_database_failed", error))?;
    status_snapshot(&connection)
        .map(Json)
        .map_err(|error| internal_error("vp3_heartbeat_status_failed", error))''',
          }
          for old, new in replacements.items():
              text = replace_once(text, old, new, 'VP3 authority handler integration')
          authority.write_text(text)
          PY
      - name: Validate generated product tree
        id: validate
        continue-on-error: true
        run: |
          set -o pipefail
          {
            python scripts/validate-vp3-network-client.py
            cargo fmt --all
            cargo test -p microgifter-homeserver-service
            cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings
          } 2>&1 | tee vp3-client-build.log
      - name: Commit generated product with diagnostics
        if: always()
        env:
          VALIDATION_OUTCOME: ${{ steps.validate.outcome }}
        run: |
          rm -f .github/workflows/build-vp3-http-client-v1.yml
          rm -f .github/workflows/run-vp3-http-client-builder.yml
          rm -f .github/workflows/vp3-builder-bootstrap.yml
          rm -f .vp3-builder-bootstrap
          if [ "$VALIDATION_OUTCOME" = "success" ]; then
            rm -f vp3-client-build.log
            message="Build VP3 HomeServer HTTP client v1"
          else
            message="Stage VP3 HomeServer client compiler diagnostics"
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "$message"
          git push origin HEAD:feature/vp3-http-client-v1-20260729

# diagnostics-builder-trigger-1
