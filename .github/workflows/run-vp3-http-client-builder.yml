name: Run HomeServer VP3 HTTP Client Builder

on:
  pull_request:
    paths:
      - .github/workflows/run-vp3-http-client-builder.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-http-client-v1-20260729
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Extract product builder without altering embedded source
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/build-vp3-http-client-v1.yml').read_text().splitlines()
          start = next(index for index, line in enumerate(source) if "cat > /tmp/build_vp3_client.py <<'PY'" in line) + 1
          end = next(index for index in range(start, len(source)) if source[index] == '          PY')
          prefix = ' ' * 10
          output = []
          triple = None
          for raw in source[start:end]:
              candidate = raw[len(prefix):] if raw.startswith(prefix) else raw
              if triple is None:
                  output.append(candidate)
                  for token in ("'''", '\"\"\"'):
                      if candidate.count(token) % 2 == 1:
                          triple = token
                          break
              else:
                  output.append(candidate if raw.startswith(prefix) and triple in raw else raw)
                  if raw.count(triple) % 2 == 1:
                      triple = None
          if triple is not None:
              raise SystemExit('Embedded builder contains an unterminated triple-quoted string')
          Path('/tmp/build_vp3_client.py').write_text('\n'.join(output) + '\n')
          PY
          test -s /tmp/build_vp3_client.py
          python /tmp/build_vp3_client.py
      - name: Normalize generated validator
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/validate-vp3-network-client.py')
          text = path.read_text()
          marker = "    'sodium',\n"
          if marker not in text:
              raise SystemExit('False sodium validator marker was not found')
          path.write_text(text.replace(marker, '', 1))
          PY
      - name: Validate generated product tree
        run: |
          python scripts/validate-vp3-network-client.py
          cargo fmt --all
          cargo test -p microgifter-homeserver-service
          cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings
      - name: Commit validated product files
        run: |
          rm .github/workflows/build-vp3-http-client-v1.yml
          rm .github/workflows/run-vp3-http-client-builder.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Build VP3 HomeServer HTTP client v1"
          git push origin HEAD:feature/vp3-http-client-v1-20260729
