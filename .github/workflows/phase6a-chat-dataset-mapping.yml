name: Map Agent Chat operational datasets

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: phase6a-chat-dataset-mapping
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feature/homeserver-agent-chat-connection-ui-v1-20260728'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/homeserver-agent-chat-connection-ui-v1-20260728
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Map operational context to granted dataset keys
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/homeserver-agent-chat.js")
          text = path.read_text(encoding="utf-8")
          anchor = "\n".join([
              "function selectedContext() {",
              "  return [...document.querySelectorAll('input[name=\"hs-chat-context\"]:checked')].map((input) => input.value);",
              "}",
              "",
          ])
          replacement = "\n".join([
              "function selectedContext() {",
              "  return [...document.querySelectorAll('input[name=\"hs-chat-context\"]:checked')].map((input) => input.value);",
              "}",
              "",
              "function selectedDatasetKeys(context) {",
              "  const keys = new Set(context.filter((value) => ![\"connections\", \"operational_data\"].includes(value)));",
              "  if (context.includes(\"operational_data\")) {",
              "    (workspace?.data_sources || [])",
              "      .filter((source) => String(source.key || \"\").startsWith(\"dataset:\") && ![\"planned_phase_5c\", \"paused\", \"not_granted\"].includes(source.state))",
              "      .forEach((source) => keys.add(source.key));",
              "  }",
              "  return [...keys];",
              "}",
              "",
          ])
          if "function selectedDatasetKeys(context)" not in text:
              if anchor not in text:
                  raise SystemExit("Agent Chat context anchor not found")
              text = text.replace(anchor, replacement, 1)
          text = text.replace("    dataset_keys: context,", "    dataset_keys: selectedDatasetKeys(context),", 1)
          path.write_text(text, encoding="utf-8")
          '@ | python -

      - name: Validate frontend
        shell: pwsh
        run: |
          node --check src/homeserver-agent-chat.js
          npm ci
          npm run check:frontend
          npm run build

      - name: Commit repair and remove helper
        shell: pwsh
        run: |
          Remove-Item .github/workflows/phase6a-chat-dataset-mapping.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/homeserver-agent-chat.js .github/workflows/phase6a-chat-dataset-mapping.yml
          if (-not (git diff --cached --quiet)) {
            git commit -m "Map Agent Chat operational dataset context"
            git push origin HEAD:feature/homeserver-agent-chat-connection-ui-v1-20260728
          }
