name: POD Provider Compile Repair

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/pod-provider-voice-adapter-v1-20260728'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/pod-provider-voice-adapter-v1-20260728
          fetch-depth: 0
      - name: Repair capability-test model list
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/homeserver-service/src/app/pod_provider_runtime.rs')
          source = path.read_text(encoding='utf-8')
          opening = '        "capability_test" => Ok((\n            json!({' 
          replacement_opening = '''        "capability_test" => {
            let models = [
                runtime.transcription_model.clone(),
                runtime.synthesis_model.clone(),
            ]
            .into_iter()
            .flatten()
            .collect::<Vec<_>>();
            Ok((
                json!({'''
          models = '                "models": [runtime.transcription_model.clone(), runtime.synthesis_model.clone()].into_iter().flatten().collect::<Vec<_>>(),'
          closing = '''            }),
            None,
            Some(started.elapsed().as_millis() as u64),
        )),
        "speech_to_text" => {'''
          replacement_closing = '''                }),
                None,
                Some(started.elapsed().as_millis() as u64),
            ))
        },
        "speech_to_text" => {'''
          for needle in (opening, models, closing):
              count = source.count(needle)
              if count != 1:
                  raise SystemExit(f'Expected one exact compile-repair token, found {count}: {needle!r}')
          source = source.replace(opening, replacement_opening, 1)
          source = source.replace(models, '                    "models": models,', 1)
          source = source.replace(closing, replacement_closing, 1)
          path.write_text(source, encoding='utf-8')
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Format and commit repair
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/homeserver-service/src/app/pod_provider_runtime.rs
          git commit -m 'Repair POD capability-test model serialization'
          git push origin HEAD:feature/pod-provider-voice-adapter-v1-20260728
