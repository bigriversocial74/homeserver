name: Repair PR44 Cargo Lock

on:
  push:
    branches:
      - feature/pairing-first-agent-workspace-onboarding-v1-20260729

permissions:
  contents: write

concurrency:
  group: repair-pr44-cargo-lock
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: windows-2025
    steps:
      - name: Check out PR branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/pairing-first-agent-workspace-onboarding-v1-20260729
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Regenerate Cargo lockfile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo generate-lockfile
          $changed = @(git diff --name-only)
          if ($changed.Count -eq 0) {
            Write-Host 'Cargo.lock is already stable.'
            exit 0
          }
          if ($changed.Count -ne 1 -or $changed[0] -ne 'Cargo.lock') {
            throw "Unexpected generated changes: $($changed -join ', ')"
          }
          git diff --check -- Cargo.lock

      - name: Commit generated lockfile
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (git diff --quiet -- Cargo.lock)) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.lock
            git commit -m 'Regenerate Cargo lockfile for deterministic builds'
            git push origin HEAD:feature/pairing-first-agent-workspace-onboarding-v1-20260729
          }
