name: Phase 23B Final Audit Hardening

on:
  push:
    branches:
      - feature/phase-23b-local-vad-segmentation
    paths:
      - scripts/apply-phase23b-final-audit.py
      - .github/workflows/phase23b-final-audit.yml

permissions:
  contents: write

concurrency:
  group: phase23b-final-audit
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase 23B branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-23b-local-vad-segmentation
          fetch-depth: 0

      - name: Apply final permanent hardening
        run: python scripts/apply-phase23b-final-audit.py

      - name: Remove one-time audit assets
        run: |
          git rm scripts/apply-phase23b-final-audit.py
          git rm .github/workflows/phase23b-final-audit.yml

      - name: Commit final audited candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/homeserver-agent-vad.js scripts/validate-agent-audio-vad.py
          git diff --cached --check
          git commit -m "Complete Phase 23B evidence and UI hardening"
          git push origin HEAD:feature/phase-23b-local-vad-segmentation
