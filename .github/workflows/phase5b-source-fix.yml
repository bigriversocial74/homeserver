name: Phase 5B source fix

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase5b-source-fix.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5b-source-fix
  cancel-in-progress: false

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-5b-multi-connection-supervised-agents-20260727
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt

      - name: Bind pairing to connection identity
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $path = 'crates/homeserver-service/src/cloud_registry.rs'
          $source = Get-Content $path -Raw
          $old = @'
                &request.pairing_code,
                &installation_id,
                &self.config.server_name,
'@
          $new = @'
                &request.pairing_code,
                &connection_id,
                &self.config.server_name,
'@
          if (-not $source.Contains($old)) {
            throw 'Expected connection pairing call was not found.'
          }
          $source = $source.Replace($old, $new)
          $source = $source.Replace('i64::from(make_default),', 'if make_default { 1_i64 } else { 0_i64 },')
          Set-Content $path $source -NoNewline
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit source correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add crates/homeserver-service/src/cloud_registry.rs
          if (-not (git diff --cached --name-only)) {
            Write-Host 'Source correction already applied.'
            exit 0
          }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bind cloud pairing to registry connection identity'
          git push origin HEAD:feature/phase-5b-multi-connection-supervised-agents-20260727
