name: Phase 3A Apply Lock Artifact

on:
  push:
    branches:
      - feature/phase-3-backup-recovery-updates-20260724

permissions:
  actions: read
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3-backup-recovery-updates-20260724
          fetch-depth: 0

      - name: Download exact generated lock artifact
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -H "Accept: application/vnd.github+json" /repos/bigriversocial74/homeserver/actions/artifacts/8609998427/zip --output locks.zip
          Expand-Archive locks.zip -DestinationPath lock-artifact -Force
          Copy-Item lock-artifact/generated-locks/Cargo.lock Cargo.lock -Force
          Copy-Item lock-artifact/generated-locks/package-lock.json package-lock.json -Force
          git rm .github/workflows/phase3a-apply-lock-artifact.yml

      - name: Commit exact generated locks
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock package-lock.json .github/workflows/phase3a-apply-lock-artifact.yml
          git diff --cached --stat
          git commit -m "Apply exact generated recovery dependency locks"
          git push origin HEAD:feature/phase-3-backup-recovery-updates-20260724
