name: Phase 3B Update Module Cleanup

on:
  push:
    branches:
      - feature/phase-3b-signed-updates-20260724

permissions:
  contents: write

concurrency:
  group: phase3b-update-module-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3b-signed-updates-20260724

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Remove superseded launcher code and restore typed imports
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/homeserver-service/src/update.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'SignedUpdateManifest, UpdateApplicationResult, UpdateManifestPayload, PRODUCT_NAME,\n    UPDATE_KEY_ID, UPDATE_MANIFEST_SCHEMA_VERSION,',
              'SignedUpdateManifest, UpdateApplicationResult, UpdateManifestPayload, UpdateRecord,\n    UpdateState, PRODUCT_NAME, UPDATE_KEY_ID, UPDATE_MANIFEST_SCHEMA_VERSION,'
          )
          text, count = re.subn(
              r'\n#\[cfg\(windows\)\]\nfn launch_detached\(.*?\nfn valid_sha256',
              '\nfn valid_sha256',
              text,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit(f'expected one superseded launcher block, found {count}')
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
          git diff --check

      - name: Commit cleanup and remove helper
        shell: bash
        run: |
          git rm .github/workflows/phase-3b-update-module-cleanup.yml
          git add crates/homeserver-service/src/update.rs
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          git commit -m "Clean signed update verification module"
          git push origin HEAD:feature/phase-3b-signed-updates-20260724
