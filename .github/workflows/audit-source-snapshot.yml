name: HomeServer Audit Source Snapshot

on:
  push:
    branches:
      - audit/full-production-hardening-20260725
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Create source snapshot
        run: |
          tar \
            --exclude=.git \
            --exclude=target \
            --exclude=node_modules \
            --exclude=dist \
            -czf homeserver-audit-source.tar.gz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: homeserver-audit-source
          path: homeserver-audit-source.tar.gz
          if-no-files-found: error
          retention-days: 2
