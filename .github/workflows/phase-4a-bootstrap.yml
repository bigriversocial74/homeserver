name: Phase 4A Knowledge Vault Bootstrap

on:
  push:
    branches:
      - feature/phase-4a-knowledge-vault-20260726
    paths:
      - scripts/phase4a_bootstrap.py
      - scripts/phase4a_fixups.py
      - .github/workflows/phase-4a-bootstrap.yml
      - docs/phase-4a-bootstrap-status.md
      - docs/phase-4a-pr-scope.md

permissions:
  contents: read

concurrency:
  group: phase-4a-knowledge-vault-bootstrap
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out scoped branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-4a-knowledge-vault-20260726
          fetch-depth: 0

      - name: Apply scoped Knowledge Vault build
        run: |
          python scripts/phase4a_bootstrap.py
          python scripts/phase4a_fixups.py

      - name: Install production Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Format Rust source
        run: cargo fmt --all

      - name: Check service and shared contracts
        id: rust_check
        continue-on-error: true
        run: cargo check --locked -p microgifter-homeserver-core -p microgifter-homeserver-service > phase4a-check.log 2>&1

      - name: Upload compiler diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-4a-compiler-diagnostics
          path: phase4a-check.log
          if-no-files-found: error
          retention-days: 7

      - name: Enforce service contract check
        if: steps.rust_check.outcome != 'success'
        run: |
          tail -n 160 phase4a-check.log
          exit 1

      - name: Test service and shared contracts
        run: cargo test --locked -p microgifter-homeserver-core -p microgifter-homeserver-service

      - name: Run strict service linting
        run: cargo clippy --locked -p microgifter-homeserver-core -p microgifter-homeserver-service --all-targets -- -D warnings

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate frontend syntax
        run: npm run check:frontend

      - name: Build frontend
        run: npm run build

      - name: Validate patch whitespace
        run: git diff --check

      - name: Package validated payload
        run: |
          mkdir -p phase4a-payload
          cp --parents \
            README.md \
            crates/homeserver-service/src/main.rs \
            crates/homeserver-service/src/app.rs \
            crates/homeserver-service/src/knowledge_vault.rs \
            database/migrations/0005_knowledge_vault.sql \
            docs/phase-4a-knowledge-vault.md \
            src-tauri/src/lib.rs \
            src-tauri/src/vault.rs \
            src/main.js \
            phase4a-payload/
          git diff --binary > phase4a-payload/phase4a.patch

      - name: Upload validated payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase-4a-knowledge-vault-payload
          path: phase4a-payload
          if-no-files-found: error
          retention-days: 7
