name: Normalize Agent Chat dependency lock

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

concurrency:
  group: phase6a-chat-lock-normalize
  cancel-in-progress: false

jobs:
  normalize:
    if: github.actor != 'github-actions[bot]' && github.event.pull_request.head.ref == 'feature/homeserver-agent-chat-connection-ui-v1-20260728'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out feature branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/homeserver-agent-chat-connection-ui-v1-20260728
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Generate production lockfiles
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          npm install --package-lock-only --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $changed = @(git diff --name-only)
          $unexpected = @($changed | Where-Object { $_ -notin @('Cargo.lock','package-lock.json') })
          if ($unexpected.Count -gt 0) { throw "Unexpected lock normalization changes: $($unexpected -join ', ')" }

      - name: Commit normalized lock and remove helper
        shell: pwsh
        run: |
          Remove-Item .github/workflows/phase6a-chat-lock-normalize.yml -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock package-lock.json .github/workflows/phase6a-chat-lock-normalize.yml
          if (-not (git diff --cached --quiet)) {
            git commit -m "Normalize Agent Chat dependency locks"
            git push origin HEAD:feature/homeserver-agent-chat-connection-ui-v1-20260728
          }
