name: Phase 13 Source Repair

on:
  push:
    branches:
      - feature/vp3-activation-update-client-v1-20260729

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-activation-update-client-v1-20260729
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Repair Phase 13 source contracts
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('crates/homeserver-service/src')
          config = root / 'config.rs'
          client = root / 'vp3_client.rs'

          source = config.read_text()
          for field in (
              'vp3_base_url',
              'vp3_lease_public_key_base64',
              'vp3_lease_key_id',
              'vp3_release_public_key_base64',
              'vp3_release_key_id',
          ):
              source = re.sub(rf'^    pub {field}: String,\n', '', source, flags=re.MULTILINE)
          source = source.replace(
              "        let vp3_base_url = vp3_base_url.trim_end_matches('/').to_owned();\n",
              '',
          )
          source = re.sub(
              r'\n            vp3_base_url,\n'
              r'            vp3_lease_public_key_base64:.*?'
              r'            vp3_release_key_id:.*?\n'
              r'                \.unwrap_or_else\(\|_\| "release-ed25519-v1"\.to_owned\(\)\),\n',
              '\n',
              source,
              flags=re.DOTALL,
          )
          marker = '    pub fn pending_restore_plan_path(&self) -> PathBuf {\n'
          methods = '''    pub fn vp3_base_url(&self) -> Result<String> {
              let value = std::env::var("MG_HOMESERVER_VP3_BASE_URL")
                  .unwrap_or_else(|_| DEFAULT_VP3_BASE_URL.to_owned());
              validate_https_url(&value, "VP3 software authority")?;
              Ok(value.trim_end_matches('/').to_owned())
          }

          pub fn vp3_lease_public_key_base64(&self) -> String {
              std::env::var("MG_HOMESERVER_VP3_LEASE_PUBLIC_KEY_BASE64").unwrap_or_default()
          }

          pub fn vp3_lease_key_id(&self) -> String {
              std::env::var("MG_HOMESERVER_VP3_LEASE_KEY_ID")
                  .unwrap_or_else(|_| "homeserver-lease-ed25519-v1".to_owned())
          }

          pub fn vp3_release_public_key_base64(&self) -> String {
              std::env::var("MG_HOMESERVER_VP3_RELEASE_PUBLIC_KEY_BASE64").unwrap_or_default()
          }

          pub fn vp3_release_key_id(&self) -> String {
              std::env::var("MG_HOMESERVER_VP3_RELEASE_KEY_ID")
                  .unwrap_or_else(|_| "release-ed25519-v1".to_owned())
          }

          '''
          if 'pub fn vp3_base_url(&self)' not in source:
              if marker not in source:
                  raise SystemExit('AppConfig insertion marker was not found')
              source = source.replace(marker, methods + marker, 1)
          config.write_text(source)

          source = client.read_text()
          source = source.replace('use tracing::{info, warn};', 'use tracing::warn;')
          source = re.sub(
              r'    ensure!\(\s*request\.confirmation == "DISCONNECT VP3",\s*'
              r'"type DISCONNECT VP3 to remove local VP3 software authority"\s*\)\s*'
              r'\.map_err\(\|error\| action_error\("vp3_disconnect_confirmation_required", error\)\)\?;',
              '''    if request.confirmation != "DISCONNECT VP3" {
                  return Err(action_error(
                      "vp3_disconnect_confirmation_required",
                      "type DISCONNECT VP3 to remove local VP3 software authority",
                  ));
              }''',
              source,
              count=1,
              flags=re.DOTALL,
          )
          source = source.replace(
              '&state.config.vp3_lease_public_key_base64',
              '&state.config.vp3_lease_public_key_base64()',
          )
          source = source.replace(
              '&state.config.vp3_release_public_key_base64',
              '&state.config.vp3_release_public_key_base64()',
          )
          source = source.replace(
              'state.config.vp3_lease_key_id',
              'state.config.vp3_lease_key_id()',
          )
          source = source.replace(
              'state.config.vp3_release_key_id',
              'state.config.vp3_release_key_id()',
          )
          source = source.replace(
              "state.config.vp3_base_url.trim_end_matches('/')",
              "state.config.vp3_base_url()?.trim_end_matches('/')",
          )
          source = source.replace('state.config.vp3_base_url', 'state.config.vp3_base_url()?')
          source = source.replace('vp3_base_url()??', 'vp3_base_url()?')
          source = source.replace('vp3_base_url()?()?.', 'vp3_base_url()?.')

          start = source.index('async fn check_for_update(state: &AppState) -> Result<UpdateActionResult> {')
          end = source.index('\nasync fn fetch_manifest', start)
          check_function = '''async fn check_for_update(state: &AppState) -> Result<UpdateActionResult> {
              refresh_lease_if_needed(state).await?;
              heartbeat(state).await?;
              {
                  let connection = state.connection()?;
                  update_store::begin_check(&connection)?;
              }
              let response = fetch_manifest(state).await?;
              let manifest_url = format!(
                  "{}/api/homeserver/v1/manifest.php",
                  state.config.vp3_base_url()?
              );
              if !response.available {
                  let status = {
                      let connection = state.connection()?;
                      update_store::record_current(&connection)?;
                      update_store::status(
                          &connection,
                          &manifest_url,
                          state.config.update_plan_path().exists(),
                      )?
                  };
                  return Ok(UpdateActionResult {
                      status,
                      message: "HomeServer is current under VP3 software authority.".to_owned(),
                      restart_required: false,
                  });
              }
              let release = verify_release(state, &response)?;
              let current = Version::parse(env!("CARGO_PKG_VERSION"))?;
              let target = Version::parse(&release.version)?;
              if target <= current {
                  let status = {
                      let connection = state.connection()?;
                      update_store::record_current(&connection)?;
                      update_store::status(
                          &connection,
                          &manifest_url,
                          state.config.update_plan_path().exists(),
                      )?
                  };
                  return Ok(UpdateActionResult {
                      status,
                      message: "HomeServer is current under VP3 software authority.".to_owned(),
                      restart_required: false,
                  });
              }
              let derived = SignedUpdateManifest {
                  key_id: format!("vp3-document:{}", release.signing_key_id),
                  payload: UpdateManifestPayload {
                      schema_version: UPDATE_MANIFEST_SCHEMA_VERSION,
                      product: PRODUCT_NAME.to_owned(),
                      channel: UpdateChannel::Stable,
                      version: release.version.clone(),
                      minimum_version: release.minimum_version.clone(),
                      published_at_utc: Utc::now(),
                      release_notes: format!(
                          "VP3 signed release notes hash: {}",
                          release.release_notes_hash
                      ),
                      installer: UpdateInstallerContract {
                          url: format!(
                              "{}/api/homeserver/v1/installer-download.php",
                              state.config.vp3_base_url()?
                          ),
                          file_name: release.file_name.clone(),
                          size_bytes: release.size_bytes,
                          sha256: release.sha256.clone(),
                          authenticode_thumbprint: release.authenticode_thumbprint.clone(),
                      },
                  },
                  signature: release.manifest_signature.clone(),
              };
              let status = {
                  let connection = state.connection()?;
                  update_store::save_available(
                      &connection,
                      &release.update_id,
                      &manifest_url,
                      &derived,
                  )?;
                  update_store::status(
                      &connection,
                      &manifest_url,
                      state.config.update_plan_path().exists(),
                  )?
              };
              persist_release_binding(state, &release)?;
              Ok(UpdateActionResult {
                  status,
                  message: format!(
                      "HomeServer {} is available from verified VP3 software authority.",
                      release.version
                  ),
                  restart_required: false,
              })
          }
          '''
          source = source[:start] + check_function + source[end:]
          source = re.sub(
              r'    let staged\s*=\s*update_store::mark_staged\(\s*&state\.connection\(\)\?,\s*'
              r'&stored\.record\.update_id,\s*&destination\s*\)\?;',
              '''    let staged = {
                  let connection = state.connection()?;
                  update_store::mark_staged(&connection, &stored.record.update_id, &destination)?
              };''',
              source,
              count=1,
              flags=re.DOTALL,
          )
          source = re.sub(
              r'        status: update_store::status\(\s*&state\.connection\(\)\?,\s*'
              r'&format!\("\{\}/api/homeserver/v1/manifest\.php",\s*state\.config\.vp3_base_url\(\)\?\),\s*'
              r'state\.config\.update_plan_path\(\)\.exists\(\),\s*\)\?,',
              '''        status: {
                  let connection = state.connection()?;
                  update_store::status(
                      &connection,
                      &format!(
                          "{}/api/homeserver/v1/manifest.php",
                          state.config.vp3_base_url()?
                      ),
                      state.config.update_plan_path().exists(),
                  )?
              },''',
              source,
              count=1,
              flags=re.DOTALL,
          )
          if '&state.connection()?' in source:
              raise SystemExit('An inline SQLite guard remains in vp3_client.rs')
          client.write_text(source)
          PY
          cargo fmt --all
      - name: Commit Phase 13 repair
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-service/src/app.rs crates/homeserver-service/src/config.rs crates/homeserver-service/src/vp3_client.rs
          git commit -m "Repair Phase 13 VP3 client compilation"
          git push origin HEAD:feature/vp3-activation-update-client-v1-20260729
