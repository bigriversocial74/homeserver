name: Phase 13 Rustfmt Repair

on:
  pull_request:

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Collect formatted sources
        shell: bash
        run: |
          mkdir -p phase13-formatted/crates/homeserver-service/src
          cp crates/homeserver-service/src/app.rs phase13-formatted/crates/homeserver-service/src/app.rs
          cp crates/homeserver-service/src/config.rs phase13-formatted/crates/homeserver-service/src/config.rs
          cp crates/homeserver-service/src/vp3_client.rs phase13-formatted/crates/homeserver-service/src/vp3_client.rs
      - uses: actions/upload-artifact@v4
        with:
          name: phase13-formatted-sources
          path: phase13-formatted
          if-no-files-found: error
          retention-days: 1
