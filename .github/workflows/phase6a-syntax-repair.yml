name: Phase 6A Syntax Repair

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'feature/microgifter-entitlement-update-client-v1-20260728'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Repair and format Phase 6A source
        shell: python
        run: |
          from pathlib import Path
          source = Path('crates/homeserver-service/src/microgifter_connection.rs')
          text = source.read_text(encoding='utf-8')
          old = 'if start as u32 + duration as u32 < 1440 {'
          new = 'if start as u32 + (duration as u32) < 1440 {'
          if text.count(old) != 1:
              raise SystemExit('expected maintenance-window syntax anchor was not found exactly once')
          source.write_text(text.replace(old, new, 1), encoding='utf-8')
          diagnostic = Path('diagnostics/phase6a-rustfmt-error.txt')
          if diagnostic.exists():
              diagnostic.unlink()
          workflow = Path('.github/workflows/phase6a-syntax-repair.yml')
          if workflow.exists():
              workflow.unlink()

      - name: Format Rust
        run: cargo fmt --all

      - name: Commit syntax repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair and format Phase 6A service source"
          git push origin HEAD:${{ github.head_ref }}
