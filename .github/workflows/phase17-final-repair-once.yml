name: Phase 17 Final Repair Once

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.number == 57 && github.event.pull_request.head.ref == 'feature/phase-17-authorized-agent-tool-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-17-authorized-agent-tool-runtime
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - name: Repair strict lint and pin trusted cancellation actor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          root = Path.cwd()
          runtime_path = root / "crates/homeserver-service/src/app/wrapper_runtime.rs"
          runtime = runtime_path.read_text(encoding="utf-8")

          authority_contract = '''#[derive(Debug, Clone)]
          struct ExecutionAuthorityRow {
              plan_id: String,
              step_id: String,
              agent_id: String,
              wrapper_id: String,
              connection_id: String,
              tool_key: String,
              sequence_number: i64,
              adapter_key: String,
              action_type: String,
              tool_restrictions_json: String,
              policy_id: String,
              risk_class: String,
              approval_mode: String,
              policy_adapter: String,
              policy_state: String,
          }

          fn execution_authority_from_row(row: &Row<'_>) -> rusqlite::Result<ExecutionAuthorityRow> {
              Ok(ExecutionAuthorityRow {
                  plan_id: row.get(0)?,
                  step_id: row.get(1)?,
                  agent_id: row.get(2)?,
                  wrapper_id: row.get(3)?,
                  connection_id: row.get(4)?,
                  tool_key: row.get(5)?,
                  sequence_number: row.get(6)?,
                  adapter_key: row.get(7)?,
                  action_type: row.get(8)?,
                  tool_restrictions_json: row.get(9)?,
                  policy_id: row.get(10)?,
                  risk_class: row.get(11)?,
                  approval_mode: row.get(12)?,
                  policy_adapter: row.get(13)?,
                  policy_state: row.get(14)?,
              })
          }

          '''
          struct_marker = "#[derive(Debug)]\nstruct AdapterExecution"
          if "struct ExecutionAuthorityRow" not in runtime:
              if runtime.count(struct_marker) != 1:
                  raise SystemExit("unexpected execution authority insertion marker")
              runtime = runtime.replace(struct_marker, authority_contract + struct_marker, 1)

          prepare = '''fn prepare_execution(
              state: &AppState,
              worker_id: &str,
              job: &wrapper_jobs::JobSummary,
          ) -> Result<ExecutionContext> {
              ensure!(
                  job.submitted_by_type == "agent",
                  "runtime job is not agent-submitted"
              );
              let connection = state.connection()?;
              let transaction = connection.unchecked_transaction()?;
              ensure!(
                  wrapper_agents::agent_job_authority_is_current_tx(&transaction, &job.job_id)?,
                  "runtime job agent authority changed"
              );
              let authority = transaction.query_row(
                  "SELECT s.plan_id,s.step_id,p.agent_id,j.wrapper_id,j.connection_id,s.tool_key,s.sequence_number,s.adapter_key,s.action_type,a.tool_restrictions_json,e.policy_id,e.risk_class,e.approval_mode,e.tool_adapter,e.state FROM agent_runtime_plan_steps s JOIN agent_runtime_plans p ON p.plan_id=s.plan_id JOIN wrapper_jobs j ON j.job_id=s.job_id JOIN agent_job_bindings b ON b.job_id=j.job_id JOIN homeserver_agents a ON a.agent_id=b.agent_id JOIN agent_execution_policies e ON e.agent_id=a.agent_id AND e.action_type=s.action_type WHERE s.job_id=?1 AND s.state IN ('queued','leased') AND p.state IN ('queued','running') AND e.state='active' AND e.not_before_utc<=?2 AND e.expires_at_utc>?2",
                  params![job.job_id, now_utc()],
                  execution_authority_from_row,
              )?;
              ensure!(
                  authority.agent_id == job.submitted_by_id,
                  "runtime plan agent does not match the job submitter"
              );
              let tool = read_tool_tx(&transaction, &authority.tool_key)?;
              ensure!(tool.state == "active", "runtime tool is not active");
              ensure!(
                  tool.adapter_key == authority.adapter_key,
                  "runtime step adapter changed"
              );
              ensure!(
                  authority.policy_adapter == tool.adapter_key,
                  "agent policy adapter does not match the runtime tool"
              );
              ensure!(
                  authority.risk_class == tool.risk_class,
                  "agent policy risk class does not match the runtime tool"
              );
              ensure!(
                  authority.policy_state == "active",
                  "agent execution policy is not active"
              );
              ensure!(
                  tool.allowed_job_types
                      .iter()
                      .any(|value| value == &job.job_type),
                  "runtime tool does not allow this job type"
              );
              ensure!(
                  job.max_execution_seconds <= tool.max_execution_seconds,
                  "runtime job execution limit exceeds the tool catalog limit"
              );
              let incomplete_predecessors: i64 = transaction.query_row(
                  "SELECT COUNT(*) FROM agent_runtime_plan_steps WHERE plan_id=?1 AND sequence_number<?2 AND state<>'completed'",
                  params![authority.plan_id, authority.sequence_number],
                  |result| result.get(0),
              )?;
              ensure!(
                  incomplete_predecessors == 0,
                  "runtime plan step cannot execute before its predecessors"
              );
              enforce_tool_restrictions(
                  &authority.tool_restrictions_json,
                  &tool.adapter_key,
              )?;
              enforce_autonomy_and_approval(
                  &transaction,
                  &authority.agent_id,
                  &authority.risk_class,
                  &authority.approval_mode,
                  &tool.approval_requirement,
              )?;
              enforce_policy_execution_limit(
                  &transaction,
                  &authority.agent_id,
                  &authority.action_type,
                  &authority.policy_id,
              )?;
              let attempt_number: i64 = transaction.query_row(
                  "SELECT COALESCE(MAX(attempt_number),0)+1 FROM agent_runtime_attempts WHERE step_id=?1",
                  params![authority.step_id],
                  |result| result.get(0),
              )?;
              let attempt_id = Uuid::new_v4().to_string();
              let now = now_utc();
              transaction.execute(
                  "UPDATE agent_runtime_plans SET state='running',updated_at_utc=?1 WHERE plan_id=?2 AND state='queued'",
                  params![now, authority.plan_id],
              )?;
              transaction.execute(
                  "UPDATE agent_runtime_plan_steps SET state='running',started_at_utc=COALESCE(started_at_utc,?1),updated_at_utc=?1 WHERE step_id=?2",
                  params![now, authority.step_id],
              )?;
              transaction.execute(
                  "INSERT INTO agent_runtime_attempts (attempt_id,plan_id,step_id,job_id,worker_id,attempt_number,state,started_at_utc) VALUES (?1,?2,?3,?4,?5,?6,'running',?7)",
                  params![attempt_id, authority.plan_id, authority.step_id, job.job_id, worker_id, attempt_number, now],
              )?;
              record_event_tx(
                  &transaction,
                  EventEvidence {
                      plan_id: Some(&authority.plan_id),
                      step_id: Some(&authority.step_id),
                      job_id: Some(&job.job_id),
                      agent_id: Some(&authority.agent_id),
                      event_type: "agent.runtime_step_started",
                      outcome: "success",
                      actor_type: "worker",
                      actor_id: worker_id,
                      detail_code: "authority_revalidated",
                      metadata: json!({
                          "tool_key": &tool.tool_key,
                          "adapter_key": &tool.adapter_key,
                          "policy_id": &authority.policy_id,
                          "sequence_number": authority.sequence_number,
                          "private_input_exposed": false
                      }),
                  },
              )?;
              transaction.commit()?;
              Ok(ExecutionContext {
                  plan_id: authority.plan_id,
                  step_id: authority.step_id,
                  agent_id: authority.agent_id,
                  wrapper_id: authority.wrapper_id,
                  connection_id: authority.connection_id,
                  tool,
                  action_type: authority.action_type,
                  attempt_id,
                  attempt_number: attempt_number.max(1) as u32,
              })
          }
          '''
          start = runtime.index("fn prepare_execution(")
          end = runtime.index("\nfn enforce_autonomy_and_approval(", start)
          runtime = runtime[:start] + prepare + runtime[end:]
          runtime_path.write_text(runtime, encoding="utf-8")

          tauri_path = root / "src-tauri/src/runtime.rs"
          tauri = tauri_path.read_text(encoding="utf-8")
          if "LOCAL_CONTROL_CENTER_ACTOR" not in tauri:
              tauri = tauri.replace(
                  "use serde_json::{json, Value};\n",
                  "use serde_json::{json, Value};\n\nconst LOCAL_CONTROL_CENTER_ACTOR: &str = \"local_control_center\";\n",
                  1,
              )
          tauri = tauri.replace(
              "    actor_user_id: String,\n    confirmation: String,",
              "    confirmation: String,",
              1,
          )
          tauri = tauri.replace(
              '            "actor_user_id": actor_user_id,',
              '            "actor_user_id": LOCAL_CONTROL_CENTER_ACTOR,',
              1,
          )
          tauri_path.write_text(tauri, encoding="utf-8")

          ui_path = root / "src/agent-runtime-control-center.js"
          ui = ui_path.read_text(encoding="utf-8")
          ui = ui.replace('const LOCAL_ACTOR = "local_control_center";\n', "", 1)
          ui = ui.replace("      actorUserId: LOCAL_ACTOR,\n", "", 1)
          ui_path.write_text(ui, encoding="utf-8")

          validator_path = root / "scripts/validate-wrapper-runtime.py"
          validator = validator_path.read_text(encoding="utf-8")
          marker = 'for surface in [\n'
          checks = '''require(
              'const LOCAL_CONTROL_CENTER_ACTOR: &str = "local_control_center"' in tauri_runtime,
              "runtime cancellation actor is not pinned in the trusted bridge",
          )
          require(
              '"actor_user_id": LOCAL_CONTROL_CENTER_ACTOR' in tauri_runtime,
              "trusted runtime cancellation does not use the pinned actor",
          )
          require(
              "actorUserId" not in control_center,
              "runtime UI can supply its own cancellation audit actor",
          )
          require(
              "struct ExecutionAuthorityRow" in source
              and "execution_authority_from_row" in source,
              "runtime execution authority is not represented by a typed row",
          )

          '''
          if "runtime cancellation actor is not pinned" not in validator:
              if validator.count(marker) != 1:
                  raise SystemExit("unexpected validator surface marker")
              validator = validator.replace(marker, checks + marker, 1)
          validator_path.write_text(validator, encoding="utf-8")

          test_path = root / "crates/homeserver-service/tests/phase17_runtime_contract.rs"
          tests = test_path.read_text(encoding="utf-8")
          if '"struct ExecutionAuthorityRow"' not in tests:
              tests = tests.replace(
                  '        "wrapper_agents::agent_job_authority_is_current_tx",\n',
                  '        "wrapper_agents::agent_job_authority_is_current_tx",\n        "struct ExecutionAuthorityRow",\n        "execution_authority_from_row",\n',
                  1,
              )
          test_path.write_text(tests, encoding="utf-8")
          PY
          cargo fmt --all
          node --check src/agent-runtime-control-center.js
          python scripts/validate-wrapper-runtime.py
          cargo test -p microgifter-homeserver-service
          cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase17-final-repair-once.yml
          git add -A
          git commit -m "Repair Phase 17 strict lint and cancellation identity"
          git push origin HEAD:feature/phase-17-authorized-agent-tool-runtime
