name: Repair header notification menu

on:
  push:
    branches:
      - hotfix/agent-chat-dead-controls-20260728
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: repair-header-notification-menu
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hotfix/agent-chat-dead-controls-20260728
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Implement notification dropdown
        run: python scripts/repair-header-notification-menu.py

      - name: Validate frontend and notification contract
        run: |
          npm ci
          npm run check:frontend
          npm run build

      - name: Commit clean product repair
        run: |
          rm .github/workflows/repair-header-notification-menu.yml
          rm scripts/repair-header-notification-menu.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.js src/styles.css package.json scripts/validate-notification-menu.py .github/workflows/repair-header-notification-menu.yml scripts/repair-header-notification-menu.py
          git commit -m "Add interactive header notification dropdown"
          git push origin HEAD:hotfix/agent-chat-dead-controls-20260728
