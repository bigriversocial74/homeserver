name: Repair Phase 22 Connection Guards

on:
  push:
    branches:
      - feature/unified-homeserver-agent-orchestration
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: repair-phase22-connection-guards
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/unified-homeserver-agent-orchestration
          fetch-depth: 0
      - name: Apply connection guard repair
        run: python .github/scripts/repair_phase22_connection_guards.py
      - name: Format and validate
        run: |
          cargo fmt --all
          python scripts/validate-unified-agent-orchestration.py
      - name: Remove temporary repair files
        run: |
          rm -f .github/scripts/repair_phase22_connection_guards.py
          rm -f .github/workflows/_repair_phase22_connection_guards.yml
      - name: Commit permanent repair
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Repair Agent integration connection guards"
          git push origin HEAD:feature/unified-homeserver-agent-orchestration
