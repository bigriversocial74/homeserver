name: One-time service registration repair

on:
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/one-time-service-registration-repair.yml'
      - 'crates/homeserver-updater/src/main.rs'

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'audit/full-production-hardening-20260725' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/full-production-hardening-20260725
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Preserve existing rollback service command
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/homeserver-updater/src/main.rs")
          source = path.read_text(encoding="utf-8")
          command_lines = '            "binPath=".to_owned(),\n            binary_command,\n'
          action_text = '        "configure restored HomeServer service",\n'
          if source.count(command_lines) != 1:
              raise SystemExit(f"Expected one rollback binPath block, found {source.count(command_lines)}")
          if source.count(action_text) != 1:
              raise SystemExit(f"Expected one rollback configuration label, found {source.count(action_text)}")
          source = source.replace(command_lines, "", 1)
          source = source.replace(
              action_text,
              '        "configure restored HomeServer service startup",\n',
              1,
          )
          path.write_text(source, encoding="utf-8")

      - name: Format and commit scoped repair
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-updater/src/main.rs
          git diff --cached --check
          git commit -m "Preserve rollback service command"
          git push origin HEAD:audit/full-production-hardening-20260725
