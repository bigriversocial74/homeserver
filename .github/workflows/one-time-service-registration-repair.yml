name: One-time service registration repair

on:
  push:
    branches:
      - audit/full-production-hardening-20260725

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: audit/full-production-hardening-20260725
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Preserve existing rollback service command
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/homeserver-updater/src/main.rs")
          source = path.read_text(encoding="utf-8")
          old = '''    run_sc(
              vec![
                  "config".to_owned(),
                  service_name.to_owned(),
                  "binPath=".to_owned(),
                  binary_command,
                  "start=".to_owned(),
                  "delayed-auto".to_owned(),
              ],
              "configure restored HomeServer service",
          )?;
          '''
          new = '''    run_sc(
              vec![
                  "config".to_owned(),
                  service_name.to_owned(),
                  "start=".to_owned(),
                  "delayed-auto".to_owned(),
              ],
              "configure restored HomeServer service startup",
          )?;
          '''
          if old not in source:
              raise SystemExit("Expected rollback service configuration block was not found")
          path.write_text(source.replace(old, new, 1), encoding="utf-8")

      - name: Format and commit scoped repair
        shell: bash
        run: |
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-updater/src/main.rs
          git diff --cached --check
          git commit -m "Preserve rollback service command"
          git push origin HEAD:audit/full-production-hardening-20260725
