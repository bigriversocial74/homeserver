name: Phase 16E Typed Lint Repair PR

on:
  pull_request:
    paths:
      - .github/workflows/phase16e-lint-repair-pr.yml

permissions:
  contents: write

concurrency:
  group: homeserver-phase16e-lint-repair-pr
  cancel-in-progress: true

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feature/phase-16e-private-knowledge-egress'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-16e-private-knowledge-egress
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - name: Run verified typed repair
        shell: bash
        run: |
          set -euo pipefail
          python scripts/phase16e-typed-lint-repair.py
          cargo fmt --all
          python scripts/validate-wrapper-privacy.py
          cargo test -p microgifter-homeserver-service
          cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings
      - name: Commit clean typed repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase16e-lint-repair.yml \
            .github/workflows/phase16e-lint-repair-pr.yml \
            scripts/phase16e-typed-lint-repair.py
          git add crates/homeserver-service/src/app/wrapper_privacy.rs \
            crates/homeserver-service/src/app/wrapper_jobs_submit.rs
          git diff --cached --check
          git commit -m 'Refine Phase 16E privacy authority types'
          git push origin HEAD:feature/phase-16e-private-knowledge-egress
