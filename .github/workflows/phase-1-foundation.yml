name: HomeServer Production Quality

on:
  pull_request:
  push:
    branches:
      - feature/phase-15-federated-settings-shared-control-center

permissions:
  contents: write

jobs:
  wire-signed-phase15:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-15-federated-settings-shared-control-center
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Wire signed settings verification
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          app = Path('crates/homeserver-service/src/app.rs')
          text = app.read_text()
          anchor = '#[path = "federated_settings.rs"]\nmod federated_settings;\n'
          addition = anchor + '\n#[path = "federated_settings_signature.rs"]\nmod federated_settings_signature;\n'
          if 'mod federated_settings_signature;' not in text:
              if anchor not in text:
                  raise SystemExit('federated settings module anchor not found')
              text = text.replace(anchor, addition, 1)
          app.write_text(text)

          source = Path('crates/homeserver-service/src/federated_settings.rs')
          text = source.read_text()
          old_fields = '    snapshot_hash: String,\n    #[serde(default)]\n    replayed: bool,\n'
          new_fields = ('    snapshot_hash: String,\n'
                        '    signed_document: String,\n'
                        '    signature: String,\n'
                        '    signing_key_id: String,\n'
                        '    signature_algorithm: String,\n'
                        '    signed_document_hash: String,\n'
                        '    #[serde(default)]\n'
                        '    replayed: bool,\n')
          if old_fields in text:
              text = text.replace(old_fields, new_fields, 1)
          elif 'signed_document: String' not in text:
              raise SystemExit('cloud snapshot field anchor not found')

          old_call = '    validate_cloud_snapshot(&identity, &response)?;\n'
          new_call = '    validate_cloud_snapshot(state, &identity, &response)?;\n'
          if old_call in text:
              text = text.replace(old_call, new_call, 1)
          elif new_call not in text:
              raise SystemExit('cloud snapshot validation call not found')

          old_fn = 'fn validate_cloud_snapshot(identity: &DeviceIdentity, cloud: &CloudSnapshot) -> Result<()> {\n'
          new_fn = ('fn validate_cloud_snapshot(\n'
                    '    state: &AppState,\n'
                    '    identity: &DeviceIdentity,\n'
                    '    cloud: &CloudSnapshot,\n'
                    ') -> Result<()> {\n'
                    '    super::federated_settings_signature::verify(\n'
                    '        super::federated_settings_signature::SignedSnapshotEvidence {\n'
                    '            public_key_base64: &state.config.vp3_lease_public_key_base64(),\n'
                    '            expected_key_id: &state.config.vp3_lease_key_id(),\n'
                    '            algorithm: &cloud.signature_algorithm,\n'
                    '            key_id: &cloud.signing_key_id,\n'
                    '            signed_document: &cloud.signed_document,\n'
                    '            signature: &cloud.signature,\n'
                    '            signed_document_hash: &cloud.signed_document_hash,\n'
                    '            schema: &cloud.schema,\n'
                    '            account_id: cloud.account_id,\n'
                    '            device_public_id: identity.device_public_id.as_str(),\n'
                    '            max_revision: cloud.max_revision,\n'
                    '            snapshot_hash: &cloud.snapshot_hash,\n'
                    '            settings: serde_json::to_value(&cloud.settings)?,\n'
                    '        },\n'
                    '    )?;\n')
          if old_fn in text:
              text = text.replace(old_fn, new_fn, 1)
          elif 'SignedSnapshotEvidence' not in text:
              raise SystemExit('cloud snapshot validation function not found')
          source.write_text(text)
          '@ | python -
          cargo fmt --all
      - name: Restore permanent workflow and commit signed verification
        shell: pwsh
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/phase-1-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/phase-1-foundation.yml crates/homeserver-service/src/app.rs crates/homeserver-service/src/federated_settings.rs crates/homeserver-service/src/federated_settings_signature.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Verify signed VP3 federated settings snapshots"
          git push origin HEAD:feature/phase-15-federated-settings-shared-control-center
