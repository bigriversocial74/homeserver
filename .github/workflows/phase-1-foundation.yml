name: Phase 3B Source Canonicalizer

on:
  push:
    branches:
      - feature/phase-3b-signed-updates-20260724

permissions:
  contents: write

concurrency:
  group: phase3b-source-canonicalizer
  cancel-in-progress: true

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3b-signed-updates-20260724

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Apply canonical source changes
        run: |
          python scripts/phase3b_canonicalize.py
          cargo fmt --all
          git diff --check

      - name: Commit canonical source
        run: |
          git rm scripts/phase3b_canonicalize.py
          git rm .github/workflows/phase-3b-fixture-result-hardening.yml 2>/dev/null || true
          git add crates/homeserver-service/src/backup.rs crates/homeserver-service/src/update_store.rs crates/homeserver-service/src/update.rs crates/homeserver-service/src/update_apply.rs crates/homeserver-updater/src/main.rs src-tauri/src/lib.rs
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          git commit -m "Canonicalize Phase 3B Windows update lifecycle"
          git push origin HEAD:feature/phase-3b-signed-updates-20260724
