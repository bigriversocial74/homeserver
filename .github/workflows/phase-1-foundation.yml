name: Phase 3B Authenticode Trace

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase3b-authenticode-trace
  cancel-in-progress: true

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3b-signed-updates-20260724
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Apply staged Authenticode tracing
        run: |
          python scripts/phase3b_authenticode_trace.py
          cargo fmt --all
          git diff --check

      - name: Commit traced source
        run: |
          git rm scripts/phase3b_authenticode_trace.py
          git add crates/homeserver-updater/src/main.rs scripts/smoke-test-updater.ps1
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          git commit -m "Trace staged Phase 3B Authenticode verification"
          git push origin HEAD:feature/phase-3b-signed-updates-20260724
