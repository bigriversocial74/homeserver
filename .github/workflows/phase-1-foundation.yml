name: HomeServer Production Quality

on:
  pull_request:
  push:
    branches:
      - main
      - feature/phase-3-backup-recovery-updates-20260724

concurrency:
  group: homeserver-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.toml', '**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: windows-cargo-

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify dependency lock stability
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile
          git diff --exit-code -- Cargo.lock package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Frontend and script syntax
        shell: pwsh
        run: |
          npm run check:frontend
          $scripts = Get-ChildItem scripts -Filter "*.ps1"
          foreach ($script in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell syntax validation failed for $($script.Name)"
            }
          }

      - name: Frontend build
        run: npm run build

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Prepare generated Windows resources
        run: npm run prepare:icons

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Build Windows service resource
        shell: pwsh
        run: |
          cargo build --release --package microgifter-homeserver-service --locked *> service-build.log
          $buildCode = $LASTEXITCODE
          if ($buildCode -ne 0) {
            Get-Content service-build.log -Tail 160
            exit $buildCode
          }
          Get-Content service-build.log -Tail 20

      - name: Upload Windows service compiler log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: service-build-log
          path: service-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Stage Windows service for desktop targets
        shell: pwsh
        run: Copy-Item target/release/microgifter-homeserver-service.exe src-tauri/resources/microgifter-homeserver-service.exe -Force

      - name: Full workspace tests
        shell: pwsh
        run: |
          cargo test --workspace --locked *> cargo-test.log
          $testCode = $LASTEXITCODE
          if ($testCode -ne 0) {
            Get-Content cargo-test.log -Tail 180
            exit $testCode
          }
          Get-Content cargo-test.log -Tail 40

      - name: Upload workspace test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-test-log
          path: cargo-test.log
          if-no-files-found: warn
          retention-days: 7

      - name: Full workspace lint
        shell: pwsh
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings *> cargo-clippy.log
          $lintCode = $LASTEXITCODE
          if ($lintCode -ne 0) {
            Get-Content cargo-clippy.log -Tail 180
            exit $lintCode
          }
          Get-Content cargo-clippy.log -Tail 30

      - name: Upload workspace lint log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cargo-clippy-log
          path: cargo-clippy.log
          if-no-files-found: warn
          retention-days: 7

      - name: Encrypted backup and restore console smoke test
        shell: pwsh
        run: ./scripts/smoke-test-service.ps1

      - name: Build NSIS installer
        shell: pwsh
        run: |
          npm run tauri:build *> tauri-build.log
          $buildCode = $LASTEXITCODE
          if ($buildCode -ne 0) {
            Get-Content tauri-build.log -Tail 180
            exit $buildCode
          }

      - name: Upload Tauri build log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tauri-build-log
          path: tauri-build.log
          if-no-files-found: warn
          retention-days: 7

      - name: Normalize installer filename
        shell: pwsh
        run: |
          $bundle = "target/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Copy-Item $installer.FullName "$bundle/Microgifter-HomeServer-Setup.exe" -Force

      - name: Installed LocalSystem backup and uninstall smoke test
        shell: pwsh
        run: ./scripts/smoke-test-installer.ps1 -InstallerPath target/release/bundle/nsis/Microgifter-HomeServer-Setup.exe

      - name: Upload validated installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Microgifter-HomeServer-Setup
          path: target/release/bundle/nsis/Microgifter-HomeServer-Setup.exe
          if-no-files-found: error
          retention-days: 14
