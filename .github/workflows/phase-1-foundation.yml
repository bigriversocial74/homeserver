name: Phase 3B API Status Repair

on:
  push:
    branches:
      - feature/phase-3b-signed-updates-20260724

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3b-signed-updates-20260724

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Apply API status repair
        run: |
          python scripts/phase3b_api_status_fix.py
          cargo fmt --all
          git diff --check

      - name: Commit repair
        run: |
          git rm scripts/phase3b_api_status_fix.py
          git add crates/homeserver-service/src/update_store.rs crates/homeserver-service/src/http.rs
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          git commit -m "Classify absent verified updates as validation errors"
          git push origin HEAD:feature/phase-3b-signed-updates-20260724
