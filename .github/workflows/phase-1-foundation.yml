name: HomeServer Production Quality

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: homeserver-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Canonicalize repaired Phase 2 source
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile
          cargo fmt --all
          git add Cargo.lock package-lock.json "*.rs" "crates/**/*.rs" "src-tauri/**/*.rs"
          if (git diff --cached --quiet) {
            Write-Host "Canonical files are already stable."
            exit 0
          }
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          git commit -m "Refresh Phase 2 lockfile after core contract repair"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
