name: Restore Phase 3B Production Workflow

on:
  push:
    branches:
      - feature/phase-3b-signed-updates-20260724

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3b-signed-updates-20260724
          fetch-depth: 0

      - name: Restore immutable production workflow
        run: |
          git show a5e6fe7546a6fba362477f27c85e2a6655351136:.github/workflows/phase-1-foundation.yml > .github/workflows/phase-1-foundation.yml
          git diff --check
          git add .github/workflows/phase-1-foundation.yml
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          git commit -m "Restore strict Phase 3B production workflow"
          git push origin HEAD:feature/phase-3b-signed-updates-20260724
