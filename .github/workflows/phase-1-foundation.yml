name: Phase 20 Controlled Integration Builder

on:
  pull_request:
    paths:
      - .github/workflows/phase-1-foundation.yml
      - scripts/phase20-integrate.py

permissions:
  contents: write

concurrency:
  group: phase20-controlled-builder
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-20-authorized-model-routing-inference-governance
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply exact Phase 20 integration
        run: |
          python scripts/phase20-integrate.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'{label} anchor is missing')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('scripts/validate-model-inference-governance.py')
          replace_once(
              path,
              'forbid(frontend, ["MutationObserver", "output_text", "private_results"], "Agent Runtime governance UI")',
              'forbid(frontend, ["MutationObserver", "output_text", "output: receipt.output"], "Agent Runtime governance UI")',
              'Phase 20 validator repair',
          )

          path = Path('scripts/validate-openrouter-provider.py')
          text = path.read_text(encoding='utf-8')
          old = 'agent = read("crates/homeserver-service/src/agent_runtime.rs")\napp = read('
          new = 'agent = read("crates/homeserver-service/src/agent_runtime.rs")\ngovernance = read("crates/homeserver-service/src/inference_governance.rs")\napp = read('
          if old not in text:
              raise SystemExit('OpenRouter validator source anchor is missing')
          text = text.replace(old, new, 1)
          old = 'require(agent, "openrouter_provider::generate_agent_response", "Agent Workspace routing")'
          new = 'require(agent, "inference_governance::infer", "Agent Workspace governed routing")\nrequire(governance, "openrouter_provider::generate_governed_response", "governed OpenRouter adapter")'
          if old not in text:
              raise SystemExit('OpenRouter validator routing anchor is missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('crates/homeserver-service/src/agent_runtime.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        &request,
        &user_message_id,
        GroundedResponseContext {'''
          new = '''        &request,
        &user_message_id,
        actor_type,
        actor_id,
        GroundedResponseContext {'''
          if old not in text:
              raise SystemExit('Agent inference call actor anchor is missing')
          text = text.replace(old, new, 1)
          old = '''    request: &AgentPromptRequest,
    user_message_id: &str,
    context: GroundedResponseContext<'_>,'''
          new = '''    request: &AgentPromptRequest,
    user_message_id: &str,
    actor_type: &str,
    actor_id: &str,
    context: GroundedResponseContext<'_>,'''
          if old not in text:
              raise SystemExit('Agent inference signature actor anchor is missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          path = Path('crates/homeserver-service/src/inference_governance.rs')
          text = path.read_text(encoding='utf-8')
          old = '''        statement
            .query_map([], |row| row.get::<_,String>(0))?
            .collect::<rusqlite::Result<Vec<_>>>()?
    };'''
          new = '''        let rows = statement
            .query_map([], |row| row.get::<_,String>(0))?
            .collect::<rusqlite::Result<Vec<_>>>()?;
        rows
    };'''
          if text.count(old) != 2:
              raise SystemExit(f'Expected two owned request-list anchors, found {text.count(old)}')
          text = text.replace(old, new, 2)

          def own_query_rows(source: str, function_name: str, next_function_name: str) -> str:
              start = source.index(f'fn {function_name}(')
              end = source.index(f'fn {next_function_name}(', start)
              segment = source[start:end]
              if '    statement\n' not in segment:
                  raise SystemExit(f'{function_name}: statement anchor is missing')
              segment = segment.replace('    statement\n', '    let rows = statement\n', 1)
              old_tail = '''        .collect::<rusqlite::Result<Vec<_>>>()
        .map_err(Into::into)
}'''
              new_tail = '''        .collect::<rusqlite::Result<Vec<_>>>()?;
    Ok(rows)
}'''
              if old_tail not in segment:
                  raise SystemExit(f'{function_name}: owned result tail is missing')
              segment = segment.replace(old_tail, new_tail, 1)
              return source[:start] + segment + source[end:]

          text = own_query_rows(text, 'read_policies', 'read_requests')
          text = own_query_rows(text, 'read_requests', 'read_receipts')
          text = own_query_rows(text, 'read_receipts', 'read_events')
          text = own_query_rows(text, 'read_events', 'map_policy')
          path.write_text(text, encoding='utf-8')
          PY
          cargo fmt --all
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate Phase 20 and retained contracts
        run: |
          python scripts/validate-model-inference-governance.py
          python scripts/validate-authorized-scheduling.py
          python scripts/validate-supervised-orchestration.py
          python scripts/validate-wrapper-agents.py
          python scripts/validate-wrapper-runtime.py
          python scripts/validate-wrapper-privacy.py
          npm run check:frontend
          npm run build
      - name: Validate native implementation
        run: |
          cargo fmt --all -- --check
          cargo test -p microgifter-homeserver-service
          cargo test -p microgifter-homeserver-service --test phase20_model_inference_governance_contract
          cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings -A unused-imports
      - name: Commit clean permanent Phase 20 implementation
        run: |
          rm -f scripts/phase20-integrate.py
          rm -f docs/phase-20-staging-note.md
          rm -f scripts/phase20-builder-trigger.txt
          rm -f scripts/.phase20-trigger
          rm -f docs/.phase20-pr-trigger
          rm -f scripts/phase20-pr-open-trigger.txt
          rm -f scripts/phase20-cleanup-list.txt
          rm -f scripts/phase20-open-pr-now.txt
          git checkout origin/main -- .github/workflows/phase-1-foundation.yml
          git add -A
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Build Phase 20 authorized model routing and inference governance"
          git push origin HEAD:feature/phase-20-authorized-model-routing-inference-governance
