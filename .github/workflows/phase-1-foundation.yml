name: HomeServer Production Quality

on:
  pull_request:
  push:
    branches:
      - main
      - feature/vp3-http-client-v1-20260729

concurrency:
  group: homeserver-quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  recover-vp3-client:
    if: github.ref == 'refs/heads/feature/vp3-http-client-v1-20260729' || github.head_ref == 'feature/vp3-http-client-v1-20260729'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/vp3-http-client-v1-20260729
          fetch-depth: 0
      - name: Generate and normalize VP3 product files
        run: |
          python - <<'PY'
          from pathlib import Path

          temp = Path('.tmp')
          temp.mkdir(exist_ok=True)

          def extract(source_path: str, marker: str, output_path: Path) -> None:
              source = Path(source_path).read_text().splitlines()
              marker_index = next(i for i, line in enumerate(source) if marker in line)
              start = next(i for i in range(marker_index, len(source)) if "python - <<'PY'" in source[i] or "cat > /tmp/" in source[i]) + 1
              end = next(i for i in range(start, len(source)) if source[i] == '          PY')
              prefix = ' ' * 10
              output = []
              triple = None
              for raw in source[start:end]:
                  candidate = raw[len(prefix):] if raw.startswith(prefix) else raw
                  if triple is None:
                      output.append(candidate)
                      for token in ("'''", '\"\"\"'):
                          if candidate.count(token) % 2 == 1:
                              triple = token
                              break
                  else:
                      output.append(candidate if raw.startswith(prefix) and triple in raw else raw)
                      if raw.count(triple) % 2 == 1:
                          triple = None
              if triple is not None:
                  raise SystemExit(f'{marker} contains an unterminated source string')
              output_path.write_text('\n'.join(output) + '\n')

          extract('.github/workflows/build-vp3-http-client-v1.yml', "cat > /tmp/build_vp3_client.py <<'PY'", temp / 'build_vp3_client.py')
          extract('.github/workflows/run-vp3-http-client-builder.yml', 'Normalize generated validator and Rust integration', temp / 'normalize_vp3_client.py')
          PY
          test -s .tmp/build_vp3_client.py
          test -s .tmp/normalize_vp3_client.py
          python .tmp/build_vp3_client.py
          python .tmp/normalize_vp3_client.py
      - name: Restore permanent workflow and commit product tree
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/phase-1-foundation.yml
          rm -rf .tmp
          rm -f .github/workflows/build-vp3-http-client-v1.yml
          rm -f .github/workflows/run-vp3-http-client-builder.yml
          rm -f .github/workflows/vp3-builder-bootstrap.yml
          rm -f .vp3-builder-bootstrap .vp3-heavy-builder-started
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Stage VP3 HomeServer HTTP client product tree"
          git push origin HEAD:feature/vp3-http-client-v1-20260729
