name: Phase 3B Rollback Hardening

on:
  pull_request:
  push:
    branches:
      - feature/phase-3b-signed-updates-20260724

permissions:
  contents: write

concurrency:
  group: phase3b-rollback-hardening-${{ github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3b-signed-updates-20260724
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Apply updater rollback hardening
        run: |
          python scripts/phase3b_rollback_hardening_runner.py
          cargo fmt --all
          git diff --check

      - name: Restore production validation and commit
        run: |
          git show c45a91f1986100bb84371dd65dbe6b4023260e42:.github/workflows/phase-1-foundation.yml > .github/workflows/phase-1-foundation.yml
          git rm scripts/phase3b_rollback_hardening.py scripts/phase3b_rollback_hardening_runner.py
          git add crates/homeserver-updater/src/main.rs .github/workflows/phase-1-foundation.yml
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          git commit -m "Harden Phase 3B installed rollback lifecycle"
          git push origin HEAD:feature/phase-3b-signed-updates-20260724
