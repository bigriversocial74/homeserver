name: Phase 3B Rustfmt Canonicalizer

on:
  push:
    branches:
      - feature/phase-3b-signed-updates-20260724

permissions:
  contents: write

concurrency:
  group: phase3b-rustfmt-canonicalizer
  cancel-in-progress: true

jobs:
  format:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3b-signed-updates-20260724

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Format full Rust workspace
        shell: pwsh
        run: |
          cargo fmt --all
          git diff --check

      - name: Commit canonical formatting
        shell: pwsh
        run: |
          git add "*.rs" "crates/**/*.rs" "src-tauri/**/*.rs"
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          if (git diff --cached --quiet) {
            Write-Host "Rust source is already formatted."
            exit 0
          }
          git commit -m "Format Phase 3B signed update source"
          git push origin HEAD:feature/phase-3b-signed-updates-20260724
