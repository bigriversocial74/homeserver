name: HomeServer Production Quality

on:
  push:
    branches:
      - feature/phase-15-federated-settings-shared-control-center

permissions:
  contents: write

jobs:
  bind-phase15-sync-result:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-15-federated-settings-shared-control-center
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Bind signed merge instructions
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          source = Path('crates/homeserver-service/src/federated_settings.rs')
          text = source.read_text()
          old = '            settings: serde_json::to_value(&cloud.settings)?,\n'
          new = ('            generated_at: &cloud.generated_at,\n'
                 '            settings: serde_json::to_value(&cloud.settings)?,\n'
                 '            replayed: cloud.replayed,\n'
                 '            applied: serde_json::to_value(&cloud.applied)?,\n'
                 '            conflicts: serde_json::to_value(&cloud.conflicts)?,\n')
          if old not in text:
              if 'applied: serde_json::to_value(&cloud.applied)?' in text:
                  raise SystemExit(0)
              raise SystemExit('signed snapshot evidence anchor was not found')
          source.write_text(text.replace(old, new, 1))
          '@ | python -
          cargo fmt --all
      - name: Restore permanent workflow and commit binding
        shell: pwsh
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/phase-1-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/phase-1-foundation.yml crates/homeserver-service/src/federated_settings.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Bind signed VP3 settings merge instructions"
          git push origin HEAD:feature/phase-15-federated-settings-shared-control-center
