name: Phase 19 Controlled Builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase19-controlled-builder
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: feature/phase-19-authorized-scheduling-event-triggers
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply Phase 19 integration patches
        run: |
          python scripts/phase19-integration-builder.py
          cargo fmt --all
      - name: Validate Phase 19 and retained boundaries
        run: |
          npm ci
          python scripts/validate-authorized-scheduling.py
          python scripts/validate-supervised-orchestration.py
          python scripts/validate-wrapper-runtime.py
          python scripts/validate-wrapper-agents.py
          python scripts/validate-wrapper-privacy.py
          npm run check:frontend
          npm run build
          cargo fmt --all -- --check
          cargo test -p microgifter-homeserver-service
          cargo test -p microgifter-homeserver-service --test phase19_authorized_scheduling_contract
          cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings -A dead_code -A unused_imports -A unused_variables -A unused_mut
      - name: Commit permanent Phase 19 implementation
        shell: bash
        run: |
          rm -f scripts/phase19-integration-builder.py
          rm -rf scripts/__pycache__
          git checkout origin/main -- .github/workflows/phase-1-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build Phase 19 authorized scheduling and event triggers"
          git push
