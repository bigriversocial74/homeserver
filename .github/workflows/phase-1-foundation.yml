name: HomeServer Phase 3A Canonicalization

on:
  push:
    branches:
      - feature/phase-3-backup-recovery-updates-20260724

concurrency:
  group: homeserver-phase3a-canonical-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3-backup-recovery-updates-20260724

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22

      - name: Generate canonical source artifacts
        shell: pwsh
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile
          cargo fmt --all
          git add Cargo.lock package-lock.json "*.rs" "crates/**/*.rs" "src-tauri/**/*.rs"
          if (git diff --cached --quiet) {
            Write-Host "Canonical files are already stable."
            exit 0
          }
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          git commit -m "Canonicalize Phase 3A locks and formatting"
          git push origin HEAD:feature/phase-3-backup-recovery-updates-20260724
