name: HomeServer Production Quality

on:
  push:
    branches:
      - feature/phase-15-federated-settings-shared-control-center
  pull_request:

permissions:
  contents: write

jobs:
  harden-phase15-result:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-15-federated-settings-shared-control-center
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Apply signed-result invariants
        shell: pwsh
        run: |
          @'
          import base64
          from pathlib import Path

          old = base64.b64decode('').decode()
          new = base64.b64decode('').decode()
          path = Path('crates/homeserver-service/src/federated_settings.rs')
          text = path.read_text()
          if old not in text:
              if 'result contains duplicate applied keys' in text:
                  raise SystemExit(0)
              raise SystemExit('signed-result validation anchor not found')
          path.write_text(text.replace(old, new, 1))
          '@ | python -
          cargo fmt --all
      - name: Restore permanent workflow and commit hardening
        shell: pwsh
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/phase-1-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/phase-1-foundation.yml crates/homeserver-service/src/federated_settings.rs
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git commit -m "Harden signed federated settings result validation"
          git push origin HEAD:feature/phase-15-federated-settings-shared-control-center
