name: Phase 21 Trust Hardening Builder

on:
  pull_request:
    paths:
      - .github/workflows/phase-1-foundation.yml
      - scripts/phase21-hardening.py
      - scripts/phase21-hardening-anchor-fix.py
      - scripts/phase21-validator-fix.py
      - database/migrations/0029_tamper_evident_evidence_archive.sql
      - crates/homeserver-service/src/evidence_archive.rs
      - crates/homeserver-service/tests/phase21_evidence_archive_contract.rs
      - scripts/validate-evidence-archive.py
      - src-tauri/Cargo.toml
      - src-tauri/src/lib.rs
      - docs/phase-21-tamper-evident-evidence-archive.md

permissions:
  contents: write

concurrency:
  group: phase21-trust-hardening-builder
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-21-tamper-evident-evidence-archive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libglib2.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            wget
      - name: Apply final Phase 21 trust hardening
        run: |
          python scripts/phase21-validator-fix.py
          python scripts/phase21-hardening-anchor-fix.py
          python scripts/phase21-hardening.py
          cargo fmt --all
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate Phase 21 and retained contracts
        run: |
          python scripts/validate-evidence-archive.py
          python scripts/validate-model-inference-governance.py
          python scripts/validate-authorized-scheduling.py
          python scripts/validate-supervised-orchestration.py
          python scripts/validate-wrapper-runtime.py
          npm run check:frontend
          npm run build
      - name: Validate Rust formatting
        run: cargo fmt --all -- --check
      - name: Test HomeServer service
        run: cargo test -p microgifter-homeserver-service
      - name: Test Phase 21 archive contract
        run: cargo test -p microgifter-homeserver-service --test phase21_evidence_archive_contract
      - name: Prepare CI-only Control Center sidecar placeholders
        run: |
          mkdir -p src-tauri/resources
          : > "$RUNNER_TEMP/phase21-created-resource-placeholders"
          for resource in \
            src-tauri/resources/microgifter-homeserver-service.exe \
            src-tauri/resources/microgifter-homeserver-updater.exe \
            src-tauri/resources/microgifter-homeserver-mcp.exe
          do
            if [ ! -e "$resource" ]; then
              printf 'Phase 21 Linux cargo-check placeholder; never packaged or committed.\n' > "$resource"
              printf '%s\n' "$resource" >> "$RUNNER_TEMP/phase21-created-resource-placeholders"
            fi
          done
      - name: Compile Control Center desktop
        shell: bash
        run: |
          set +e
          cargo check -p microgifter-homeserver-control-center > "$RUNNER_TEMP/control-center-check.log" 2>&1
          status=$?
          if [ "$status" -eq 0 ]; then
            echo "Control Center desktop compilation passed."
          else
            echo "::group::Control Center compiler diagnostic"
            grep -n -A30 -B8 -E 'error(\[E[0-9]+\])?:|could not compile' "$RUNNER_TEMP/control-center-check.log" | tail -n 240 || true
            echo "::endgroup::"
          fi
          exit "$status"
      - name: Strict HomeServer service lint
        run: |
          cargo clippy -p microgifter-homeserver-service --all-targets -- \
            -D warnings \
            -A clippy::needless-return \
            -A clippy::manual-range-contains \
            -A clippy::unnecessary-map-or \
            -A dead-code \
            -A unused-imports
      - name: Commit clean permanent Phase 21 hardening
        run: |
          if [ -f "$RUNNER_TEMP/phase21-created-resource-placeholders" ]; then
            while IFS= read -r resource; do
              [ -n "$resource" ] && rm -f "$resource"
            done < "$RUNNER_TEMP/phase21-created-resource-placeholders"
          fi
          git checkout origin/main -- .github/workflows/phase-1-foundation.yml
          rm -f scripts/phase21-hardening.py scripts/phase21-hardening-anchor-fix.py scripts/phase21-validator-fix.py
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find scripts -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No Phase 21 trust hardening changes were produced."
            exit 1
          fi
          git commit -m "Harden Phase 21 evidence archive trust boundaries"
          git push origin HEAD:feature/phase-21-tamper-evident-evidence-archive
