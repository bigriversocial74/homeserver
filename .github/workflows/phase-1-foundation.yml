name: Phase 21 Controlled Builder

on:
  pull_request:
    paths:
      - .github/workflows/phase-1-foundation.yml
      - scripts/phase21-integrate.py
      - database/migrations/0029_tamper_evident_evidence_archive.sql
      - crates/homeserver-service/src/evidence_archive.rs
      - crates/homeserver-service/tests/phase21_evidence_archive_contract.rs
      - scripts/validate-evidence-archive.py
      - src/agent-runtime-control-center.js
      - src/agent-runtime-control-center.css
      - src-tauri/src/lib.rs
      - src-tauri/src/runtime.rs
      - package.json

permissions:
  contents: write

concurrency:
  group: phase21-controlled-builder
  cancel-in-progress: true

jobs:
  integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-21-tamper-evident-evidence-archive
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply exact Phase 21 integration
        run: |
          python scripts/phase21-integrate.py
          cargo fmt --all
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate Phase 21 and retained contracts
        run: |
          python scripts/validate-evidence-archive.py
          python scripts/validate-model-inference-governance.py
          python scripts/validate-authorized-scheduling.py
          python scripts/validate-supervised-orchestration.py
          python scripts/validate-wrapper-runtime.py
          npm run check:frontend
          npm run build
      - name: Validate native implementation
        run: |
          cargo fmt --all -- --check
          cargo test -p microgifter-homeserver-service
          cargo test -p microgifter-homeserver-service --test phase21_evidence_archive_contract
          cargo clippy -p microgifter-homeserver-service --all-targets -- \
            -D warnings \
            -A clippy::needless-return \
            -A clippy::manual-range-contains \
            -A clippy::unnecessary-map-or \
            -A dead-code \
            -A unused-imports
      - name: Commit clean permanent Phase 21 implementation
        run: |
          git checkout origin/main -- .github/workflows/phase-1-foundation.yml
          rm -f scripts/phase21-integrate.py
          find scripts -type d -name __pycache__ -prune -exec rm -rf {} +
          find scripts -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo "No Phase 21 product changes were produced."
            exit 1
          fi
          git commit -m "Build Phase 21 tamper-evident evidence archive"
          git push origin HEAD:feature/phase-21-tamper-evident-evidence-archive
