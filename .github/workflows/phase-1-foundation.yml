name: HomeServer Production Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair-pod-provider-source:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/pod-provider-voice-adapter-v1-20260728'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/pod-provider-voice-adapter-v1-20260728
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Repair, format, and commit POD provider source
        shell: bash
        run: |
          set -euo pipefail
          python scripts/repair-pod-provider-source.py
          cargo fmt --all
          if git diff --quiet -- '*.rs'; then
            echo 'POD provider source is already repaired.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/homeserver-service/src/app/pod_provider_runtime.rs
          git commit -m 'Repair POD capability-test model serialization'
          git push origin HEAD:feature/pod-provider-voice-adapter-v1-20260728
