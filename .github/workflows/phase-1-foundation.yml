name: HomeServer Production Quality

on:
  pull_request:

permissions:
  contents: write

concurrency:
  group: phase6a-agent-chat-initial-load-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'feature/homeserver-agent-chat-connection-ui-v1-20260728'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out Agent Chat branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/homeserver-agent-chat-connection-ui-v1-20260728
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Add deterministic initial refresh
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("src/homeserver-agent-chat.js")
          text = path.read_text(encoding="utf-8")
          state_anchor = 'let notice = null;\n'
          state_replacement = 'let notice = null;\nlet initialized = false;\n'
          if 'let initialized = false;' not in text:
              if state_anchor not in text:
                  raise SystemExit("Agent Chat state anchor not found")
              text = text.replace(state_anchor, state_replacement, 1)

          mount_anchor = '  bindEvents();\n  window.setTimeout(() => {\n'
          mount_replacement = '''  bindEvents();
  if (!initialized && !loading) {
    initialized = true;
    void refreshAll();
  }
  window.setTimeout(() => {
'''
          if 'void refreshAll();' not in text:
              if mount_anchor not in text:
                  raise SystemExit("Agent Chat mount anchor not found")
              text = text.replace(mount_anchor, mount_replacement, 1)

          path.write_text(text, encoding="utf-8")
          '@ | python -

      - name: Validate frontend
        shell: pwsh
        run: |
          node --check src/homeserver-agent-chat.js
          npm ci
          npm run check:frontend
          npm run build

      - name: Restore permanent workflow and commit repaired source
        shell: pwsh
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/phase-1-foundation.yml
          Remove-Item .github/workflows/phase6a-chat-initial-load-fix.yml -Force -ErrorAction SilentlyContinue
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/homeserver-agent-chat.js .github/workflows/phase-1-foundation.yml .github/workflows/phase6a-chat-initial-load-fix.yml
          if (-not (git diff --cached --quiet)) {
            git commit -m "Load Agent Chat history on first open"
            git push origin HEAD:feature/homeserver-agent-chat-connection-ui-v1-20260728
          }
