name: Phase 3B Compile Repair

on:
  push:
    branches:
      - feature/phase-3b-signed-updates-20260724

permissions:
  contents: write

concurrency:
  group: phase3b-compile-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3b-signed-updates-20260724

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Apply exact compiler repair
        run: |
          python scripts/phase3b_compile_fix.py
          cargo fmt --all
          git diff --check

      - name: Commit repair
        run: |
          git rm scripts/phase3b_compile_fix.py
          git add crates/homeserver-service/src/main.rs crates/homeserver-service/src/update.rs
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          git commit -m "Repair Phase 3B service compilation"
          git push origin HEAD:feature/phase-3b-signed-updates-20260724
