name: Phase 18 Controlled Builder

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: phase18-controlled-builder
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: feature/phase-18-supervised-action-orchestration
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Assemble verified Phase 18 source
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          names = ['00','01','02','03','04a','04b']
          payload = ''.join((Path('scripts') / f'.phase18-part-{name}').read_text() for name in names)
          assert len(payload) == 53872
          assert hashlib.sha256(payload.encode()).hexdigest() == '8bb06a07e9ac535779981ccfa5df5a48fdf19076a81fd94b8177cce1a21aca36'
          Path('scripts/phase18-branch-builder.py').write_bytes(gzip.decompress(base64.b64decode(payload, validate=True)))
          PY
          python scripts/phase18-branch-builder.py
      - name: Apply reviewed source repairs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          repairs = [
              ('crates/homeserver-service/src/app/wrapper_agents.rs', 'fn create_proposal(connection: &Connection, request: CreateProposalRequest) -> Result<String> {', 'pub(crate) fn create_proposal(connection: &Connection, request: CreateProposalRequest) -> Result<String> {'),
              ('crates/homeserver-service/src/app/wrapper_runtime.rs', 'fn create_plan(state: &AppState, request: CreateRuntimePlanRequest) -> Result<String> {', 'pub(crate) fn create_plan(state: &AppState, request: CreateRuntimePlanRequest) -> Result<String> {'),
          ]
          for filename, old, new in repairs:
              path = Path(filename)
              text = path.read_text()
              if new not in text:
                  assert old in text, filename
                  text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          python scripts/phase18-source-repair.py
          cargo fmt --all
      - name: Validate Phase 18 and retained boundaries
        run: |
          npm ci
          python scripts/validate-supervised-orchestration.py
          python scripts/validate-wrapper-agents.py
          python scripts/validate-wrapper-runtime.py
          python scripts/validate-wrapper-privacy.py
          npm run check:frontend
          npm run build
          cargo fmt --all -- --check
          cargo test -p microgifter-homeserver-service
          cargo test -p microgifter-homeserver-service --test phase18_supervised_orchestration_contract
          cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings -A dead_code -A unused_imports -A unused_variables -A unused_mut
      - name: Commit permanent Phase 18 implementation
        shell: bash
        run: |
          rm -f scripts/.phase18-* scripts/phase18-branch-builder.py scripts/phase18-source-repair.py docs/.phase18-staging-marker.md
          rm -f .github/workflows/phase18-branch-builder.yml .github/workflows/phase18-builder-v2.yml .github/workflows/phase18-builder-v3.yml .github/workflows/phase18-push-builder.yml
          git checkout origin/main -- .github/workflows/phase-1-foundation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build Phase 18 supervised action orchestration"
          git push
