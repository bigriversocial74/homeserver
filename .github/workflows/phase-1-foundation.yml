name: Phase 3B Rollback Hardening

on:
  push:
    branches:
      - feature/phase-3b-signed-updates-20260724

permissions:
  contents: write

concurrency:
  group: phase3b-rollback-hardening
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3b-signed-updates-20260724

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Apply rollback and diagnostic hardening
        run: |
          python scripts/phase3b_rollback_hardening.py
          cargo fmt --all
          git diff --check

      - name: Commit hardened rollback path
        run: |
          git rm scripts/phase3b_rollback_hardening.py
          git add crates/homeserver-updater/src/main.rs scripts/smoke-test-updater.ps1 .github/workflows/phase-1-foundation.yml
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          git commit -m "Harden Phase 3B installed rollback lifecycle"
          git push origin HEAD:feature/phase-3b-signed-updates-20260724
