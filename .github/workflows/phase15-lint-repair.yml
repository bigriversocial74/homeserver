name: Phase 15 Lint Repair

on:
  push:
    branches:
      - feature/phase-15-federated-settings-shared-control-center

permissions:
  contents: write

concurrency:
  group: phase15-lint-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-15-federated-settings-shared-control-center
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Refactor receipt evidence and remove redundant import
        run: |
          python - <<'PY'
          from pathlib import Path

          signature = Path('crates/homeserver-service/src/federated_settings_signature.rs')
          text = signature.read_text()
          text = text.replace('    use base64::Engine as _;\n', '', 1)
          signature.write_text(text)

          source = Path('crates/homeserver-service/src/federated_settings.rs')
          text = source.read_text()

          identity = '''#[derive(Debug, Clone)]
          struct DeviceIdentity {
              account_id: i64,
              device_public_id: String,
          }
          '''
          evidence = '''#[derive(Debug, Clone)]
          struct DeviceIdentity {
              account_id: i64,
              device_public_id: String,
          }

          struct ReceiptEvidence<'a> {
              request_id: &'a str,
              direction: &'a str,
              base_revision: u64,
              applied_revision: u64,
              snapshot_hash: Option<&'a str>,
              result: &'a str,
              conflict_count: u64,
          }
          '''
          if 'struct ReceiptEvidence' not in text:
              if identity not in text:
                  raise SystemExit('device identity anchor not found')
              text = text.replace(identity, evidence, 1)

          local_call = '''    record_receipt(
              &transaction,
              &format!("LOCAL-{}", Uuid::new_v4().simple()),
              "local_update",
              cloud_revision,
              cloud_revision,
              None,
              "applied",
              0,
          )?;
          '''
          local_replacement = '''    record_receipt(
              &transaction,
              ReceiptEvidence {
                  request_id: &format!("LOCAL-{}", Uuid::new_v4().simple()),
                  direction: "local_update",
                  base_revision: cloud_revision,
                  applied_revision: cloud_revision,
                  snapshot_hash: None,
                  result: "applied",
                  conflict_count: 0,
              },
          )?;
          '''
          if local_call in text:
              text = text.replace(local_call, local_replacement, 1)
          elif 'direction: "local_update"' not in text:
              raise SystemExit('local receipt call anchor not found')

          sync_call = '''    record_receipt(
              &transaction,
              request_id,
              "device_sync",
              base_revision,
              cloud.max_revision,
              Some(&cloud.snapshot_hash),
              result,
              cloud.conflicts.len() as u64,
          )?;
          '''
          sync_replacement = '''    record_receipt(
              &transaction,
              ReceiptEvidence {
                  request_id,
                  direction: "device_sync",
                  base_revision,
                  applied_revision: cloud.max_revision,
                  snapshot_hash: Some(&cloud.snapshot_hash),
                  result,
                  conflict_count: cloud.conflicts.len() as u64,
              },
          )?;
          '''
          if sync_call in text:
              text = text.replace(sync_call, sync_replacement, 1)
          elif 'direction: "device_sync"' not in text:
              raise SystemExit('sync receipt call anchor not found')

          function = '''fn record_receipt(
              connection: &Connection,
              request_id: &str,
              direction: &str,
              base_revision: u64,
              applied_revision: u64,
              snapshot_hash: Option<&str>,
              result: &str,
              conflict_count: u64,
          ) -> Result<()> {
              connection.execute(
                  "INSERT INTO federated_settings_sync_receipts (receipt_id,request_id,direction,base_revision,applied_revision,snapshot_hash,result,conflict_count,created_at_utc) VALUES (?1,?2,?3,?4,?5,?6,?7,?8,strftime('%Y-%m-%dT%H:%M:%fZ','now'))",
                  params![
                      Uuid::new_v4().to_string(),
                      request_id,
                      direction,
                      base_revision as i64,
                      applied_revision as i64,
                      snapshot_hash,
                      result,
                      conflict_count as i64,
                  ],
              )?;
              Ok(())
          }
          '''
          replacement = '''fn record_receipt(connection: &Connection, evidence: ReceiptEvidence<'_>) -> Result<()> {
              connection.execute(
                  "INSERT INTO federated_settings_sync_receipts (receipt_id,request_id,direction,base_revision,applied_revision,snapshot_hash,result,conflict_count,created_at_utc) VALUES (?1,?2,?3,?4,?5,?6,?7,?8,strftime('%Y-%m-%dT%H:%M:%fZ','now'))",
                  params![
                      Uuid::new_v4().to_string(),
                      evidence.request_id,
                      evidence.direction,
                      evidence.base_revision as i64,
                      evidence.applied_revision as i64,
                      evidence.snapshot_hash,
                      evidence.result,
                      evidence.conflict_count as i64,
                  ],
              )?;
              Ok(())
          }
          '''
          if function in text:
              text = text.replace(function, replacement, 1)
          elif 'fn record_receipt(connection: &Connection, evidence: ReceiptEvidence' not in text:
              raise SystemExit('receipt helper anchor not found')

          source.write_text(text)
          PY
          cargo fmt --all
      - name: Commit permanent repair
        run: |
          git rm .github/workflows/phase15-lint-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-service/src/federated_settings.rs crates/homeserver-service/src/federated_settings_signature.rs
          git commit -m "Refactor federated settings receipt evidence"
          git push origin HEAD:feature/phase-15-federated-settings-shared-control-center
