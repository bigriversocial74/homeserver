name: Phase 23A Isolated Exact-Head Certification

on:
  push:
    branches:
      - feature/phase-23-agent-chat-ears-conversation-engine
    paths:
      - .github/workflows/phase23-final-certification-repair.yml

permissions:
  contents: write

jobs:
  prepare-exact-head:
    runs-on: ubuntu-24.04
    outputs:
      head: ${{ steps.commit.outputs.head }}
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-23-agent-chat-ears-conversation-engine
          fetch-depth: 0

      - name: Remove temporary certification workflow and commit exact candidate
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git rm --force .github/workflows/phase23-final-certification-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary Phase 23 exact certification workflow"
          git push origin HEAD:feature/phase-23-agent-chat-ears-conversation-engine
          echo "head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate-linux:
    needs: prepare-exact-head
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out exact cleaned head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare-exact-head.outputs.head }}

      - name: Configure Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Linux native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate all permanent frontend contracts
        run: npm run check:frontend

      - name: Build production frontend
        run: npm run build

      - name: Prepare generated desktop resources
        run: npm run prepare:icons

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Check full Rust workspace
        run: cargo check --workspace --all-targets

      - name: Test full Rust workspace
        run: cargo test --workspace

      - name: Strict lint full Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Report Linux exact head
        run: echo "Linux certification passed at ${{ needs.prepare-exact-head.outputs.head }}"

  validate-windows:
    needs: prepare-exact-head
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - name: Check out exact cleaned head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.prepare-exact-head.outputs.head }}

      - name: Configure Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Verify deterministic dependency locks
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          npm install --package-lock-only --ignore-scripts
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- Cargo.lock package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate all permanent frontend contracts
        run: npm run check:frontend

      - name: Build production frontend
        run: npm run build

      - name: Prepare generated desktop resources
        run: npm run prepare:icons

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Check full Rust workspace
        run: cargo check --workspace --all-targets

      - name: Test full Rust workspace
        run: cargo test --workspace

      - name: Strict lint full Rust workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Report Windows exact head
        shell: pwsh
        run: Write-Output "Windows certification passed at ${{ needs.prepare-exact-head.outputs.head }}"
