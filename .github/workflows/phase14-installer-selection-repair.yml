name: Phase 14 Installer Selection Repair

on:
  push:
    branches:
      - feature/phase-14-vp3-activation-control-center

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-14-vp3-activation-control-center
      - name: Require exact-version NSIS source installer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/phase-1-foundation.yml')
          source = path.read_text()
          old = '''      - name: Build NSIS installer
        shell: pwsh
        run: |
          npm run tauri:build *> tauri-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content tauri-build.log -Tail 240; exit $LASTEXITCODE }
          $bundle = "target/release/bundle/nsis"
          $installer = Get-ChildItem $bundle -Filter "*-setup.exe" | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Copy-Item $installer.FullName "$bundle/Microgifter-HomeServer-v${{ steps.release.outputs.version }}-Setup.exe" -Force
'''
          new = '''      - name: Build NSIS installer
        shell: pwsh
        run: |
          $bundle = "target/release/bundle/nsis"
          Remove-Item $bundle -Recurse -Force -ErrorAction SilentlyContinue
          npm run tauri:build *> tauri-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content tauri-build.log -Tail 240; exit $LASTEXITCODE }
          $version = "${{ steps.release.outputs.version }}"
          $installers = @(Get-ChildItem $bundle -Filter "*_$($version)_*-setup.exe")
          if ($installers.Count -ne 1) {
            $found = @(Get-ChildItem $bundle -Filter "*-setup.exe" | ForEach-Object Name) -join ", "
            throw "Expected exactly one NSIS source installer for $version but found $($installers.Count). Available: $found"
          }
          $canonical = "$bundle/Microgifter-HomeServer-v$version-Setup.exe"
          Copy-Item $installers[0].FullName $canonical -Force
          if (-not (Test-Path $canonical)) { throw "Canonical NSIS installer was not produced" }
'''
          if old not in source:
              raise SystemExit('NSIS installer selection block was not found')
          path.write_text(source.replace(old, new, 1))
          PY
      - name: Commit installer selection repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/phase-1-foundation.yml
          git commit -m "Select exact-version NSIS installer"
          git push origin HEAD:feature/phase-14-vp3-activation-control-center
