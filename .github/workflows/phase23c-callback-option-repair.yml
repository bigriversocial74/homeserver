name: Phase 23C Callback Option Repair

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/phase23c-callback-option-repair.yml

permissions:
  contents: write

concurrency:
  group: phase23c-callback-option-repair-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  repair:
    if: github.head_ref == 'feature/phase-23c-local-whisper-transcription'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install Rust formatter
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply callback option repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("src-tauri/src/whisper.rs")
          text = path.read_text(encoding="utf-8")
          replacements = (
              (
                  "params.set_segment_callback_safe_lossy(Some(move |data: SegmentCallbackData| {",
                  "params.set_segment_callback_safe_lossy(move |data: SegmentCallbackData| {",
              ),
              (
                  "    }));\n\n    let progress_app",
                  "    });\n\n    let progress_app",
              ),
              (
                  "params.set_progress_callback_safe(Some(move |progress: i32| {",
                  "params.set_progress_callback_safe(move |progress: i32| {",
              ),
              (
                  "    }));\n    let abort = cancel.clone();",
                  "    });\n    let abort = cancel.clone();",
              ),
              (
                  "params.set_abort_callback_safe(Some(move || abort.load(Ordering::SeqCst)));",
                  "params.set_abort_callback_safe(move || abort.load(Ordering::SeqCst));",
              ),
          )

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected one callback replacement for {old!r}, found {count}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Remove temporary repair workflow
        shell: bash
        run: rm .github/workflows/phase23c-callback-option-repair.yml

      - name: Commit permanent repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/whisper.rs .github/workflows/phase23c-callback-option-repair.yml
          git commit -m "Repair Phase 23C callback option inference"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
