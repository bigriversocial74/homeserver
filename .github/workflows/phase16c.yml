name: Phase 16C Lint Repair

on:
  pull_request:
  push:
    branches:
      - feature/phase-16c-shared-jobs-events-receipts

permissions:
  contents: write

concurrency:
  group: homeserver-phase16c-lint-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-16c-shared-jobs-events-receipts
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Apply Phase 16C lint repairs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"unexpected match count in {path}: {count} for {old!r}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          submit = Path("crates/homeserver-service/src/app/wrapper_jobs_submit.rs")
          replace_once(submit, "    max_concurrent_jobs: u32,\n", "")
          replace_once(
              submit,
              "    let (max_result_bytes, max_execution_seconds, max_concurrent_jobs, max_queued_jobs): (\n        i64,\n        i64,\n        i64,\n        i64,\n    ) = connection.query_row(\n        \"SELECT max_result_bytes,max_execution_seconds,max_concurrent_jobs,max_queued_jobs FROM wrapper_resource_limits WHERE grant_id=?1\",\n        params![grant_id],\n        |row| Ok((row.get(0)?, row.get(1)?, row.get(2)?, row.get(3)?)),\n    )?;\n",
              "    let (max_result_bytes, max_execution_seconds, max_queued_jobs): (i64, i64, i64) =\n        connection.query_row(\n            \"SELECT max_result_bytes,max_execution_seconds,max_queued_jobs FROM wrapper_resource_limits WHERE grant_id=?1\",\n            params![grant_id],\n            |row| Ok((row.get(0)?, row.get(1)?, row.get(2)?)),\n        )?;\n",
          )
          replace_once(
              submit,
              "        max_concurrent_jobs: max_concurrent_jobs.max(1) as u32,\n",
              "",
          )

          support = Path("crates/homeserver-service/src/app/wrapper_jobs_support.rs")
          replace_once(
              support,
              "fn json_bytes(value: &Value) -> Result<usize> {\n    Ok(json_text(value)?.len())\n}\n\n",
              "",
          )

          workers = Path("crates/homeserver-service/src/app/wrapper_jobs_workers.rs")
          replace_once(
              workers,
              "candidate.max_execution_seconds.min(300).max(30)",
              "candidate.max_execution_seconds.clamp(30, 300)",
          )
          replace_once(
              workers,
              "    ensure!(\n        job.lease_token_hash.as_deref() == Some(hash_text(lease_token).as_str()),\n        \"job lease token is invalid\"\n    );\n",
              "    let expected_lease_hash = hash_text(lease_token);\n    ensure!(\n        job.lease_token_hash.as_deref() == Some(expected_lease_hash.as_str()),\n        \"job lease token is invalid\"\n    );\n",
          )
          PY
          cargo fmt --all
          python scripts/validate-wrapper-jobs.py
      - name: Commit Phase 16C lint repairs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/homeserver-service/src/app
          if git diff --cached --quiet; then
            echo 'Phase 16C lint repairs are already applied.'
            exit 0
          fi
          git commit -m 'Repair Phase 16C strict lint defects'
          git push origin HEAD:feature/phase-16c-shared-jobs-events-receipts
