name: Phase 23C Atomic Removal Hardening

on:
  pull_request:
    paths:
      - "scripts/apply-phase23c-removal-hardening.py"
      - ".github/workflows/phase23c-removal-hardening.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase23c-removal-hardening-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact Phase 23C branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-23c-local-whisper-transcription
          fetch-depth: 0

      - name: Configure stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Apply permanent removal hardening
        run: python scripts/apply-phase23c-removal-hardening.py

      - name: Format Rust workspace
        run: cargo fmt --all

      - name: Remove one-time hardening assets
        run: |
          git rm scripts/apply-phase23c-removal-hardening.py
          git rm .github/workflows/phase23c-removal-hardening.yml

      - name: Commit hardened candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/whisper.rs crates/homeserver-service/src/audio_runtime.rs scripts/validate-agent-whisper.py .github/workflows
          git diff --cached --check
          git commit -m "Make Phase 23C model removal recoverable"
          git push origin HEAD:feature/phase-23c-local-whisper-transcription
