name: Fix v0.1.1 Clippy

on:
  push:
    branches:
      - fix/machine-scoped-cloud-credentials-20260725

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/machine-scoped-cloud-credentials-20260725
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Apply Clippy suggestions
        run: cargo clippy --fix --workspace --all-targets --allow-dirty --allow-staged --locked

      - name: Format fixed Rust
        run: cargo fmt --all

      - name: Commit Clippy fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Clippy fixes were required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.rs'
          git commit -m "Apply v0.1.1 Clippy fixes"
          git push origin HEAD:fix/machine-scoped-cloud-credentials-20260725
