name: Phase 23B Audit Hardening

on:
  push:
    branches:
      - feature/phase-23b-local-vad-segmentation
    paths:
      - scripts/apply-phase23b-audit-hardening.py
      - .github/workflows/phase23b-audit-hardening.yml

permissions:
  contents: write

concurrency:
  group: phase23b-audit-hardening
  cancel-in-progress: false

jobs:
  harden:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact Phase 23B branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-23b-local-vad-segmentation
          fetch-depth: 0

      - name: Apply permanent audit hardening
        run: python scripts/apply-phase23b-audit-hardening.py

      - name: Remove one-time repair assets
        run: |
          git rm scripts/apply-phase23b-audit-hardening.py
          git rm .github/workflows/phase23b-audit-hardening.yml

      - name: Commit hardened candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/homeserver-vad-engine.js src/homeserver-agent-vad.js scripts/test-agent-audio-vad.mjs scripts/validate-agent-audio-vad.py
          git diff --cached --check
          git commit -m "Harden Phase 23B speech boundaries and transitions"
          git push origin HEAD:feature/phase-23b-local-vad-segmentation
