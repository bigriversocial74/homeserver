name: Phase 23A Linkage Fixture Repair

on:
  push:
    branches:
      - feature/phase-23-agent-chat-ears-conversation-engine
    paths:
      - scripts/apply-phase23-linkage-fixture-repair.py
      - .github/workflows/phase23-linkage-fixture-repair.yml

permissions:
  contents: write

concurrency:
  group: phase23-linkage-fixture-repair
  cancel-in-progress: false

jobs:
  repair-and-test:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Check out draft branch
        uses: actions/checkout@v4
        with:
          ref: feature/phase-23-agent-chat-ears-conversation-engine
          fetch-depth: 0

      - name: Configure Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Configure Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Apply permanent fixture repair
        shell: pwsh
        run: |
          python scripts/apply-phase23-linkage-fixture-repair.py
          cargo fmt --all
          Remove-Item scripts/apply-phase23-linkage-fixture-repair.py
          Remove-Item .github/workflows/phase23-linkage-fixture-repair.yml

      - name: Commit permanent repair
        id: commit
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair Phase 23A transcript-linkage test fixture"
          git push origin HEAD:feature/phase-23-agent-chat-ears-conversation-engine
          "head=$(git rev-parse HEAD)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Install frontend dependencies
        run: npm ci

      - name: Run frontend and permanent contracts
        run: npm run check:frontend

      - name: Build production frontend
        run: npm run build

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Test HomeServer service
        run: cargo test -p microgifter-homeserver-service

      - name: Strict HomeServer service lint
        run: cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings

      - name: Report certified candidate
        shell: pwsh
        run: Write-Output "Phase 23A repaired candidate ${{ steps.commit.outputs.head }} passed focused certification."
