name: Phase 21 Evidence Archive

on:
  pull_request:
    paths:
      - .github/workflows/phase21-evidence-archive.yml
      - database/migrations/0029_tamper_evident_evidence_archive.sql
      - docs/phase-21-tamper-evident-evidence-archive.md
      - scripts/validate-evidence-archive.py
      - scripts/validate-model-inference-governance.py
      - scripts/validate-authorized-scheduling.py
      - scripts/validate-supervised-orchestration.py
      - scripts/validate-wrapper-runtime.py
      - package.json
      - crates/homeserver-service/src/main.rs
      - crates/homeserver-service/src/app.rs
      - crates/homeserver-service/src/evidence_archive.rs
      - crates/homeserver-service/tests/phase21_evidence_archive_contract.rs
      - src-tauri/src/lib.rs
      - src-tauri/src/runtime.rs
      - src/agent-runtime-control-center.js
      - src/agent-runtime-control-center.css
  push:
    branches:
      - feature/phase-21-tamper-evident-evidence-archive
      - main
    paths:
      - .github/workflows/phase21-evidence-archive.yml
      - database/migrations/0029_tamper_evident_evidence_archive.sql
      - docs/phase-21-tamper-evident-evidence-archive.md
      - scripts/validate-evidence-archive.py
      - scripts/validate-model-inference-governance.py
      - scripts/validate-authorized-scheduling.py
      - scripts/validate-supervised-orchestration.py
      - scripts/validate-wrapper-runtime.py
      - package.json
      - crates/homeserver-service/src/main.rs
      - crates/homeserver-service/src/app.rs
      - crates/homeserver-service/src/evidence_archive.rs
      - crates/homeserver-service/tests/phase21_evidence_archive_contract.rs
      - src-tauri/src/lib.rs
      - src-tauri/src/runtime.rs
      - src/agent-runtime-control-center.js
      - src/agent-runtime-control-center.css

permissions:
  contents: read

concurrency:
  group: homeserver-phase21-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Validate Phase 21 evidence archive boundaries
        run: python scripts/validate-evidence-archive.py
      - name: Validate retained Phase 20 inference governance
        run: python scripts/validate-model-inference-governance.py
      - name: Validate retained Phase 19 scheduling
        run: python scripts/validate-authorized-scheduling.py
      - name: Validate retained Phase 18 supervised orchestration
        run: python scripts/validate-supervised-orchestration.py
      - name: Validate retained Phase 17 runtime authority
        run: python scripts/validate-wrapper-runtime.py
      - name: Validate retained frontend contracts and build
        run: |
          npm run check:frontend
          npm run build
      - name: Validate Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile and test HomeServer service
        run: cargo test -p microgifter-homeserver-service
      - name: Validate Phase 21 immutable archive contract
        run: cargo test -p microgifter-homeserver-service --test phase21_evidence_archive_contract
      - name: Strict HomeServer service lint
        run: cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings
