name: VP3 Product Recovery

on:
  push:
    branches:
      - feature/vp3-http-client-v1-20260729
    paths:
      - .github/workflows/vp3-builder-bootstrap.yml

permissions:
  contents: write

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/vp3-http-client-v1-20260729
          fetch-depth: 0
      - name: Generate permanent product files
        run: |
          python - <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/build-vp3-http-client-v1.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(source) if "cat > /tmp/build_vp3_client.py <<'PY'" in line) + 1
          end = next(i for i in range(start, len(source)) if source[i] == '          PY')
          prefix = ' ' * 10
          output = []
          triple = None
          for raw in source[start:end]:
              candidate = raw[len(prefix):] if raw.startswith(prefix) else raw
              if triple is None:
                  output.append(candidate)
                  for token in ("'''", '\"\"\"'):
                      if candidate.count(token) % 2 == 1:
                          triple = token
                          break
              else:
                  output.append(candidate if raw.startswith(prefix) and triple in raw else raw)
                  if raw.count(triple) % 2 == 1:
                      triple = None
          if triple is not None:
              raise SystemExit('Embedded builder contains an unterminated source string')
          Path('/tmp/build_vp3_client.py').write_text('\n'.join(output) + '\n')
          PY
          test -s /tmp/build_vp3_client.py
          python /tmp/build_vp3_client.py
      - name: Commit product tree before certification
        run: |
          rm -f .github/workflows/build-vp3-http-client-v1.yml
          rm -f .github/workflows/run-vp3-http-client-builder.yml
          rm -f .github/workflows/vp3-builder-bootstrap.yml
          rm -f .vp3-builder-bootstrap .vp3-heavy-builder-started
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Stage VP3 HomeServer HTTP client product tree"
          git push origin HEAD:feature/vp3-http-client-v1-20260729

