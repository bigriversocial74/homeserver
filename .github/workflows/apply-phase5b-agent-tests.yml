name: Apply Phase 5B Agent Workspace tests

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5b-agent-workspace-tests
  cancel-in-progress: false

jobs:
  test-and-commit:
    if: github.head_ref == 'feature/phase-5b-agent-workspace-approvals-world-missions-20260727'
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - name: Check out Phase 5B branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-5b-agent-workspace-approvals-world-missions-20260727
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Apply and validate behavioral tests
        shell: pwsh
        run: |
          python scripts/apply-phase5b-agent-tests.py *> phase5b-agent-tests.log
          if ($LASTEXITCODE -ne 0) { Get-Content phase5b-agent-tests.log -Tail 240; exit $LASTEXITCODE }
          cargo fmt --all *>> phase5b-agent-tests.log
          if ($LASTEXITCODE -ne 0) { Get-Content phase5b-agent-tests.log -Tail 240; exit $LASTEXITCODE }
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/smoke-test-service.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Add-Content phase5b-agent-tests.log $_.Message }
            Get-Content phase5b-agent-tests.log -Tail 240
            exit 1
          }
          cargo test --package microgifter-homeserver-service agent_runtime::tests --locked *>> phase5b-agent-tests.log
          if ($LASTEXITCODE -ne 0) { Get-Content phase5b-agent-tests.log -Tail 300; exit $LASTEXITCODE }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/homeserver-service/src/agent_runtime.rs scripts/smoke-test-service.ps1
          if (-not (git diff --cached --quiet)) {
            git commit -m "Add Agent Workspace behavioral validation"
            git push origin HEAD:feature/phase-5b-agent-workspace-approvals-world-missions-20260727
          }

      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5b-agent-workspace-tests
          path: phase5b-agent-tests.log
          if-no-files-found: warn
          retention-days: 7
