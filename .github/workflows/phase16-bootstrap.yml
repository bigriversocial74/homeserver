name: Phase 16 Bootstrap

on:
  pull_request:
  push:
    branches:
      - feature/phase-16-multi-wrapper-core-v1

permissions:
  contents: write

concurrency:
  group: homeserver-phase16-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: feature/phase-16-multi-wrapper-core-v1
      - name: Materialize reviewed Phase 16A source bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shas=(
            6c717978811c15262e20b6c5d7061d2502b5ff48
            ebf10722881201b84a8632f9895271e5667ac47e
            5e5996e2bf049fb748fbe34064218a5c17cc77d5
            58e081b25f6012ed3759095e958225c23b76734a
          )
          : > phase16-bundle.tgz
          for sha in "${shas[@]}"; do
            curl --fail --silent --show-error \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode >> phase16-bundle.tgz
          done
          printf '%s  %s\n' 'e3522b4c0f7cc905be9c3fd2381a87b1c492a2cd4233a8e9ab98a8c77a097141' 'phase16-bundle.tgz' | sha256sum --check
          tar --extract --gzip --file phase16-bundle.tgz
          rm phase16-bundle.tgz
          rm -f crates/homeserver-service/src/app/wrapper_core_part1.rs \
                crates/homeserver-service/src/app/wrapper_core_part2.rs \
                crates/homeserver-service/src/app/wrapper_core_part3.rs \
                crates/homeserver-service/src/app/wrapper_core_part4.rs \
                crates/homeserver-service/src/app/wrapper_core_part5.rs
      - name: Commit integrated Phase 16A implementation
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then
            echo 'Phase 16A source bundle is already materialized.'
            exit 0
          fi
          git commit -m 'Build Phase 16A shared multi-wrapper identity and pairing core'
          git push origin HEAD:feature/phase-16-multi-wrapper-core-v1
