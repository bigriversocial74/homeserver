name: Phase 17 Control Center UI Once

on:
  pull_request:
    types: [edited]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.number == 57 && github.event.pull_request.head.ref == 'feature/phase-17-authorized-agent-tool-runtime'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-17-authorized-agent-tool-runtime
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Add permanent Phase 17 Control Center visibility
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  if new in text:
                      return
                  raise SystemExit(f"missing {label} marker in {path}")
              if text.count(old) != 1:
                  raise SystemExit(f"ambiguous {label} marker in {path}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          runtime_rs = r'''use super::{get_json, post_json};
          use serde_json::{json, Value};

          #[tauri::command]
          pub(crate) async fn homeserver_agent_runtime() -> Result<Value, String> {
              get_json("/v1/agent-runtime").await
          }

          #[tauri::command]
          pub(crate) async fn homeserver_agent_authority() -> Result<Value, String> {
              get_json("/v1/agents").await
          }

          #[tauri::command]
          pub(crate) async fn homeserver_run_agent_runtime_once() -> Result<Value, String> {
              post_json("/v1/agent-runtime/run-once", &json!({})).await
          }

          #[tauri::command]
          pub(crate) async fn homeserver_cancel_agent_runtime_plan(
              plan_id: String,
              actor_user_id: String,
              confirmation: String,
              reason: String,
          ) -> Result<Value, String> {
              post_json(
                  "/v1/agent-runtime/plans/cancel",
                  &json!({
                      "plan_id": plan_id,
                      "actor_user_id": actor_user_id,
                      "confirmation": confirmation,
                      "reason": reason
                  }),
              )
              .await
          }
          '''
          (ROOT / "src-tauri/src/runtime.rs").write_text(runtime_rs, encoding="utf-8")

          replace_once(
              ROOT / "src-tauri/src/lib.rs",
              "mod review_intelligence;\nmod vault;",
              "mod review_intelligence;\nmod runtime;\nmod vault;",
              "runtime module",
          )
          replace_once(
              ROOT / "src-tauri/src/lib.rs",
              "            review_intelligence::homeserver_record_review_recommendation_outcome,\n            cloud::homeserver_cloud_status,",
              "            review_intelligence::homeserver_record_review_recommendation_outcome,\n            runtime::homeserver_agent_runtime,\n            runtime::homeserver_agent_authority,\n            runtime::homeserver_run_agent_runtime_once,\n            runtime::homeserver_cancel_agent_runtime_plan,\n            cloud::homeserver_cloud_status,",
              "runtime command registration",
          )

          control_center_js = r'''import { invoke } from "@tauri-apps/api/core";
          import { icon } from "./icons.js";
          import "./agent-runtime-control-center.css";

          const RUNTIME_ROUTE = "runtime";
          const LOCAL_ACTOR = "local_control_center";
          const REFRESH_WINDOW_MS = 15_000;

          const runtimeState = {
            runtime: null,
            authority: null,
            busy: false,
            error: null,
            lastLoadedAt: 0,
          };

          function escapeHtml(value) {
            return String(value ?? "")
              .replaceAll("&", "&amp;")
              .replaceAll("<", "&lt;")
              .replaceAll(">", "&gt;")
              .replaceAll('"', "&quot;")
              .replaceAll("'", "&#039;");
          }

          function values(value) {
            return Array.isArray(value) ? value : [];
          }

          function routeName() {
            return window.location.hash.replace("#", "");
          }

          function isRuntimeRoute() {
            return routeName() === RUNTIME_ROUTE;
          }

          function humanize(value) {
            return String(value || "unknown").replaceAll("_", " ");
          }

          function formatDate(value) {
            if (!value) return "Not yet";
            const date = new Date(value);
            return Number.isNaN(date.getTime()) ? String(value) : date.toLocaleString();
          }

          function relativeDate(value) {
            if (!value) return "Not yet";
            const timestamp = new Date(value).getTime();
            if (!Number.isFinite(timestamp)) return formatDate(value);
            const seconds = Math.max(0, Math.floor((Date.now() - timestamp) / 1000));
            if (seconds < 60) return "Just now";
            if (seconds < 3600) return `${Math.floor(seconds / 60)}m ago`;
            if (seconds < 86400) return `${Math.floor(seconds / 3600)}h ago`;
            return `${Math.floor(seconds / 86400)}d ago`;
          }

          function compactHash(value) {
            const text = String(value || "");
            if (!text) return "Not recorded";
            if (text.length <= 18) return text;
            return `${text.slice(0, 8)}…${text.slice(-8)}`;
          }

          function statusTone(state) {
            const value = String(state || "unknown").toLowerCase();
            if (["active", "completed", "succeeded", "running", "ready", "approved"].includes(value)) return "success";
            if (["failed", "cancelled", "revoked", "expired", "dead_letter"].includes(value)) return "danger";
            if (["queued", "waiting", "leased", "pending", "awaiting_approval", "suspended"].includes(value)) return "warning";
            return "neutral";
          }

          function statusBadge(state, label = null) {
            const text = label || humanize(state);
            return `<span class="runtime-status ${statusTone(state)}"><i></i>${escapeHtml(text)}</span>`;
          }

          function metric(iconName, label, value, detail, tone = "blue") {
            return `<article class="metric-card tone-${tone}"><div class="metric-icon">${icon(iconName, 22)}</div><div><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong><small>${escapeHtml(detail)}</small></div></article>`;
          }

          function ensureRuntimeNavigation() {
            const nav = document.querySelector(".primary-nav");
            if (!nav) return;
            let button = nav.querySelector("[data-agent-runtime-route]");
            if (!button) {
              button = document.createElement("button");
              button.type = "button";
              button.className = "nav-item";
              button.dataset.agentRuntimeRoute = "true";
              button.innerHTML = `${icon("activity", 19)}<span>Agent Runtime</span>`;
              const integrations = nav.querySelector('[data-page="integrations"]');
              if (integrations) integrations.insertAdjacentElement("afterend", button);
              else nav.append(button);
            }
            const active = isRuntimeRoute();
            button.classList.toggle("active", active);
            if (active) {
              nav.querySelectorAll(".nav-item").forEach((item) => {
                if (item !== button) item.classList.remove("active");
              });
            }
          }

          function safetyItem(label, detail, passed) {
            return `<div class="runtime-safety-item ${passed ? "passed" : "failed"}"><span>${icon(passed ? "check" : "warning", 17)}</span><div><strong>${escapeHtml(label)}</strong><small>${escapeHtml(detail)}</small></div></div>`;
          }

          function activePlans() {
            return values(runtimeState.runtime?.plans).filter((plan) => ["queued", "running"].includes(plan.state));
          }

          function queuedSteps() {
            return values(runtimeState.runtime?.steps).filter((step) => ["queued", "waiting", "leased", "running"].includes(step.state));
          }

          function pendingApprovals() {
            return values(runtimeState.authority?.approvals).filter((approval) => approval.state === "pending");
          }

          function activeStops() {
            return values(runtimeState.authority?.emergency_stops).filter((stop) => stop.state === "active");
          }

          function failedWorkCount() {
            const plans = values(runtimeState.runtime?.plans).filter((plan) => plan.state === "failed").length;
            const steps = values(runtimeState.runtime?.steps).filter((step) => step.state === "failed").length;
            return plans + steps;
          }

          function renderSafetyBoundary(runtime) {
            const inputSafe = runtime?.private_inputs_exposed === false;
            const resultSafe = runtime?.private_results_exposed === false;
            const bypassSafe = runtime?.direct_tool_bypass_allowed === false;
            const egressSafe = runtime?.phase16e_egress_required === true;
            const safe = inputSafe && resultSafe && bypassSafe && egressSafe;
            return `<section class="runtime-boundary ${safe ? "safe" : "unsafe"}">
              <div class="runtime-boundary-copy"><span>${icon(safe ? "shield" : "warning", 23)}</span><div><strong>${safe ? "Phase 16 authority boundary is intact" : "Runtime boundary needs attention"}</strong><p>The Control Center exposes only safe metadata. Private inputs and full private results remain local and every successful result must pass Phase 16E egress.</p></div></div>
              <div class="runtime-safety-grid">
                ${safetyItem("Private inputs", inputSafe ? "Hidden from snapshots" : "Exposure detected", inputSafe)}
                ${safetyItem("Private results", resultSafe ? "Hash-only evidence" : "Exposure detected", resultSafe)}
                ${safetyItem("Direct tool bypass", bypassSafe ? "Disabled" : "Enabled", bypassSafe)}
                ${safetyItem("Phase 16E egress", egressSafe ? "Required" : "Not required", egressSafe)}
              </div>
            </section>`;
          }

          function renderPlans() {
            const plans = values(runtimeState.runtime?.plans);
            const steps = values(runtimeState.runtime?.steps);
            if (!plans.length) {
              return `<div class="runtime-empty">${icon("activity", 30)}<strong>No runtime plans yet</strong><p>Authorized low-risk work will appear here after an assigned agent submits Phase 16C jobs.</p></div>`;
            }
            return `<div class="runtime-plan-list">${plans.slice(0, 20).map((plan) => {
              const planSteps = steps.filter((step) => step.plan_id === plan.plan_id).sort((a, b) => Number(a.sequence_number) - Number(b.sequence_number));
              const percent = plan.step_count ? Math.round((Number(plan.completed_step_count || 0) / Number(plan.step_count)) * 100) : 0;
              const cancellable = ["queued", "running"].includes(plan.state);
              return `<article class="runtime-plan-card">
                <div class="runtime-plan-heading"><div><span>Agent plan</span><h3>${escapeHtml(plan.title)}</h3></div>${statusBadge(plan.state)}</div>
                <p>${escapeHtml(plan.objective)}</p>
                <div class="runtime-plan-progress"><div><span>${Number(plan.completed_step_count || 0)} of ${Number(plan.step_count || 0)} steps</span><strong>${percent}%</strong></div><div class="runtime-progress"><i style="width:${Math.max(0, Math.min(100, percent))}%"></i></div></div>
                <div class="runtime-step-chips">${planSteps.map((step) => `<span class="${statusTone(step.state)}"><b>${Number(step.sequence_number)}</b>${escapeHtml(humanize(step.tool_key))}</span>`).join("")}</div>
                <footer><span>Updated ${escapeHtml(relativeDate(plan.updated_at_utc))}${plan.failure_code ? ` · ${escapeHtml(humanize(plan.failure_code))}` : ""}</span>${cancellable ? `<button class="button danger" type="button" data-runtime-cancel-plan="${escapeHtml(plan.plan_id)}" data-runtime-plan-title="${escapeHtml(plan.title)}">Cancel plan</button>` : ""}</footer>
              </article>`;
            }).join("")}</div>`;
          }

          function renderStepQueue() {
            const steps = values(runtimeState.runtime?.steps);
            const planMap = new Map(values(runtimeState.runtime?.plans).map((plan) => [plan.plan_id, plan.title]));
            if (!steps.length) return `<div class="runtime-empty compact"><strong>No step history</strong><p>Queued and completed tool steps will appear here.</p></div>`;
            return `<div class="runtime-table"><div class="runtime-table-head"><span>Order</span><span>Plan</span><span>Tool</span><span>State</span><span>Result</span><span>Updated</span></div>${steps.slice(0, 40).map((step) => `<div class="runtime-table-row"><strong>${Number(step.sequence_number)}</strong><span>${escapeHtml(planMap.get(step.plan_id) || "Runtime plan")}</span><code>${escapeHtml(step.tool_key)}</code>${statusBadge(step.state)}<span>${escapeHtml(humanize(step.result_code || step.failure_code || "pending"))}</span><span>${escapeHtml(relativeDate(step.completed_at_utc || step.started_at_utc || step.created_at_utc))}</span></div>`).join("")}</div>`;
          }

          function renderTools() {
            const tools = values(runtimeState.runtime?.tools);
            if (!tools.length) return `<div class="runtime-empty compact"><strong>No active runtime tools</strong><p>The local catalog is unavailable.</p></div>`;
            return `<div class="runtime-tool-grid">${tools.map((tool) => `<article><div><span>${icon(tool.risk_class === "read_only" ? "eye" : "shield", 18)}</span>${statusBadge(tool.state)}</div><h3>${escapeHtml(tool.tool_key)}</h3><p>${escapeHtml(tool.description)}</p><dl><div><dt>Risk</dt><dd>${escapeHtml(humanize(tool.risk_class))}</dd></div><div><dt>Approval</dt><dd>${escapeHtml(humanize(tool.approval_requirement))}</dd></div><div><dt>Timeout</dt><dd>${Number(tool.max_execution_seconds || 0)} seconds</dd></div><div><dt>Version</dt><dd>${escapeHtml(tool.version)}</dd></div></dl></article>`).join("")}</div>`;
          }

          function renderAuthority() {
            const authority = runtimeState.authority || {};
            const agents = values(authority.agents);
            const assignments = values(authority.assignments);
            const proposals = values(authority.proposals);
            const approvals = pendingApprovals();
            const stops = activeStops();
            const proposalMap = new Map(proposals.map((proposal) => [proposal.proposal_id, proposal]));
            return `<div class="runtime-authority-grid">
              <article class="panel"><div class="panel-title"><div>${icon("agent", 18)}<div><h2>Authorized Agents</h2><p>Current Phase 16D identities and wrapper assignments.</p></div></div><span>${agents.filter((agent) => agent.state === "active").length} active</span></div><div class="runtime-authority-list">${agents.length ? agents.slice(0, 12).map((agent) => `<div><span class="runtime-authority-icon">${icon("agent", 17)}</span><p><strong>${escapeHtml(agent.display_name)}</strong><small>${escapeHtml(agent.purpose)} · autonomy ${Number(agent.autonomy_level || 0)} · ${assignments.filter((assignment) => assignment.agent_id === agent.agent_id && assignment.state === "active").length} active assignments</small></p>${statusBadge(agent.state)}</div>`).join("") : `<div class="runtime-empty compact"><strong>No HomeServer agents</strong><p>Create and assign an agent before runtime work can begin.</p></div>`}</div></article>
              <article class="panel"><div class="panel-title"><div>${icon("shield", 18)}<div><h2>Approvals & Stops</h2><p>Sensitive actions stay on the separate supervised lifecycle.</p></div></div><span>${approvals.length + stops.length} need attention</span></div><div class="runtime-supervision-list">${approvals.map((approval) => { const proposal = proposalMap.get(approval.proposal_id); return `<div class="approval"><span>${icon("warning", 17)}</span><p><strong>${escapeHtml(proposal?.title || "Action approval")}</strong><small>${escapeHtml(humanize(proposal?.action_type || "sensitive action"))} · expires ${escapeHtml(formatDate(approval.expires_at_utc))}</small></p>${statusBadge(approval.state)}</div>`; }).join("")}${stops.map((stop) => `<div class="stop"><span>${icon("power", 17)}</span><p><strong>${escapeHtml(humanize(stop.scope_type))} emergency stop</strong><small>${escapeHtml(stop.reason)}${stop.expires_at_utc ? ` · expires ${escapeHtml(formatDate(stop.expires_at_utc))}` : ""}</small></p>${statusBadge(stop.state)}</div>`).join("")}${!approvals.length && !stops.length ? `<div class="runtime-empty compact"><strong>No pending approvals or active stops</strong><p>Supervised authority is clear.</p></div>` : ""}</div><button class="button secondary full" type="button" data-runtime-open-agent>${icon("agent", 16)}Open Agent Control Center</button></article>
            </div>`;
          }

          function renderReceipts() {
            const receipts = values(runtimeState.runtime?.receipts);
            if (!receipts.length) return `<div class="runtime-empty compact"><strong>No runtime receipts</strong><p>Immutable per-step evidence will appear after work completes or fails.</p></div>`;
            return `<div class="runtime-receipt-list">${receipts.slice(0, 30).map((receipt) => `<div><span class="runtime-receipt-icon">${icon(receipt.outcome === "success" ? "check" : "warning", 17)}</span><p><strong>${escapeHtml(receipt.tool_key)}</strong><small>${escapeHtml(humanize(receipt.result_code))} · ${escapeHtml(relativeDate(receipt.completed_at_utc))}</small></p>${statusBadge(receipt.outcome)}<code title="Runtime receipt hash">${escapeHtml(compactHash(receipt.runtime_receipt_hash))}</code></div>`).join("")}</div>`;
          }

          function renderRuntimePage() {
            if (!isRuntimeRoute()) return;
            ensureRuntimeNavigation();
            const canvas = document.querySelector(".page-canvas");
            if (!canvas) return;
            const runtime = runtimeState.runtime || {};
            const tools = values(runtime.tools);
            const receipts = values(runtime.receipts);
            const agents = values(runtimeState.authority?.agents);
            const loading = runtimeState.busy && !runtimeState.runtime;
            canvas.innerHTML = `<div class="runtime-control-center">
              ${runtimeState.error ? `<div class="notice warning"><strong>Agent Runtime:</strong> ${escapeHtml(runtimeState.error)}</div>` : ""}
              <header class="page-header"><div><h1>Agent Runtime</h1><p>Authorized local plans, tool execution, approvals, emergency stops, and immutable evidence.</p></div><div class="page-actions"><button class="button secondary" type="button" data-runtime-refresh ${runtimeState.busy ? "disabled" : ""}>${icon("refresh", 16)}Refresh</button><button class="button primary" type="button" data-runtime-run-once ${runtimeState.busy ? "disabled" : ""}>${icon("play", 16)}Run one cycle</button></div></header>
              ${loading ? `<div class="runtime-loading"><span></span><strong>Loading authorized runtime state…</strong></div>` : `
                <section class="metrics six-up">
                  ${metric("activity", "Runtime", humanize(runtime.runtime_state || "offline"), runtime.worker_id ? "Persistent local worker" : "Worker unavailable", runtime.runtime_state === "active" ? "green" : "amber")}
                  ${metric("agent", "Active Agents", String(agents.filter((agent) => agent.state === "active").length), `${agents.length} registered identities`, "blue")}
                  ${metric("play", "Active Plans", String(activePlans().length), `${queuedSteps().length} queued or running steps`, activePlans().length ? "purple" : "gray")}
                  ${metric("shield", "Pending Approvals", String(pendingApprovals().length), "Sensitive lifecycle only", pendingApprovals().length ? "amber" : "green")}
                  ${metric("warning", "Failures", String(failedWorkCount()), `${activeStops().length} active emergency stops`, failedWorkCount() || activeStops().length ? "amber" : "green")}
                  ${metric("logs", "Receipts", String(receipts.length), `${tools.length} cataloged tools`, "teal")}
                </section>
                ${renderSafetyBoundary(runtime)}
                <section class="runtime-primary-grid"><article class="panel runtime-plans-panel"><div class="panel-title"><div>${icon("activity", 18)}<div><h2>Runtime Plans</h2><p>Ordered low-risk work submitted through the Phase 16C job contract.</p></div></div><span>${values(runtime.plans).length} plans</span></div>${renderPlans()}</article><article class="panel runtime-tools-panel"><div class="panel-title"><div>${icon("apps", 18)}<div><h2>Tool Catalog</h2><p>HomeServer-owned, versioned, risk-classified adapters.</p></div></div><span>${tools.length} tools</span></div>${renderTools()}</article></section>
                ${renderAuthority()}
                <section class="runtime-bottom-grid"><article class="panel"><div class="panel-title"><div>${icon("activity", 18)}<div><h2>Step Queue & History</h2><p>Exact order, state, tool, result code, and completion time.</p></div></div><span>${values(runtime.steps).length} steps</span></div>${renderStepQueue()}</article><article class="panel"><div class="panel-title"><div>${icon("logs", 18)}<div><h2>Immutable Runtime Receipts</h2><p>Hash-only evidence linked to the Phase 16C job receipt.</p></div></div><span>${receipts.length} receipts</span></div>${renderReceipts()}</article></section>
              `}
              <footer class="app-footer"><span>Local-only authorized runtime</span><span>${runtimeState.lastLoadedAt ? `Updated: ${escapeHtml(new Date(runtimeState.lastLoadedAt).toLocaleString())}` : "Not loaded"}</span></footer>
            </div>`;
          }

          async function refreshRuntime(quiet = false) {
            if (runtimeState.busy) return;
            runtimeState.busy = true;
            runtimeState.error = null;
            if (!quiet) renderRuntimePage();
            const results = await Promise.allSettled([
              invoke("homeserver_agent_runtime"),
              invoke("homeserver_agent_authority"),
            ]);
            if (results[0].status === "fulfilled") runtimeState.runtime = results[0].value;
            if (results[1].status === "fulfilled") runtimeState.authority = results[1].value;
            const errors = results.filter((result) => result.status === "rejected").map((result) => String(result.reason));
            runtimeState.error = errors.length ? errors.join(" · ") : null;
            runtimeState.lastLoadedAt = Date.now();
            runtimeState.busy = false;
            renderRuntimePage();
          }

          async function runOneCycle() {
            if (runtimeState.busy) return;
            runtimeState.busy = true;
            runtimeState.error = null;
            renderRuntimePage();
            try {
              runtimeState.runtime = await invoke("homeserver_run_agent_runtime_once");
              const authority = await invoke("homeserver_agent_authority");
              runtimeState.authority = authority;
              runtimeState.lastLoadedAt = Date.now();
            } catch (error) {
              runtimeState.error = String(error);
            } finally {
              runtimeState.busy = false;
              renderRuntimePage();
            }
          }

          async function cancelRuntimePlan(button) {
            if (runtimeState.busy) return;
            const planId = button.dataset.runtimeCancelPlan || "";
            const title = button.dataset.runtimePlanTitle || "this plan";
            const confirmation = window.prompt(`Type CANCEL PLAN ${planId} to cancel ${title}:`);
            if (confirmation !== `CANCEL PLAN ${planId}`) return;
            const reason = window.prompt("Reason for cancellation:", "Cancelled from Agent Runtime Control Center");
            if (reason === null || !reason.trim()) return;
            runtimeState.busy = true;
            runtimeState.error = null;
            renderRuntimePage();
            try {
              runtimeState.runtime = await invoke("homeserver_cancel_agent_runtime_plan", {
                planId,
                actorUserId: LOCAL_ACTOR,
                confirmation,
                reason: reason.trim(),
              });
              runtimeState.lastLoadedAt = Date.now();
            } catch (error) {
              runtimeState.error = String(error);
            } finally {
              runtimeState.busy = false;
              renderRuntimePage();
            }
          }

          document.addEventListener("click", (event) => {
            if (!(event.target instanceof Element)) return;
            const routeButton = event.target.closest("[data-agent-runtime-route]");
            if (routeButton) {
              event.preventDefault();
              window.location.hash = `#${RUNTIME_ROUTE}`;
              renderRuntimePage();
              void refreshRuntime(false);
              return;
            }
            const refreshButton = event.target.closest("[data-runtime-refresh]");
            if (refreshButton) {
              event.preventDefault();
              void refreshRuntime(false);
              return;
            }
            const runButton = event.target.closest("[data-runtime-run-once]");
            if (runButton) {
              event.preventDefault();
              void runOneCycle();
              return;
            }
            const cancelButton = event.target.closest("[data-runtime-cancel-plan]");
            if (cancelButton) {
              event.preventDefault();
              void cancelRuntimePlan(cancelButton);
              return;
            }
            const agentButton = event.target.closest("[data-runtime-open-agent]");
            if (agentButton) {
              event.preventDefault();
              window.location.hash = "#agent";
            }
          });

          window.addEventListener("hashchange", () => {
            ensureRuntimeNavigation();
            if (isRuntimeRoute()) {
              renderRuntimePage();
              if (Date.now() - runtimeState.lastLoadedAt > REFRESH_WINDOW_MS) void refreshRuntime(true);
            }
          });

          window.addEventListener("homeserver:rendered", () => {
            ensureRuntimeNavigation();
            if (!isRuntimeRoute()) return;
            renderRuntimePage();
            if (Date.now() - runtimeState.lastLoadedAt > REFRESH_WINDOW_MS) void refreshRuntime(true);
          });

          ensureRuntimeNavigation();
          if (isRuntimeRoute()) void refreshRuntime(false);
          '''
          (ROOT / "src/agent-runtime-control-center.js").write_text(control_center_js, encoding="utf-8")

          control_center_css = r'''.runtime-control-center { min-width: 0; }
          .runtime-boundary { display: grid; grid-template-columns: minmax(300px, .8fr) minmax(520px, 1.2fr); gap: 22px; align-items: center; margin-bottom: 16px; padding: 20px; border: 1px solid #bfe4cc; border-radius: 14px; background: linear-gradient(135deg, #f0fbf4, #fbfefd); box-shadow: var(--shadow); }
          .runtime-boundary.unsafe { border-color: #efc1c5; background: linear-gradient(135deg, #fff1f2, #fffafa); }
          .runtime-boundary-copy { display: flex; gap: 13px; align-items: flex-start; }
          .runtime-boundary-copy > span { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 12px; color: var(--green); background: white; box-shadow: 0 8px 20px rgba(29, 120, 72, .1); }
          .runtime-boundary.unsafe .runtime-boundary-copy > span { color: var(--red); }
          .runtime-boundary-copy strong { display: block; font-size: 15px; letter-spacing: -.02em; }
          .runtime-boundary-copy p { margin-top: 7px; color: var(--muted); font-size: 11px; line-height: 1.55; }
          .runtime-safety-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 9px; }
          .runtime-safety-item { display: flex; gap: 8px; align-items: center; min-width: 0; padding: 11px; border: 1px solid #dfe9e3; border-radius: 10px; background: rgba(255,255,255,.9); }
          .runtime-safety-item > span { color: var(--green); }
          .runtime-safety-item.failed > span { color: var(--red); }
          .runtime-safety-item strong, .runtime-safety-item small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
          .runtime-safety-item strong { font-size: 10px; }
          .runtime-safety-item small { margin-top: 3px; color: var(--muted); font-size: 8px; }
          .runtime-primary-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(330px, .55fr); gap: 16px; margin-bottom: 16px; }
          .runtime-bottom-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(340px, .75fr); gap: 16px; margin-top: 16px; }
          .runtime-plans-panel, .runtime-tools-panel { min-height: 410px; }
          .runtime-plan-list { display: grid; gap: 10px; max-height: 610px; overflow: auto; padding-right: 3px; }
          .runtime-plan-card { padding: 15px; border: 1px solid #e0e7f0; border-radius: 12px; background: #fbfcff; }
          .runtime-plan-heading { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
          .runtime-plan-heading span:first-child { color: var(--muted); font-size: 8px; font-weight: 750; text-transform: uppercase; letter-spacing: .08em; }
          .runtime-plan-heading h3 { margin-top: 4px; font-size: 14px; letter-spacing: -.02em; }
          .runtime-plan-card > p { margin-top: 8px; color: #54617a; font-size: 10px; line-height: 1.45; }
          .runtime-plan-progress { margin-top: 13px; }
          .runtime-plan-progress > div:first-child { display: flex; justify-content: space-between; color: var(--muted); font-size: 9px; }
          .runtime-plan-progress strong { color: var(--blue); }
          .runtime-progress { height: 6px; margin-top: 6px; overflow: hidden; border-radius: 999px; background: #e8edf5; }
          .runtime-progress i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg, var(--blue), #6493ff); }
          .runtime-step-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 11px; }
          .runtime-step-chips span { display: inline-flex; align-items: center; gap: 5px; padding: 5px 8px; border-radius: 999px; background: #eef2f7; color: #58657b; font-size: 8px; }
          .runtime-step-chips span.success { background: var(--green-soft); color: #237c49; }
          .runtime-step-chips span.warning { background: var(--amber-soft); color: #8a6113; }
          .runtime-step-chips span.danger { background: var(--red-soft); color: #ad3541; }
          .runtime-step-chips b { display: grid; place-items: center; width: 15px; height: 15px; border-radius: 50%; background: rgba(255,255,255,.8); font-size: 7px; }
          .runtime-plan-card footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 13px; padding-top: 11px; border-top: 1px solid #e6ebf2; }
          .runtime-plan-card footer > span { color: var(--muted); font-size: 8px; }
          .runtime-plan-card footer .button { min-height: 30px; padding: 5px 9px; font-size: 9px; }
          .runtime-tool-grid { display: grid; gap: 9px; max-height: 610px; overflow: auto; }
          .runtime-tool-grid article { padding: 14px; border: 1px solid #e0e7f0; border-radius: 11px; background: #fbfcff; }
          .runtime-tool-grid article > div:first-child { display: flex; align-items: center; justify-content: space-between; }
          .runtime-tool-grid article > div:first-child > span:first-child { display: grid; place-items: center; width: 33px; height: 33px; border-radius: 9px; background: var(--blue-soft); color: var(--blue); }
          .runtime-tool-grid h3 { margin-top: 11px; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 11px; }
          .runtime-tool-grid p { margin-top: 6px; min-height: 30px; color: var(--muted); font-size: 9px; line-height: 1.45; }
          .runtime-tool-grid dl { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 11px; }
          .runtime-tool-grid dl div { padding: 8px; border-radius: 8px; background: white; }
          .runtime-tool-grid dt { color: var(--muted); font-size: 7px; text-transform: uppercase; letter-spacing: .06em; }
          .runtime-tool-grid dd { margin-top: 4px; font-size: 9px; font-weight: 700; }
          .runtime-authority-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
          .runtime-authority-list, .runtime-supervision-list, .runtime-receipt-list { display: grid; gap: 8px; }
          .runtime-authority-list > div, .runtime-supervision-list > div, .runtime-receipt-list > div { display: flex; align-items: center; gap: 10px; min-width: 0; padding: 10px; border: 1px solid #e4eaf2; border-radius: 10px; background: #fbfcfe; }
          .runtime-authority-icon, .runtime-receipt-icon, .runtime-supervision-list > div > span:first-child { display: grid; place-items: center; width: 32px; height: 32px; border-radius: 9px; background: var(--blue-soft); color: var(--blue); }
          .runtime-supervision-list .stop > span:first-child { background: var(--red-soft); color: var(--red); }
          .runtime-supervision-list .approval > span:first-child { background: var(--amber-soft); color: var(--amber); }
          .runtime-authority-list p, .runtime-supervision-list p, .runtime-receipt-list p { min-width: 0; flex: 1; }
          .runtime-authority-list strong, .runtime-authority-list small, .runtime-supervision-list strong, .runtime-supervision-list small, .runtime-receipt-list strong, .runtime-receipt-list small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
          .runtime-authority-list strong, .runtime-supervision-list strong, .runtime-receipt-list strong { font-size: 10px; }
          .runtime-authority-list small, .runtime-supervision-list small, .runtime-receipt-list small { margin-top: 4px; color: var(--muted); font-size: 8px; }
          .runtime-supervision-list + .button { margin-top: 12px; }
          .runtime-status { display: inline-flex; align-items: center; gap: 5px; min-height: 23px; padding: 4px 7px; border-radius: 999px; background: #eef2f7; color: #5c687a; font-size: 8px; font-weight: 750; white-space: nowrap; text-transform: capitalize; }
          .runtime-status i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
          .runtime-status.success { background: var(--green-soft); color: #247d49; }
          .runtime-status.warning { background: var(--amber-soft); color: #8d6312; }
          .runtime-status.danger { background: var(--red-soft); color: #ad3541; }
          .runtime-table { min-width: 720px; overflow: hidden; border: 1px solid #e3e9f1; border-radius: 10px; }
          .runtime-table-head, .runtime-table-row { display: grid; grid-template-columns: 50px minmax(150px, 1.1fr) minmax(135px, .9fr) 105px minmax(120px, .8fr) 90px; align-items: center; gap: 10px; padding: 9px 11px; }
          .runtime-table-head { background: #f4f7fb; color: var(--muted); font-size: 8px; font-weight: 750; text-transform: uppercase; letter-spacing: .06em; }
          .runtime-table-row { border-top: 1px solid #e7ecf3; font-size: 9px; }
          .runtime-table-row > span, .runtime-table-row > code { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
          .runtime-table-row code { color: #395d9b; font-size: 8px; }
          .runtime-receipt-list { max-height: 480px; overflow: auto; }
          .runtime-receipt-list code { color: #5e6c82; font-size: 8px; }
          .runtime-empty { display: grid; place-items: center; min-height: 220px; padding: 28px; color: var(--muted); text-align: center; }
          .runtime-empty.compact { min-height: 120px; }
          .runtime-empty svg { color: #8aa6dc; }
          .runtime-empty strong { margin-top: 8px; color: var(--ink); font-size: 12px; }
          .runtime-empty p { max-width: 420px; margin-top: 6px; font-size: 9px; line-height: 1.5; }
          .runtime-loading { display: flex; align-items: center; justify-content: center; gap: 11px; min-height: 420px; color: var(--muted); }
          .runtime-loading span { width: 20px; height: 20px; border: 3px solid #dbe4f2; border-top-color: var(--blue); border-radius: 50%; animation: runtime-spin .8s linear infinite; }
          @keyframes runtime-spin { to { transform: rotate(360deg); } }
          @media (max-width: 1250px) {
            .runtime-boundary { grid-template-columns: 1fr; }
            .runtime-primary-grid, .runtime-bottom-grid { grid-template-columns: 1fr; }
            .runtime-safety-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
          }
          '''
          (ROOT / "src/agent-runtime-control-center.css").write_text(control_center_css, encoding="utf-8")

          replace_once(
              ROOT / "index.html",
              '    <script type="module" src="/src/review-intelligence.js"></script>\n    <script type="module" src="/src/cloud-connections.js"></script>',
              '    <script type="module" src="/src/review-intelligence.js"></script>\n    <script type="module" src="/src/agent-runtime-control-center.js"></script>\n    <script type="module" src="/src/cloud-connections.js"></script>',
              "runtime Control Center script",
          )

          package_path = ROOT / "package.json"
          package = json.loads(package_path.read_text(encoding="utf-8"))
          check = package["scripts"]["check:frontend"]
          runtime_check = "node --check src/agent-runtime-control-center.js"
          if runtime_check not in check:
              marker = "node --check src/icons.js"
              if marker not in check:
                  raise SystemExit("missing frontend check insertion marker")
              package["scripts"]["check:frontend"] = check.replace(marker, f"{runtime_check} && {marker}", 1)
          package_path.write_text(json.dumps(package, indent=2) + "\n", encoding="utf-8")

          validator = ROOT / "scripts/validate-wrapper-runtime.py"
          replace_once(
              validator,
              'DOC = ROOT / "docs/phase-17-authorized-agent-tool-runtime.md"\n',
              'DOC = ROOT / "docs/phase-17-authorized-agent-tool-runtime.md"\nTAURI_RUNTIME = ROOT / "src-tauri/src/runtime.rs"\nTAURI_LIB = ROOT / "src-tauri/src/lib.rs"\nCONTROL_CENTER = ROOT / "src/agent-runtime-control-center.js"\nINDEX = ROOT / "index.html"\nPACKAGE = ROOT / "package.json"\n',
              "validator UI paths",
          )
          replace_once(
              validator,
              'doc = DOC.read_text(encoding="utf-8")\njob_sources = "\\n".join([jobs, submit, workers, completion])\n',
              'doc = DOC.read_text(encoding="utf-8")\ntauri_runtime = TAURI_RUNTIME.read_text(encoding="utf-8")\ntauri_lib = TAURI_LIB.read_text(encoding="utf-8")\ncontrol_center = CONTROL_CENTER.read_text(encoding="utf-8")\nindex = INDEX.read_text(encoding="utf-8")\npackage = PACKAGE.read_text(encoding="utf-8")\njob_sources = "\\n".join([jobs, submit, workers, completion])\n',
              "validator UI reads",
          )
          ui_checks = '''\nfor bridge in [\n    "homeserver_agent_runtime",\n    "homeserver_agent_authority",\n    "homeserver_run_agent_runtime_once",\n    "homeserver_cancel_agent_runtime_plan",\n    "/v1/agent-runtime",\n    "/v1/agents",\n]:\n    require(bridge in tauri_runtime, f"missing trusted runtime bridge {bridge}")\n    require(bridge in tauri_lib or bridge.startswith("/v1/"), f"runtime bridge is not registered {bridge}")\n\nfor surface in [\n    "data-agent-runtime-route",\n    "Agent Runtime",\n    "homeserver:rendered",\n    "homeserver_agent_runtime",\n    "homeserver_agent_authority",\n    "homeserver_run_agent_runtime_once",\n    "homeserver_cancel_agent_runtime_plan",\n    "Phase 16 authority boundary is intact",\n    "Private inputs",\n    "Private results",\n    "Direct tool bypass",\n    "Phase 16E egress",\n    "Runtime Plans",\n    "Approvals & Stops",\n    "Immutable Runtime Receipts",\n]:\n    require(surface in control_center, f"missing Control Center runtime surface {surface}")\n\nrequire("MutationObserver" not in control_center, "runtime UI reintroduced an observer network")\nrequire("fetch(" not in control_center, "runtime UI bypasses the trusted Tauri local client")\nrequire("/src/agent-runtime-control-center.js" in index, "runtime Control Center module is not loaded")\nrequire("node --check src/agent-runtime-control-center.js" in package, "runtime UI is not in frontend validation")\n'''
          replace_once(
              validator,
              'for forbidden in [\n',
              ui_checks + '\nfor forbidden in [\n',
              "validator UI contract",
          )
          replace_once(
              validator,
              '    "Immutable evidence",\n    "10/10 certification gates",',
              '    "Immutable evidence",\n    "Control Center visibility",\n    "10/10 certification gates",',
              "validator documentation phrase",
          )

          doc_path = ROOT / "docs/phase-17-authorized-agent-tool-runtime.md"
          doc_text = doc_path.read_text(encoding="utf-8")
          if "## Control Center visibility" not in doc_text:
              marker = "## Deployment\n"
              section = '''## Control Center visibility\n\nThe desktop Control Center includes an **Agent Runtime** page loaded through the existing explicit `homeserver:rendered` lifecycle. It does not add a DOM observer network.\n\nThe page uses a narrow trusted Tauri bridge because browser-originated requests are intentionally rejected by the loopback API. It shows:\n\n- active HomeServer agents and wrapper assignments;\n- runtime state, active plans, ordered steps, failures, and completion progress;\n- the versioned low-risk tool catalog;\n- pending Phase 16D approvals and active emergency stops without merging those sensitive actions into the low-risk runtime;\n- immutable runtime receipt hashes linked to Phase 16C evidence;\n- explicit privacy indicators confirming that private inputs and full private results are hidden, direct tool bypass is disabled, and Phase 16E egress remains mandatory.\n\nOperators can refresh state, run one bounded runtime cycle, open the supervised Agent Control Center, and cancel an active runtime plan only after entering the exact `CANCEL PLAN <plan_id>` confirmation. No raw private job input or full result is rendered.\n\n'''
              if marker not in doc_text:
                  raise SystemExit("missing documentation deployment marker")
              doc_path.write_text(doc_text.replace(marker, section + marker, 1), encoding="utf-8")
          PY
          cargo fmt --all
          node --check src/agent-runtime-control-center.js
          python scripts/validate-wrapper-runtime.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase17-control-center-ui-once.yml
          git add -A
          git commit -m "Add Phase 17 Agent Runtime Control Center"
          git push origin HEAD:feature/phase-17-authorized-agent-tool-runtime
