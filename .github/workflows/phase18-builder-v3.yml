name: Phase 18 Builder V3

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/phase18-builder-v3.yml]

permissions:
  contents: write

concurrency:
  group: phase18-builder-v3
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: feature/phase-18-supervised-action-orchestration
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Assemble and repair Phase 18
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip, hashlib
          from pathlib import Path
          names = ['00','01','02','03','04a','04b']
          payload = ''.join((Path('scripts') / f'.phase18-part-{name}').read_text() for name in names)
          assert len(payload) == 53872
          assert hashlib.sha256(payload.encode()).hexdigest() == '8bb06a07e9ac535779981ccfa5df5a48fdf19076a81fd94b8177cce1a21aca36'
          Path('scripts/phase18-branch-builder.py').write_bytes(gzip.decompress(base64.b64decode(payload, validate=True)))
          PY
          python scripts/phase18-branch-builder.py
          python - <<'PY'
          from pathlib import Path

          p = Path('crates/homeserver-service/src/app/wrapper_agents.rs')
          t = p.read_text()
          old = 'fn create_proposal(connection: &Connection, request: CreateProposalRequest) -> Result<String> {'
          new = 'pub(crate) fn create_proposal(connection: &Connection, request: CreateProposalRequest) -> Result<String> {'
          if new not in t:
              assert old in t
              t = t.replace(old, new, 1)
          p.write_text(t)

          p = Path('crates/homeserver-service/src/app/wrapper_runtime.rs')
          t = p.read_text()
          old = 'fn create_plan(state: &AppState, request: CreateRuntimePlanRequest) -> Result<String> {'
          new = 'pub(crate) fn create_plan(state: &AppState, request: CreateRuntimePlanRequest) -> Result<String> {'
          if new not in t:
              assert old in t
              t = t.replace(old, new, 1)
          p.write_text(t)

          p = Path('crates/homeserver-service/src/app/wrapper_orchestration.rs')
          t = p.read_text()
          scan = '''        statement
            .query_map([], |row| row.get::<_, String>(0))?
            .collect::<rusqlite::Result<Vec<_>>>()?
    };'''
          owned = '''        let rows = statement
            .query_map([], |row| row.get::<_, String>(0))?
            .collect::<rusqlite::Result<Vec<_>>>()?;
        rows
    };'''
          assert t.count(scan) == 2
          t = t.replace(scan, owned)
          old = '''    if transaction
        .query_row(
            "SELECT compensation_receipt_id FROM agent_supervised_compensation_receipts WHERE checkpoint_id=?1",
            params![&checkpoint_id],
            |row| row.get::<_, String>(0),
        )
        .optional()?
        .is_some()
    {'''
          new = '''    let existing_compensation_receipt: Option<String> = transaction
        .query_row(
            "SELECT compensation_receipt_id FROM agent_supervised_compensation_receipts WHERE checkpoint_id=?1",
            params![&checkpoint_id],
            |row| row.get::<_, String>(0),
        )
        .optional()?;
    if existing_compensation_receipt.is_some() {'''
          assert old in t
          t = t.replace(old, new, 1)
          anchor = '''fn timestamp(value: DateTime<Utc>) -> String {
    value.to_rfc3339_opts(SecondsFormat::Millis, true)
}
'''
          parser = anchor + '''
fn parse_utc(value: &str, label: &str) -> Result<DateTime<Utc>> {
    DateTime::parse_from_rfc3339(value)
        .with_context(|| format!("{label} is invalid"))
        .map(|value| value.with_timezone(&Utc))
}
'''
          assert anchor in t and 'fn parse_utc(' not in t
          t = t.replace(anchor, parser, 1)
          p.write_text(t)
          PY
          cargo fmt --all
      - name: Validate and test
        run: |
          npm ci
          python scripts/validate-supervised-orchestration.py
          python scripts/validate-wrapper-agents.py
          python scripts/validate-wrapper-runtime.py
          python scripts/validate-wrapper-privacy.py
          npm run check:frontend
          npm run build
          cargo fmt --all -- --check
          cargo test -p microgifter-homeserver-service
          cargo test -p microgifter-homeserver-service --test phase18_supervised_orchestration_contract
          cargo clippy -p microgifter-homeserver-service --all-targets -- -D warnings -A dead_code -A unused_imports -A unused_variables -A unused_mut
      - name: Commit clean implementation
        shell: bash
        run: |
          rm -f scripts/.phase18-* scripts/phase18-branch-builder.py docs/.phase18-staging-marker.md
          rm -f .github/workflows/phase18-branch-builder.yml .github/workflows/phase18-builder-v2.yml .github/workflows/phase18-builder-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Build Phase 18 supervised action orchestration"
          git push
