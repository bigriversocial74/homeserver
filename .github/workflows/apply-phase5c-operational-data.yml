name: Apply Phase 5C operational data integration

on:
  push:
    branches:
      - feature/phase-5c-operational-data-import-20260727
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase5c-operational-data-integration
  cancel-in-progress: true

jobs:
  integrate:
    if: github.head_ref == 'feature/phase-5c-operational-data-import-20260727' || github.ref == 'refs/heads/feature/phase-5c-operational-data-import-20260727'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out Phase 5C branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-5c-operational-data-import-20260727
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Apply deterministic integration patch
        shell: pwsh
        run: |
          if (Select-String -Path crates/homeserver-service/src/main.rs -Pattern '^mod operational_data;$' -Quiet) {
            "Phase 5C integration is already applied." | Tee-Object phase5c-integration.log
          } else {
            python scripts/fix-phase5c-integration-script.py *> phase5c-integration.log
            if ($LASTEXITCODE -ne 0) {
              Get-Content phase5c-integration.log -Tail 400
              exit $LASTEXITCODE
            }
            python scripts/apply-phase5c-operational-data.py *>> phase5c-integration.log
            if ($LASTEXITCODE -ne 0) {
              Get-Content phase5c-integration.log -Tail 400
              exit $LASTEXITCODE
            }
            python scripts/fix-phase5c-rust-quality.py *>> phase5c-integration.log
            if ($LASTEXITCODE -ne 0) {
              Get-Content phase5c-integration.log -Tail 400
              exit $LASTEXITCODE
            }
          }
          python scripts/apply-phase5c-smoke.py *>> phase5c-integration.log
          $exitCode = $LASTEXITCODE
          Get-Content phase5c-integration.log -Tail 400
          if ($exitCode -ne 0) { exit $exitCode }

      - name: Validate frontend, PowerShell, and Phase 5C contract
        shell: pwsh
        run: |
          npm ci
          npm run check:frontend
          npm run build
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/smoke-test-service.ps1), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Phase 5C smoke test PowerShell syntax validation failed"
          }

      - name: Format and test service
        shell: pwsh
        run: |
          cargo fmt --all
          cargo test --package microgifter-homeserver-service --locked *> phase5c-service-tests.log
          if ($LASTEXITCODE -ne 0) { Get-Content phase5c-service-tests.log -Tail 300; exit $LASTEXITCODE }
          cargo clippy --package microgifter-homeserver-service --all-targets --locked -- -D warnings *> phase5c-service-clippy.log
          if ($LASTEXITCODE -ne 0) { Get-Content phase5c-service-clippy.log -Tail 300; exit $LASTEXITCODE }

      - name: Commit compiler-verified integration
        shell: pwsh
        run: |
          git config user.name "Microgifter Build Agent"
          git config user.email "build-agent@microgifter.local"
          git add crates/homeserver-service/src/main.rs crates/homeserver-service/src/app.rs crates/homeserver-service/src/agent_runtime.rs crates/homeserver-service/src/operational_data.rs src-tauri/src/lib.rs index.html package.json src/agent-workspace.js scripts/smoke-test-service.ps1
          if (git diff --cached --quiet) {
            Write-Host "No integration changes to commit."
            exit 0
          }
          git commit -m "Integrate Phase 5C operational data foundation"
          git push origin HEAD:feature/phase-5c-operational-data-import-20260727

      - name: Upload focused validation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5c-focused-validation
          path: |
            phase5c-integration.log
            phase5c-service-tests.log
            phase5c-service-clippy.log
          if-no-files-found: warn
          retention-days: 7
