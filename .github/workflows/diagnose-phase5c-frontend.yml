name: Diagnose Phase 5C frontend validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feature/phase-5c-operational-data-import-20260727'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Capture frontend and PowerShell validation
        shell: pwsh
        run: |
          $failed = $false
          npm run check:frontend *> phase5c-frontend-validation.log
          if ($LASTEXITCODE -ne 0) {
            $failed = $true
          }
          foreach ($script in Get-ChildItem scripts -Filter "*.ps1") {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              "PowerShell parser errors in $($script.Name):" | Out-File phase5c-frontend-validation.log -Append
              $errors | ForEach-Object { $_.Message | Out-File phase5c-frontend-validation.log -Append }
              $failed = $true
            }
          }
          Get-Content phase5c-frontend-validation.log -Tail 500
          if ($failed) { exit 1 }

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5c-frontend-validation
          path: phase5c-frontend-validation.log
          if-no-files-found: warn
          retention-days: 7
