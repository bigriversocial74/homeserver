name: Diagnose Phase 5B frontend validation

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'feature/phase-5b-agent-workspace-approvals-world-missions-20260727'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: npm ci

      - name: Capture frontend and PowerShell validation
        shell: pwsh
        run: |
          npm run validate:frontend *> phase5b-frontend-validation.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            Get-Content phase5b-frontend-validation.log -Tail 400
          }
          exit $exitCode

      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase5b-frontend-validation
          path: phase5b-frontend-validation.log
          if-no-files-found: warn
          retention-days: 7
