name: Phase 4C Rust Audit Diagnostic

on:
  pull_request:
    branches:
      - main

concurrency:
  group: phase4c-rust-audit-diagnostic
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    steps:
      - name: Check out exact head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      - name: Restore Production Quality Rust cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-audit.exe
            target
          key: windows-cargo-${{ hashFiles('Cargo.toml', '**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: windows-cargo-
      - name: Install cargo-audit when absent
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-audit -ErrorAction SilentlyContinue)) {
            cargo install cargo-audit --version 0.22.2 --locked
          }
      - name: Capture audit report
        shell: cmd
        continue-on-error: true
        run: cargo audit > cargo-audit.txt 2>&1
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b540449e92b4886f43607fa02
        with:
          name: phase4c-rust-audit
          path: cargo-audit.txt
          if-no-files-found: error
          retention-days: 1
