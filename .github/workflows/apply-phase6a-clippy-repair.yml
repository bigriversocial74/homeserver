name: Apply Phase 6A Clippy repair

on:
  push:
    branches:
      - feature/microgifter-entitlement-update-client-v1-20260728

permissions:
  contents: write

concurrency:
  group: phase6a-clippy-repair
  cancel-in-progress: false

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out Phase 6A branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/microgifter-entitlement-update-client-v1-20260728
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy

      - name: Restore Rust cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: phase6a-clippy-${{ runner.os }}-${{ hashFiles('Cargo.toml', '**/Cargo.toml', 'Cargo.lock') }}
          restore-keys: phase6a-clippy-${{ runner.os }}-

      - name: Apply deterministic Clippy repair
        shell: python
        run: |
          from pathlib import Path

          path = Path("crates/homeserver-service/src/microgifter_connection.rs")
          text = path.read_text(encoding="utf-8")

          replacements = [
              (
                  """pub fn health_check(connection: &Connection) -> Result<()> {
              for table in [""",
                  """pub fn health_check(connection: &Connection) -> Result<()> {
              ensure!(
                  !APPLICATION_ERROR_CODES.is_empty(),
                  "Phase 6A application error registry is unavailable"
              );
              for table in [""",
              ),
              (
                  """        let pending = rows.collect::<rusqlite::Result<Vec<_>>>()?;
              pending""",
                  """        rows.collect::<rusqlite::Result<Vec<_>>>()?""",
              ),
              (
                  "limit.max(1).min(100) as i64",
                  "limit.clamp(1, 100) as i64",
              ),
              (
                  """fn record_receipt(
              connection: &Connection,""",
                  """#[expect(
              clippy::too_many_arguments,
              reason = "durable receipt fields mirror the persisted audit schema"
          )]
          fn record_receipt(
              connection: &Connection,""",
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one Clippy repair anchor, found {count}: {old[:100]!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8", newline="\n")
          Path(".github/workflows/apply-phase6a-clippy-repair.yml").unlink()

      - name: Format and run strict Clippy
        shell: pwsh
        run: |
          cargo fmt --all
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --workspace --all-targets --locked -- -D warnings *> phase6a-clippy.log
          $status = $LASTEXITCODE
          Get-Content phase6a-clippy.log -Tail 260
          exit $status

      - name: Commit Clippy-verified repair
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/homeserver-service/src/microgifter_connection.rs .github/workflows/apply-phase6a-clippy-repair.yml
          git commit -m 'Repair Phase 6A strict Clippy findings'
          git push origin HEAD:feature/microgifter-entitlement-update-client-v1-20260728

      - name: Upload focused diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: phase6a-clippy-repair
          path: phase6a-clippy.log
          if-no-files-found: ignore
          retention-days: 7
