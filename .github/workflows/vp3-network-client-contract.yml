name: VP3 Network Client Contract

on:
  pull_request:
  push:
    branches:
      - main
      - feature/vp3-http-client-v1-20260729

permissions:
  contents: read

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt, clippy
      - name: Validate VP3 client boundaries
        run: python scripts/validate-vp3-network-client.py
      - name: Validate Rust formatting
        run: cargo fmt --all -- --check
      - name: Compile and test HomeServer service
        run: cargo test -p microgifter-homeserver-service --locked
      - name: Strict HomeServer service lint
        run: cargo clippy -p microgifter-homeserver-service --all-targets --locked -- -D warnings
