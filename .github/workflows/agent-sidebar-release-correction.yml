name: Agent Chat Sidebar Release Correction

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/agent-sidebar-release-correction.yml

permissions:
  contents: write

concurrency:
  group: agent-sidebar-release-correction-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  correct:
    if: github.event.pull_request.head.ref == 'feature/unified-homeserver-agent-orchestration'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: '1.97.0'
          components: rustfmt

      - name: Patch route contract and issue a new release identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import tomllib

          root = Path('.')
          old_version = '0.1.4'
          new_version = '0.1.5'

          main_path = root / 'src' / 'main.js'
          main = main_path.read_text(encoding='utf-8')
          old_pages = '''const pages = [
            ["dashboard", "Dashboard", "dashboard"],
            ["agent", "HomeServer Agent", "integrations"],
            ["home", "Home", "home"],
            ["apps", "Apps", "apps"],
            ["backups", "Backups", "backup"],
            ["integrations", "Integrations & Agents", "integrations"],
            ["knowledge", "Knowledge Vault", "vault"],
            ["models", "Model Center", "model"],
            ["settings", "Settings", "settings"],
            ["sync", "Sync Cloud", "cloud"],
            ["system", "System", "system"],
          ];'''
          new_pages = '''const pages = [
            ["agent", "HomeServer Agent", "integrations"],
            ["home", "Home", "home"],
            ["dashboard", "Dashboard", "dashboard"],
            ["models", "Model Center", "model"],
            ["apps", "Apps", "apps"],
            ["knowledge", "Knowledge Vault", "vault"],
            ["backups", "Backups", "backup"],
            ["integrations", "Integrations & Agents", "integrations"],
            ["settings", "Settings", "settings"],
            ["sync", "Sync Cloud", "cloud"],
            ["system", "System", "system"],
          ];'''
          if old_pages not in main:
              raise SystemExit('Unable to locate the Control Center page order block')
          main = main.replace(old_pages, new_pages, 1)
          main = main.replace('"0.1.3"', f'"{new_version}"')
          main_path.write_text(main, encoding='utf-8')

          validator_path = root / 'scripts' / 'validate-agent-chat-route.py'
          validator = validator_path.read_text(encoding='utf-8')
          required_shared = '''required_shared = [
              'import { logoMark } from "./icons.js"',
              'data-shared-chat-rename',
              'data-shared-chat-delete',
              'action: "rename_thread"',
              'action: "delete_thread"',
              'invoke("homeserver_create_agent_goal", { request })',
              'function removeUnexpectedControlCenterUi()',
              '.agent-chat-shell > .app-sidebar:not(.hs-chat-sidebar)',
              'sidebar.dataset.agentSidebarMode = "chat-only"',
              'lower.append(createSidebarState())',
              'sidebar.replaceChildren(createBrand(), chatSection, lower)',
              'document.querySelector(\\'[data-homeserver-agent-host="true"]\\')',
              'observer.observe(host, { childList: true, subtree: true })',
              'window.addEventListener("homeserver:rendered", scheduleDecorate)',
              'window.__HOMESERVER_AGENT_SIDEBAR_CHAT_ONLY_V2__ = true',
          ]
          required_shared_css'''
          validator, count = re.subn(
              r'required_shared = \[.*?\]\nrequired_shared_css',
              required_shared,
              validator,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Unable to replace the Agent sidebar required contract')

          requested_order = '''requested_order = [
              '["agent", "HomeServer Agent", "integrations"]',
              '["home", "Home", "home"]',
              '["dashboard", "Dashboard", "dashboard"]',
              '["models", "Model Center", "model"]',
              '["apps", "Apps", "apps"]',
              '["knowledge", "Knowledge Vault", "vault"]',
          ]
          positions = [main.index(value) for value in requested_order]
          if positions != sorted(positions):
              raise SystemExit("Requested HomeServer Control Center sidebar order is not preserved")
          '''
          validator, count = re.subn(
              r'requested_order = \[.*?raise SystemExit\("Requested HomeServer sidebar order is not preserved"\)\n',
              requested_order,
              validator,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Unable to move the navigation-order contract to main.js')

          old_forbidden = '''for forbidden in [
              'function createNavigation()',
              'function createServerCard()',
              'createNavigation(), chatSection',
              'lower.append(createServerCard()',
          ]:'''
          new_forbidden = '''for forbidden in [
              'const MENU_ITEMS',
              'function reorderPrimaryNavigation()',
              'function createNavigation()',
              'function createServerCard()',
              'data-shared-page',
              'menu: MENU_ITEMS',
          ]:'''
          if old_forbidden not in validator:
              raise SystemExit('Unable to locate removed Agent navigation assertions')
          validator = validator.replace(old_forbidden, new_forbidden, 1)
          validator = validator.replace(
              'HomeServer keeps the ordered primary sidebar on Control Center pages, uses a chat-only Agent sidebar with rename/delete controls, and omits Agent navigation and the HomeServer status card.',
              'HomeServer renders the ordered primary sidebar only on Control Center pages and a single chat-only sidebar on Agent Chat, with no Control Center navigation or HomeServer status card.',
          )
          validator_path.write_text(validator, encoding='utf-8')

          package_path = root / 'package.json'
          package = json.loads(package_path.read_text(encoding='utf-8'))
          if package.get('version') != old_version:
              raise SystemExit(f'Unexpected package version: {package.get("version")}')
          package['version'] = new_version
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          package_lock_path = root / 'package-lock.json'
          package_lock = json.loads(package_lock_path.read_text(encoding='utf-8'))
          package_lock['version'] = new_version
          package_lock['packages']['']['version'] = new_version
          package_lock_path.write_text(json.dumps(package_lock, indent=2) + '\n', encoding='utf-8')

          cargo_toml_path = root / 'Cargo.toml'
          cargo_toml = cargo_toml_path.read_text(encoding='utf-8')
          marker = f'version = "{old_version}"'
          if marker not in cargo_toml:
              raise SystemExit('Unexpected workspace Cargo version')
          cargo_toml_path.write_text(cargo_toml.replace(marker, f'version = "{new_version}"', 1), encoding='utf-8')

          tauri_path = root / 'src-tauri' / 'tauri.conf.json'
          tauri = json.loads(tauri_path.read_text(encoding='utf-8'))
          if tauri.get('version') != old_version:
              raise SystemExit(f'Unexpected Tauri version: {tauri.get("version")}')
          tauri['version'] = new_version
          tauri_path.write_text(json.dumps(tauri, indent=2) + '\n', encoding='utf-8')

          workspace = tomllib.loads(cargo_toml_path.read_text(encoding='utf-8'))
          package_names = set()
          for member in workspace['workspace']['members']:
              member_toml = root / member / 'Cargo.toml'
              data = tomllib.loads(member_toml.read_text(encoding='utf-8'))
              package_names.add(data['package']['name'])

          lock_path = root / 'Cargo.lock'
          lock = lock_path.read_text(encoding='utf-8')
          updated_packages = 0
          for name in sorted(package_names):
              pattern = rf'(\[\[package\]\]\nname = "{re.escape(name)}"\nversion = "){re.escape(old_version)}(")'
              lock, count = re.subn(pattern, rf'\g<1>{new_version}\2', lock, count=1)
              updated_packages += count
          if updated_packages == 0:
              raise SystemExit('No HomeServer workspace package versions were updated in Cargo.lock')
          lock_path.write_text(lock, encoding='utf-8')
          PY

      - name: Validate corrected Agent Chat route
        shell: bash
        run: |
          node --check src/main.js
          node --check src/shared-sidebar.js
          python scripts/validate-agent-chat-route.py
          npm ci
          npm run build
          cargo fmt --all -- --check

      - name: Commit production-only correction
        shell: bash
        run: |
          git rm .github/workflows/agent-sidebar-release-correction.yml
          git config user.name "David Evans"
          git config user.email "bigriversocial74@users.noreply.github.com"
          git add Cargo.toml Cargo.lock package.json package-lock.json src-tauri/tauri.conf.json src/main.js src/shared-sidebar.js scripts/validate-agent-chat-route.py
          git commit -m "Release chat-only Agent sidebar as HomeServer 0.1.5"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
