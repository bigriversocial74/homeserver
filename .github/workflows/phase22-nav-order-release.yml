name: Phase 22 Navigation Order Release

on:
  push:
    branches:
      - feature/unified-homeserver-agent-orchestration
    paths:
      - .github/workflows/phase22-nav-order-release.yml
      - .github/phase22-nav-order-release.trigger

permissions:
  contents: write

concurrency:
  group: phase22-nav-order-release
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/unified-homeserver-agent-orchestration
          fetch-depth: 0

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '22'
          cache: npm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Apply ordered navigation and 0.1.6 release identity
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          ordered_pages = '''const pages = [
            ["agent", "HomeServer Agent", "integrations"],
            ["home", "Home", "home"],
            ["dashboard", "Dashboard", "dashboard"],
            ["knowledge", "Knowledge Vault", "vault"],
            ["apps", "Apps", "apps"],
            ["integrations", "Integrations & Agents", "integrations"],
            ["models", "Model Center", "model"],
            ["backups", "Backups", "backup"],
            ["sync", "Sync Cloud", "cloud"],
            ["settings", "Settings", "settings"],
            ["system", "System", "system"],
          ];'''

          main_path = Path('src/main.js')
          main = main_path.read_text(encoding='utf-8')
          updated, count = re.subn(r'const pages = \[.*?\n\];', ordered_pages, main, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'Expected one pages array, replaced {count}')
          main_path.write_text(updated, encoding='utf-8')

          package_path = Path('package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          package['version'] = '0.1.6'
          package_path.write_text(json.dumps(package, indent=2) + '\n', encoding='utf-8')

          tauri_path = Path('src-tauri/tauri.conf.json')
          tauri = json.loads(tauri_path.read_text(encoding='utf-8'))
          tauri['version'] = '0.1.6'
          tauri_path.write_text(json.dumps(tauri, indent=2) + '\n', encoding='utf-8')

          cargo_path = Path('Cargo.toml')
          cargo = cargo_path.read_text(encoding='utf-8')
          cargo, count = re.subn(
              r'(?ms)(\[workspace\.package\].*?^version\s*=\s*")[^"]+("\s*$)',
              r'\g<1>0.1.6\g<2>',
              cargo,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one workspace version, replaced {count}')
          cargo_path.write_text(cargo, encoding='utf-8')
          PY

          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile

      - name: Validate release source and frontend
        shell: bash
        run: |
          npm ci
          npm run check:frontend
          npm run build
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          package = json.loads(Path('package.json').read_text(encoding='utf-8'))
          lock = json.loads(Path('package-lock.json').read_text(encoding='utf-8'))
          tauri = json.loads(Path('src-tauri/tauri.conf.json').read_text(encoding='utf-8'))
          cargo = Path('Cargo.toml').read_text(encoding='utf-8')
          cargo_lock = Path('Cargo.lock').read_text(encoding='utf-8')
          main = Path('src/main.js').read_text(encoding='utf-8')

          assert package['version'] == '0.1.6'
          assert lock['version'] == '0.1.6'
          assert lock['packages']['']['version'] == '0.1.6'
          assert tauri['version'] == '0.1.6'
          assert re.search(r'(?ms)\[workspace\.package\].*?^version\s*=\s*"0\.1\.6"', cargo)
          assert 'name = "microgifter-homeserver"\nversion = "0.1.6"' in cargo_lock

          ordered = [
              '["agent", "HomeServer Agent", "integrations"]',
              '["home", "Home", "home"]',
              '["dashboard", "Dashboard", "dashboard"]',
              '["knowledge", "Knowledge Vault", "vault"]',
              '["apps", "Apps", "apps"]',
              '["integrations", "Integrations & Agents", "integrations"]',
              '["models", "Model Center", "model"]',
              '["backups", "Backups", "backup"]',
              '["sync", "Sync Cloud", "cloud"]',
              '["settings", "Settings", "settings"]',
              '["system", "System", "system"]',
          ]
          positions = [main.index(item) for item in ordered]
          assert positions == sorted(positions)
          PY

      - name: Commit production-only release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase22-nav-order-release.yml
          git rm -f .github/phase22-nav-order-release.trigger
          git add src/main.js package.json package-lock.json Cargo.toml Cargo.lock src-tauri/tauri.conf.json
          git commit -m "Release HomeServer 0.1.6 with ordered sidebar navigation"
          git push origin HEAD:feature/unified-homeserver-agent-orchestration
