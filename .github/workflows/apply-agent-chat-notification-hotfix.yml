name: Apply Agent Chat Notification Hotfix

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - hotfix/agent-chat-notifications-clean-20260729

permissions:
  contents: write

concurrency:
  group: apply-agent-chat-notification-hotfix
  cancel-in-progress: false

jobs:
  apply-hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out clean branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: hotfix/agent-chat-notifications-clean-20260729
          fetch-depth: 0

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Copy validated frontend hotfix files
        shell: bash
        run: |
          git fetch origin hotfix/agent-chat-dead-controls-20260728
          git checkout origin/hotfix/agent-chat-dead-controls-20260728 -- \
            docs/agent-chat-interaction-hotfix.md \
            index.html \
            package.json \
            scripts/validate-agent-chat-route.py \
            scripts/validate-agent-workspace.py \
            scripts/validate-notification-menu.py \
            src/agent-workspace.js \
            src/cloud-connections.js \
            src/homeserver-agent-chat.css \
            src/homeserver-agent-chat.js \
            src/main.js \
            src/ollama-install-assistant.js \
            src/operational-data.js \
            src/review-intelligence.js \
            src/styles.css

      - name: Validate frontend
        shell: bash
        run: |
          npm ci
          npm run check:frontend
          npm run build

      - name: Commit clean hotfix and remove helper
        shell: bash
        run: |
          rm .github/workflows/apply-agent-chat-notification-hotfix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/agent-chat-interaction-hotfix.md \
            index.html \
            package.json \
            scripts/validate-agent-chat-route.py \
            scripts/validate-agent-workspace.py \
            scripts/validate-notification-menu.py \
            src/agent-workspace.js \
            src/cloud-connections.js \
            src/homeserver-agent-chat.css \
            src/homeserver-agent-chat.js \
            src/main.js \
            src/ollama-install-assistant.js \
            src/operational-data.js \
            src/review-intelligence.js \
            src/styles.css \
            .github/workflows/apply-agent-chat-notification-hotfix.yml
          git commit -m "Restore responsive Agent Chat and notification menu"
          git push origin HEAD:hotfix/agent-chat-notifications-clean-20260729
