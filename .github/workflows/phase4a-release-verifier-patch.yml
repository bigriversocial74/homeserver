name: Phase 4A Release Verifier Patch

on:
  push:
    branches:
      - feature/phase-4a-knowledge-vault-20260726
    paths:
      - scripts/phase4a_patch_release_verifier.py
      - .github/workflows/phase4a-release-verifier-patch.yml

permissions:
  contents: write

concurrency:
  group: phase4a-release-verifier-patch
  cancel-in-progress: true

jobs:
  patch:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out scoped branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-4a-knowledge-vault-20260726
          fetch-depth: 0

      - name: Apply installed-release verifier diagnostics
        run: python scripts/phase4a_patch_release_verifier.py

      - name: Validate PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/verify-installer-release.ps1),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "Installed-release verifier PowerShell syntax validation failed"
          }

      - name: Commit validated verifier update
        shell: pwsh
        run: |
          git config user.name "Microgifter HomeServer Build"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/verify-installer-release.ps1
          git diff --cached --check
          git commit -m "Harden installed-release health diagnostics"
          git push origin "HEAD:feature/phase-4a-knowledge-vault-20260726"
