name: Cloud Connector Rustfmt Artifact

on:
  pull_request:
    paths:
      - 'crates/homeserver-service/src/cloud_connector.rs'
      - 'crates/homeserver-service/src/app.rs'
      - 'src-tauri/src/cloud.rs'
      - 'src-tauri/src/lib.rs'
      - '.github/workflows/cloud-connector-rustfmt-artifact.yml'

permissions:
  contents: read

concurrency:
  group: cloud-connector-rustfmt-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Apply exact rustfmt output
        run: |
          cargo fmt --all
          git diff -- crates/homeserver-service/src/cloud_connector.rs crates/homeserver-service/src/app.rs src-tauri/src/cloud.rs src-tauri/src/lib.rs > rustfmt.diff

      - name: Upload formatted connector sources
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cloud-connector-rustfmt
          path: |
            crates/homeserver-service/src/cloud_connector.rs
            crates/homeserver-service/src/app.rs
            src-tauri/src/cloud.rs
            src-tauri/src/lib.rs
            rustfmt.diff
          if-no-files-found: error
          retention-days: 7
