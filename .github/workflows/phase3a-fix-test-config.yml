name: Phase 3A Fix Backup Test Config

on:
  push:
    branches:
      - feature/phase-3-backup-recovery-updates-20260724

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3-backup-recovery-updates-20260724
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Add imports directory to backup test fixture
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          path = Path("crates/homeserver-service/src/backup.rs")
          lines = path.read_text(encoding="utf-8").splitlines()
          field_line = '            recovery_dir: data_dir.join("recovery-packages"),'
          field_insert = '            imports_dir: data_dir.join("imports"),'
          loop_line = '            &config.recovery_dir,'
          loop_insert = '            &config.imports_dir,'

          if field_insert not in lines:
              matches = [i for i, line in enumerate(lines) if line == field_line]
              if len(matches) != 1:
                  raise SystemExit(f"expected one recovery_dir field, found {len(matches)}")
              lines.insert(matches[0] + 1, field_insert)

          if loop_insert not in lines:
              matches = [i for i, line in enumerate(lines) if line == loop_line]
              if len(matches) != 1:
                  raise SystemExit(f"expected one recovery_dir loop entry, found {len(matches)}")
              lines.insert(matches[0] + 1, loop_insert)

          if lines.count(field_insert) != 1 or lines.count(loop_insert) != 1:
              raise SystemExit("imports_dir fixture repair is not unique")

          path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          '@ | Set-Content repair_test_config.py -Encoding utf8NoBOM
          python repair_test_config.py
          cargo fmt --all

      - name: Create exact Git tree and commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "bigriversocial74/homeserver"
          $branch = "feature/phase-3-backup-recovery-updates-20260724"
          $head = (gh api "/repos/$repo/git/ref/heads/$branch" --jq ".object.sha").Trim()
          $headCommit = gh api "/repos/$repo/git/commits/$head" | ConvertFrom-Json

          $bytes = [IO.File]::ReadAllBytes("crates/homeserver-service/src/backup.rs")
          $blobPayload = @{
            content = [Convert]::ToBase64String($bytes)
            encoding = "base64"
          } | ConvertTo-Json -Compress
          $blobPayload | Set-Content blob-payload.json -Encoding utf8NoBOM
          $blob = gh api --method POST "/repos/$repo/git/blobs" --input blob-payload.json | ConvertFrom-Json

          $treePayload = @{
            base_tree = $headCommit.tree.sha
            tree = @(
              @{
                path = "crates/homeserver-service/src/backup.rs"
                mode = "100644"
                type = "blob"
                sha = $blob.sha
              },
              @{
                path = ".github/workflows/phase3a-fix-test-config.yml"
                mode = "100644"
                type = "blob"
                sha = $null
              }
            )
          } | ConvertTo-Json -Depth 8 -Compress
          $treePayload | Set-Content tree-payload.json -Encoding utf8NoBOM
          $tree = gh api --method POST "/repos/$repo/git/trees" --input tree-payload.json | ConvertFrom-Json

          $commitPayload = @{
            message = "Repair backup test AppConfig fixture"
            tree = $tree.sha
            parents = @($head)
          } | ConvertTo-Json -Depth 6 -Compress
          $commitPayload | Set-Content commit-payload.json -Encoding utf8NoBOM
          $commit = gh api --method POST "/repos/$repo/git/commits" --input commit-payload.json | ConvertFrom-Json

          $refPayload = @{
            sha = $commit.sha
            force = $false
          } | ConvertTo-Json -Compress
          $refPayload | Set-Content ref-payload.json -Encoding utf8NoBOM
          gh api --method PATCH "/repos/$repo/git/refs/heads/$branch" --input ref-payload.json | Out-Null
          Write-Host "Backup test fixture commit: $($commit.sha)"
