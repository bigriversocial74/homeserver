name: Phase 3A Fix Backup Test Config

on:
  push:
    branches:
      - feature/phase-3-backup-recovery-updates-20260724

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3-backup-recovery-updates-20260724
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Add imports directory to backup test fixture
        shell: pwsh
        run: |
          $path = "crates/homeserver-service/src/backup.rs"
          $content = Get-Content $path -Raw
          $oldField = '            recovery_dir: data_dir.join("recovery-packages"),'
          $newField = @'
            recovery_dir: data_dir.join("recovery-packages"),
            imports_dir: data_dir.join("imports"),
'@
          if (-not $content.Contains($oldField)) { throw "backup config field matcher failed" }
          $content = $content.Replace($oldField, $newField.TrimEnd("`r", "`n"))
          $oldLoop = @'
            &config.recovery_dir,
            &config.restore_dir,
'@
          $newLoop = @'
            &config.recovery_dir,
            &config.imports_dir,
            &config.restore_dir,
'@
          if (-not $content.Contains($oldLoop.TrimStart("`r", "`n"))) { throw "backup directory loop matcher failed" }
          $content = $content.Replace($oldLoop.TrimStart("`r", "`n"), $newLoop.TrimStart("`r", "`n"))
          Set-Content $path $content -Encoding utf8NoBOM
          cargo fmt --all

      - name: Create exact Git tree and commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = "bigriversocial74/homeserver"
          $branch = "feature/phase-3-backup-recovery-updates-20260724"
          $head = (gh api "/repos/$repo/git/ref/heads/$branch" --jq ".object.sha").Trim()
          $headCommit = gh api "/repos/$repo/git/commits/$head" | ConvertFrom-Json

          $bytes = [IO.File]::ReadAllBytes("crates/homeserver-service/src/backup.rs")
          $blobPayload = @{
            content = [Convert]::ToBase64String($bytes)
            encoding = "base64"
          } | ConvertTo-Json -Compress
          $blobPayload | Set-Content blob-payload.json -Encoding utf8NoBOM
          $blob = gh api --method POST "/repos/$repo/git/blobs" --input blob-payload.json | ConvertFrom-Json

          $treePayload = @{
            base_tree = $headCommit.tree.sha
            tree = @(
              @{
                path = "crates/homeserver-service/src/backup.rs"
                mode = "100644"
                type = "blob"
                sha = $blob.sha
              },
              @{
                path = ".github/workflows/phase3a-fix-test-config.yml"
                mode = "100644"
                type = "blob"
                sha = $null
              }
            )
          } | ConvertTo-Json -Depth 8 -Compress
          $treePayload | Set-Content tree-payload.json -Encoding utf8NoBOM
          $tree = gh api --method POST "/repos/$repo/git/trees" --input tree-payload.json | ConvertFrom-Json

          $commitPayload = @{
            message = "Repair backup test AppConfig fixture"
            tree = $tree.sha
            parents = @($head)
          } | ConvertTo-Json -Depth 6 -Compress
          $commitPayload | Set-Content commit-payload.json -Encoding utf8NoBOM
          $commit = gh api --method POST "/repos/$repo/git/commits" --input commit-payload.json | ConvertFrom-Json

          $refPayload = @{
            sha = $commit.sha
            force = $false
          } | ConvertTo-Json -Compress
          $refPayload | Set-Content ref-payload.json -Encoding utf8NoBOM
          gh api --method PATCH "/repos/$repo/git/refs/heads/$branch" --input ref-payload.json | Out-Null
          Write-Host "Backup test fixture commit: $($commit.sha)"
