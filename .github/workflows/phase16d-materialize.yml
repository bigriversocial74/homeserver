name: Phase 16D Materialize

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homeserver-phase16d-materialize
  cancel-in-progress: false

jobs:
  materialize:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.ref == 'feature/phase-16d-agent-lifecycle-action-policy'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-16d-agent-lifecycle-action-policy
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt
      - name: Materialize reviewed Phase 16D source
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/.phase16d-bundle-00.b64 scripts/.phase16d-bundle-01.b64 scripts/.phase16d-bundle-02.b64 scripts/.phase16d-bundle-03.b64 > /tmp/phase16d-bundle.b64
          base64 -d /tmp/phase16d-bundle.b64 > /tmp/phase16d-bundle.tar.gz
          mkdir -p /tmp/phase16d-materialized
          tar -xzf /tmp/phase16d-bundle.tar.gz -C /tmp/phase16d-materialized
          install -m 0644 /tmp/phase16d-materialized/wrapper_agents.rs crates/homeserver-service/src/app/wrapper_agents.rs
          install -m 0644 /tmp/phase16d-materialized/validate-wrapper-agents.py scripts/validate-wrapper-agents.py
          install -m 0644 /tmp/phase16d-materialized/phase-16d-agent-lifecycle-action-policy.md docs/phase-16d-agent-lifecycle-action-policy.md
          install -m 0644 /tmp/phase16d-materialized/phase16d-agent-lifecycle.yml .github/workflows/phase16d-agent-lifecycle.yml
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path)
              text=p.read_text(encoding='utf-8')
              count=text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one match in {path}, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old,new), encoding='utf-8')

          validator='scripts/validate-wrapper-agents.py'
          replace_once(validator,
              'require("use super::{wrapper_agents, wrapper_grants" in jobs, "wrapper jobs do not import agent authority")',
              'require("use super::wrapper_agents;" in jobs, "wrapper jobs do not import agent authority")')

          app='crates/homeserver-service/src/app.rs'
          replace_once(app,
              '#[path = "app/wrapper_jobs.rs"]\nmod wrapper_jobs;\n',
              '#[path = "app/wrapper_jobs.rs"]\nmod wrapper_jobs;\n\n#[path = "app/wrapper_agents.rs"]\nmod wrapper_agents;\n')
          replace_once(app,
              '    wrapper_jobs::initialize(&connection)?;\n',
              '    wrapper_jobs::initialize(&connection)?;\n    wrapper_agents::initialize(&connection)?;\n')
          replace_once(app,
              '            .merge(wrapper_jobs::router(state.clone()))\n',
              '            .merge(wrapper_jobs::router(state.clone()))\n            .merge(wrapper_agents::router(state.clone()))\n')
          replace_once(app,
              '                        if let Err(error) = wrapper_jobs::maintain_history(&connection) {\n                            warn!(?error, "scheduled wrapper job retention failed");\n                        }\n',
              '                        if let Err(error) = wrapper_jobs::maintain_history(&connection) {\n                            warn!(?error, "scheduled wrapper job retention failed");\n                        }\n                        if let Err(error) = wrapper_agents::maintain_history(&connection) {\n                            warn!(?error, "scheduled wrapper agent retention failed");\n                        }\n')

          jobs='crates/homeserver-service/src/app/wrapper_jobs.rs'
          replace_once(jobs,
              'use super::wrapper_grants::{self, AuthorizeRequest};\n',
              'use super::wrapper_agents;\nuse super::wrapper_grants::{self, AuthorizeRequest};\n')

          submit='crates/homeserver-service/src/app/wrapper_jobs_submit.rs'
          replace_once(submit,
              '    let connection_authority_revision =\n        current_connection_authority_revision(&connection, &connection_id)?;\n',
              '    let agent_binding = if submitted_by_type == "agent" {\n        Some(wrapper_agents::validate_agent_job_submission(\n            &connection,\n            &submitted_by_id,\n            &connection_id,\n            &grant_id,\n            &capability_key,\n            &operation,\n            &job_type,\n        )?)\n    } else {\n        None\n    };\n    let connection_authority_revision =\n        current_connection_authority_revision(&connection, &connection_id)?;\n')
          replace_once(submit,
              '    let job = job_record_by_id_tx(&transaction, &job_id)?;\n',
              '    if let Some(binding) = agent_binding.as_ref() {\n        wrapper_agents::bind_agent_job_tx(&transaction, &job_id, binding)?;\n    }\n    let job = job_record_by_id_tx(&transaction, &job_id)?;\n')

          reconcile='crates/homeserver-service/src/app/wrapper_jobs_reconcile.rs'
          replace_once(reconcile,
              '    Ok(matches!(connection_state.as_str(), "active" | "offline" | "grace")\n        && wrapper_state == "active"\n        && grant_state == "active"\n        && decision_outcome == "allowed"\n        && connection_revision.max(0) as u64 == job.connection_authority_revision\n        && grant_revision.max(0) as u64 == job.grant_revision\n        && parse_utc(&grant_expires, "grant expiration")? > Utc::now())\n',
              '    let base_current = matches!(connection_state.as_str(), "active" | "offline" | "grace")\n        && wrapper_state == "active"\n        && grant_state == "active"\n        && decision_outcome == "allowed"\n        && connection_revision.max(0) as u64 == job.connection_authority_revision\n        && grant_revision.max(0) as u64 == job.grant_revision\n        && parse_utc(&grant_expires, "grant expiration")? > Utc::now();\n    Ok(base_current\n        && wrapper_agents::agent_job_authority_is_current_tx(transaction, &job.job_id)?)\n')

          package='package.json'
          replace_once(package,
              'validate-wrapper-jobs.py"',
              'validate-wrapper-jobs.py validate-wrapper-agents.py"')
          PY
          cargo fmt --all
          python scripts/validate-wrapper-agents.py
      - name: Commit complete Phase 16D candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/phase16d-materialize.yml scripts/.phase16d-bundle-00.b64 scripts/.phase16d-bundle-01.b64 scripts/.phase16d-bundle-02.b64 scripts/.phase16d-bundle-03.b64
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/phase16d-agent-lifecycle.yml crates/homeserver-service/src/app.rs crates/homeserver-service/src/app/wrapper_agents.rs crates/homeserver-service/src/app/wrapper_jobs.rs crates/homeserver-service/src/app/wrapper_jobs_submit.rs crates/homeserver-service/src/app/wrapper_jobs_reconcile.rs docs/phase-16d-agent-lifecycle-action-policy.md package.json scripts/validate-wrapper-agents.py .github/workflows/phase16d-materialize.yml
          git commit -m 'Build Phase 16D agent lifecycle and action authority'
          git push origin HEAD:feature/phase-16d-agent-lifecycle-action-policy
