name: Phase 23C Native Compiler Diagnostics

on:
  push:
    branches:
      - feature/phase-23c-local-whisper-transcription
    paths:
      - .github/workflows/phase23c-native-diagnostics.yml

permissions:
  contents: write

concurrency:
  group: phase23c-native-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact Phase 23C branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-23c-local-whisper-transcription
          fetch-depth: 0

      - name: Install Linux desktop and native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential cmake clang libclang-dev \
            libglib2.0-dev libgtk-3-dev libwebkit2gtk-4.1-dev \
            libappindicator3-dev librsvg2-dev libssl-dev patchelf

      - name: Configure stable Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Capture compiler output without hiding the exit code
        shell: bash
        run: |
          set +e
          cargo test -p microgifter-homeserver-control-center whisper::tests --no-run > phase23c-native-build.log 2>&1
          status=$?
          echo "$status" > phase23c-native-exit-code.txt
          python - <<'PY'
          from pathlib import Path
          lines = Path('phase23c-native-build.log').read_text(encoding='utf-8', errors='replace').splitlines()
          selected = []
          for index, line in enumerate(lines):
              lowered = line.lower()
              if ('error[' in lowered or lowered.startswith('error:') or
                  'src-tauri/src/whisper.rs' in line or
                  'failed to run custom build command' in lowered or
                  'could not compile' in lowered):
                  start = max(0, index - 4)
                  end = min(len(lines), index + 12)
                  selected.extend(lines[start:end])
          compact = []
          previous = None
          for line in selected:
              if line != previous:
                  compact.append(line)
              previous = line
          if not compact:
              compact = lines[-160:]
          Path('phase23c-native-errors.txt').write_text(
              '\n'.join(compact[-400:]) + '\n', encoding='utf-8'
          )
          PY

      - name: Commit focused diagnostics and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/phase23c-native-diagnostics.yml
          git add phase23c-native-errors.txt phase23c-native-exit-code.txt
          git diff --cached --check
          git commit -m "Capture Phase 23C native compiler diagnostics"
          git push origin HEAD:feature/phase-23c-local-whisper-transcription
