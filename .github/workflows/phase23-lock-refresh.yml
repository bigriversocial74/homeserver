name: Phase 23A Canonical Lock Refresh

on:
  push:
    branches:
      - feature/phase-23-agent-chat-ears-conversation-engine
    paths:
      - .github/workflows/phase23-lock-refresh.yml

permissions:
  contents: write

concurrency:
  group: phase23-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out draft branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-23-agent-chat-ears-conversation-engine
          fetch-depth: 0

      - name: Configure canonical Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: stable

      - name: Refresh lock and remove workflow
        shell: pwsh
        run: |
          cargo generate-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item .github/workflows/phase23-lock-refresh.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock .github/workflows/phase23-lock-refresh.yml
          git commit -m "Refresh canonical Cargo dependency lock"
          git push origin HEAD:feature/phase-23-agent-chat-ears-conversation-engine
