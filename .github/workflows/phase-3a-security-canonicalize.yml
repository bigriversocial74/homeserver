name: Phase 3A Security Canonicalization

on:
  push:
    branches:
      - feature/phase-3-backup-recovery-updates-20260724

permissions:
  contents: write
  issues: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3-backup-recovery-updates-20260724

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Apply security corrections
        id: patch_source
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY' 2>&1 | tee security-patch.log
          from pathlib import Path

          def replace_required(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f"expected pattern not found: {label}")
              return text.replace(old, new, 1)

          backup_path = Path("crates/homeserver-service/src/backup.rs")
          text = backup_path.read_text()
          if "use rusqlite::{backup::Backup, Connection, OpenFlags};" not in text:
              text = replace_required(text, "use rusqlite::{backup::Backup, Connection};", "use rusqlite::{backup::Backup, Connection, OpenFlags};", "rusqlite imports")
          if "use zeroize::Zeroizing;" not in text:
              text = replace_required(text, "use zeroize::Zeroize;", "use zeroize::Zeroizing;", "zeroizing import")
          if "let (mut key, salt)" in text:
              text = replace_required(
                  text,
                  "        let (mut key, salt) = encryption_key(&installation_id, &kind, passphrase)?;\n        let mut nonce_bytes = [0_u8; 12];",
                  "        let (key, salt) = encryption_key(&installation_id, &kind, passphrase)?;\n        let key = Zeroizing::new(key);\n        let mut nonce_bytes = [0_u8; 12];",
                  "encryption key guard",
              )
          text = text.replace("        key.zeroize();\n\n        let header = PackageHeader {", "        let header = PackageHeader {", 1)
          if "let mut key = decryption_key" in text:
              text = replace_required(
                  text,
                  "    let mut key = decryption_key(&installation_id, &header, passphrase)?;",
                  "    let key = Zeroizing::new(decryption_key(&installation_id, &header, passphrase)?);",
                  "decryption key guard",
              )
          text = text.replace("    key.zeroize();\n    ensure!(", "    ensure!(", 1)
          if "remove_sqlite_sidecars(&config.database_path);\n            if let Some(rollback_path)" not in text:
              text = replace_required(
                  text,
                  "            let _ = fs::rename(&config.database_path, failed_path);\n            if let Some(rollback_path) = rollback_path {",
                  "            let _ = fs::rename(&config.database_path, failed_path);\n            remove_sqlite_sidecars(&config.database_path);\n            if let Some(rollback_path) = rollback_path {",
                  "rollback sidecar cleanup",
              )

          key_start = text.index("fn load_or_create_device_key")
          key_end = text.index("fn create_sqlite_snapshot", key_start)
          key_functions = '''fn load_or_create_device_key(installation_id: &str) -> Result<[u8; 32]> {
              let entry = device_key_entry(installation_id)?;
              match entry.get_password() {
                  Ok(encoded) => decode_device_key(&encoded),
                  Err(keyring::Error::NoEntry) => {
                      let mut key = [0_u8; 32];
                      OsRng.fill_bytes(&mut key);
                      entry
                          .set_password(&URL_SAFE_NO_PAD.encode(key))
                          .context("unable to save the HomeServer backup encryption key")?;
                      Ok(key)
                  }
                  Err(error) => Err(error).context("HomeServer backup encryption key is unavailable"),
              }
          }

          fn load_device_key(installation_id: &str) -> Result<[u8; 32]> {
              let encoded = device_key_entry(installation_id)?
                  .get_password()
                  .context("HomeServer backup encryption key is unavailable")?;
              decode_device_key(&encoded)
          }

          fn decode_device_key(encoded: &str) -> Result<[u8; 32]> {
              let decoded = URL_SAFE_NO_PAD
                  .decode(encoded)
                  .context("HomeServer backup encryption key is invalid")?;
              ensure!(
                  decoded.len() == 32,
                  "HomeServer backup encryption key is invalid"
              );
              let mut key = [0_u8; 32];
              key.copy_from_slice(&decoded);
              Ok(key)
          }

          '''
          text = text[:key_start] + key_functions + text[key_end:]

          verify_start = text.index("fn verify_sqlite_database")
          verify_end = text.index("fn enforce_retention", verify_start)
          verify_function = '''fn verify_sqlite_database(path: &Path) -> Result<()> {
              let connection = Connection::open_with_flags(
                  path,
                  OpenFlags::SQLITE_OPEN_READ_ONLY | OpenFlags::SQLITE_OPEN_NO_MUTEX,
              )?;
              database::health_check(&connection)
          }

          '''
          text = text[:verify_start] + verify_function + text[verify_end:]
          backup_path.write_text(text)

          main_path = Path("crates/homeserver-service/src/main.rs")
          text = main_path.read_text()
          if "BackupCatalog, BackupKind," not in text:
              text = replace_required(
                  text,
                  '''use microgifter_homeserver_core::{
              BackupActionResult, BackupCatalog, BackupReferenceRequest, BackupState, CreateBackupRequest,
              HealthSnapshot, SERVICE_NAME,
          };''',
                  '''use microgifter_homeserver_core::{
              BackupActionResult, BackupCatalog, BackupKind, BackupReferenceRequest, BackupState,
              CreateBackupRequest, HealthSnapshot, SERVICE_NAME,
          };''',
                  "BackupKind import",
              )
          if "reserved for internal HomeServer operations" not in text:
              text = replace_required(
                  text,
                  '''    fn create_backup(&self, request: CreateBackupRequest) -> Result<BackupActionResult> {
              backup::create_backup(&self.connection()?, &self.config, request)
          }''',
                  '''    fn create_backup(&self, request: CreateBackupRequest) -> Result<BackupActionResult> {
              match request.kind {
                  BackupKind::Manual | BackupKind::Recovery => {
                      backup::create_backup(&self.connection()?, &self.config, request)
                  }
                  BackupKind::Automatic | BackupKind::PreUpdate => {
                      bail!("backup kind is reserved for internal HomeServer operations")
                  }
              }
          }''',
                  "public backup kind restriction",
              )
          main_path.write_text(text)
          print("Phase 3A security source patch applied.")
          PY
          exit ${PIPESTATUS[0]}

      - name: Canonicalize dependency lock and formatting
        id: canonicalize
        if: steps.patch_source.outcome == 'success'
        continue-on-error: true
        run: |
          cargo generate-lockfile
          cargo fmt --all

      - name: Commit canonical security corrections
        id: commit_source
        if: steps.patch_source.outcome == 'success' && steps.canonicalize.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          git add Cargo.lock crates/homeserver-core crates/homeserver-service
          if git diff --cached --quiet; then
            echo "No security corrections required."
            exit 0
          fi
          git config user.name "Microgifter Build Bot"
          git config user.email "buildbot@microgifter.local"
          git commit -m "Harden Phase 3A backup keys and request secrets"
          git push origin HEAD:feature/phase-3-backup-recovery-updates-20260724

      - name: Report security canonicalization
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Phase 3A security canonicalization"
            echo
            echo 'Commit: `${{ github.sha }}`'
            echo
            echo "- Source patch: **${{ steps.patch_source.outcome }}**"
            echo "- Lock and formatting: **${{ steps.canonicalize.outcome }}**"
            echo "- Branch commit: **${{ steps.commit_source.outcome }}**"
            if test -f security-patch.log; then
              echo
              echo '<details><summary>security-patch.log</summary>'
              echo
              echo '```text'
              tail -100 security-patch.log
              echo '```'
              echo
              echo '</details>'
            fi
          } > security-report.md
          gh issue comment 4 --repo bigriversocial74/homeserver --body-file security-report.md

      - name: Enforce successful canonicalization
        if: always()
        shell: bash
        run: |
          test "${{ steps.patch_source.outcome }}" = "success"
          test "${{ steps.canonicalize.outcome }}" = "success"
          test "${{ steps.commit_source.outcome }}" = "success"
