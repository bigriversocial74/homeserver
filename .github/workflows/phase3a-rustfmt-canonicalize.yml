name: Phase 3A Recovery Transfer Rustfmt

on:
  push:
    branches:
      - feature/phase-3-backup-recovery-updates-20260724

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: feature/phase-3-backup-recovery-updates-20260724
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          components: rustfmt

      - name: Canonicalize Rust formatting
        run: cargo fmt --all

      - name: Commit canonical formatting
        shell: pwsh
        run: |
          git rm .github/workflows/phase3a-rustfmt-canonicalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates src-tauri .github/workflows/phase3a-rustfmt-canonicalize.yml
          git diff --cached --stat
          git commit -m "Canonicalize recovery transfer Rust formatting"
          git push origin HEAD:feature/phase-3-backup-recovery-updates-20260724
